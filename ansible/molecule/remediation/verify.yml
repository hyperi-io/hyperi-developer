---
# Assert the remediation did the right thing — in BOTH directions.
#
# Removing the retired stuff is only half the test. A remediation that also
# deletes a sibling project's artefacts, or the user's own tools, is a bug —
# and a worse one, because it destroys things nobody asked us to touch. So the
# "must survive" assertions below matter at least as much as the removals.

- name: Verify remediation
  hosts: all
  gather_facts: true

  tasks:
    # ==================================================================
    # MUST BE GONE
    # ==================================================================
    - name: Stat artefacts that must be gone
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop:
        - uv          # stale root-owned copy shadowing the real install
        - bw          # Bitwarden — removed by decision
        - linear      # Linear CLI — removed by decision
        - minikube    # superseded by kind
      register: verify_gone

    - name: Assert retired artefacts were removed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          /usr/local/bin/{{ item.item }} survived remediation. Its tombstone did
          not fire — Ansible cannot prune what it stops declaring, so if the
          tombstone is missing or mis-pathed the artefact lives forever.
        success_msg: "/usr/local/bin/{{ item.item }} removed"
      loop: "{{ verify_gone.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert retired packages were removed
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.packages
        fail_msg: "{{ item }} is still installed — its tombstone did not fire."
        success_msg: "{{ item }} removed"
      loop:
        - telnet
        - net-tools
        - nmap
        - whois
        - traceroute
        - tree
        - httpie
        - docker-desktop
      loop_control:
        label: "{{ item }}"

    # ==================================================================
    # MUST SURVIVE — the half that stops us becoming destructive
    # ==================================================================
    - name: Stat artefacts that must survive
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop:
        - disk-attach            # hyperi-infra's (server_base role)
        - hyperi-boot-tuning.sh  # hyperi-infra's (server_base role)
        - tinygo                 # user's own — undeclared, not ours to remove
        - github-mcp-server      # user's own — undeclared, not ours to remove
      register: verify_survive

    - name: Assert we did not delete things that are not ours
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          /usr/local/bin/{{ item.item }} was REMOVED and should not have been.
          disk-attach and hyperi-boot-tuning.sh belong to hyperi-infra
          (disk-attach.service attaches disks at boot — removing it can break
          storage). tinygo and github-mcp-server have no owner in either
          project, so they are the user's own: on a developer workstation
          undeclared state is legitimate. "Not declared by us" does not mean
          "ours to remove".
        success_msg: "/usr/local/bin/{{ item.item }} correctly left alone"
      loop: "{{ verify_survive.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ==================================================================
    # THE REPLACEMENT ACTUALLY WORKS — removing the old thing is not enough
    # if the new one never arrived.
    # ==================================================================
    - name: Resolve which uv wins on PATH after remediation
      ansible.builtin.command: which uv
      register: verify_uv_which
      changed_when: false
      failed_when: false

    - name: Assert uv resolves to the managed install, not a stale copy
      ansible.builtin.assert:
        that:
          - verify_uv_which.rc == 0
          - "'/usr/local/bin/uv' not in verify_uv_which.stdout"
        fail_msg: >-
          uv resolves to '{{ verify_uv_which.stdout }}'. Expected the managed
          install (repo on Fedora, ~/.local/bin on Ubuntu). If it still points
          at /usr/local/bin the host looks current while silently rotting —
          which is exactly the failure this test exists to catch.
        success_msg: "uv resolves to {{ verify_uv_which.stdout }}"

    # ==================================================================
    # CHANNEL MIGRATIONS — a tool that moved to a repo must resolve to the
    # PACKAGE, not to the binary the old revision left in /usr/local/bin.
    # Removing the old copy is the whole point: /usr/local/bin precedes
    # /usr/bin, so a survivor wins forever and no update ever touches it.
    # ==================================================================
    - name: Resolve the tools that moved to a distro package (Fedora)
      ansible.builtin.command: "which {{ item }}"
      loop:
        - yq
        - kustomize
      register: verify_migrated
      changed_when: false
      failed_when: false
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Assert the migrated tools resolve to the packaged copy
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - "'/usr/local/bin/' not in item.stdout"
        fail_msg: >-
          {{ item.item }} resolves to '{{ item.stdout }}'. It moved to the dnf
          package in /usr/bin, so a /usr/local/bin survivor shadows it on the
          default PATH and pins the host to a copy nothing updates.
        success_msg: "{{ item.item }} resolves to {{ item.stdout }}"
      loop: "{{ verify_migrated.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('skipped') }}"
      when: ansible_facts['distribution'] == 'Fedora'

    - name: List the installed flatpaks (Ubuntu)
      ansible.builtin.command: flatpak list --app --columns=application
      register: verify_flatpaks
      changed_when: false
      failed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Assert the DBeaver flatpak gave way to the apt package (Ubuntu)
      ansible.builtin.assert:
        that:
          - "'io.dbeaver.DBeaverCommunity' not in verify_flatpaks.stdout"
        fail_msg: >-
          The DBeaver flatpak survived. Ubuntu takes DBeaver from the vendor apt
          repo now, and leaving the flatpak puts a second DBeaver in the desktop
          menu — the sandboxed one, which cannot read ~/.ssh or a unix socket.
        success_msg: "DBeaver flatpak removed"
      when: ansible_facts['distribution'] == 'Ubuntu'

    # ==================================================================
    # PATH HYGIENE — the unguarded prepends must be gone, and each directory
    # must appear exactly once in a login shell.
    # ==================================================================
    - name: Read the PATH a login shell ends up with
      ansible.builtin.shell: bash -lc 'printf "%s" "$PATH"'
      register: verify_login_path
      changed_when: false

    - name: Assert no directory is stacked on PATH
      ansible.builtin.assert:
        that:
          - verify_login_path.stdout.split(':') | select('equalto', item) | list | length <= 1
        fail_msg: >-
          {{ item }} appears
          {{ verify_login_path.stdout.split(':') | select('equalto', item) | list | length }}
          times on PATH. Every prepend must test `case ":$PATH:"` first —
          /etc/profile is re-read by each login shell and ~/.bashrc by each
          interactive one, so an unguarded one stacks a copy per nested shell.
        success_msg: "{{ item }} appears once on PATH"
      loop:
        - "{{ ansible_env.HOME }}/.cargo/bin"
        - "{{ ansible_env.HOME }}/.local/bin"
        - "{{ ansible_env.HOME }}/.npm-global/bin"
      loop_control:
        label: "{{ item }}"
