---
# Assert the remediation did the right thing — in BOTH directions.
#
# Removing the retired stuff is only half the test. A remediation that also
# deletes a sibling project's artefacts, or the user's own tools, is a bug —
# and a worse one, because it destroys things nobody asked us to touch. So the
# "must survive" assertions below matter at least as much as the removals.

- name: Verify remediation
  hosts: all
  gather_facts: true
  # molecule.yml scopes the run to `--tags removals`, and that tag reaches every
  # playbook. The assertions must run regardless.
  tags: always

  tasks:
    # ==================================================================
    # MUST BE GONE
    # ==================================================================
    - name: Stat artefacts that must be gone
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop:
        - uv          # stale root-owned copy shadowing the real install
        - bw          # Bitwarden — removed by decision
        - linear      # Linear CLI — removed by decision
        - minikube    # superseded by kind
      register: verify_gone

    - name: Assert retired artefacts were removed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          /usr/local/bin/{{ item.item }} survived remediation. Its tombstone did
          not fire — Ansible cannot prune what it stops declaring, so if the
          tombstone is missing or mis-pathed the artefact lives forever.
        success_msg: "/usr/local/bin/{{ item.item }} removed"
      loop: "{{ verify_gone.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Ubuntu only, like the assertion that reads it: on Fedora package_facts
    # needs rpm Python bindings a minimal image lacks.
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts['distribution'] == 'Ubuntu'

    # Ubuntu only: prepare.yml installs these through apt, and the names are
    # Debian's.
    - name: Assert retired packages were removed
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.packages
        fail_msg: "{{ item }} is still installed — its tombstone did not fire."
        success_msg: "{{ item }} removed"
      loop:
        - telnet
        - net-tools
        - nmap
        - whois
        - traceroute
        - tree
        - httpie
        - docker-desktop
      loop_control:
        label: "{{ item }}"
      when: ansible_facts['distribution'] == 'Ubuntu'

    # ==================================================================
    # SUPERSEDED BY A PACKAGE -- both directions, per distro. A copy goes
    # where prepare installed the package that replaces it, and stays where
    # it did not: there it is the only working copy.
    # ==================================================================
    - name: Stat the copies a package supersedes
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop: "{{ verify_superseded_gone[ansible_facts['distribution']] | default([]) }}"
      register: verify_superseded_gone_stat
      vars:
        verify_superseded_gone:
          Ubuntu: [kubectx, kubens, helm]
          Fedora: [k9s, gitleaks]

    - name: Assert the superseded copies were removed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          /usr/local/bin/{{ item.item }} survived beside the package that
          supplies it. /usr/local/bin precedes /usr/bin on PATH, so it shadows
          the package and nothing updates it.
        success_msg: "/usr/local/bin/{{ item.item }} removed"
      loop: "{{ verify_superseded_gone_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat the copies with no package behind them
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop: "{{ verify_superseded_kept[ansible_facts['distribution']] | default([]) }}"
      register: verify_superseded_kept_stat
      vars:
        # Fedora helm and kustomize have a /usr/bin entry that is a link back
        # into /usr/local/bin and a dangling link -- not a packaged copy.
        verify_superseded_kept:
          Ubuntu: [k9s, gitleaks]
          Fedora: [kubectx, kubens, helm, kustomize]

    - name: Assert copies with no package behind them were left alone
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          /usr/local/bin/{{ item.item }} was REMOVED although no package
          supplies it here. It was the only working copy of the tool.
        success_msg: "/usr/local/bin/{{ item.item }} correctly left alone"
      loop: "{{ verify_superseded_kept_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The tombstones touch /usr/local/bin only; the package's own files stay.
    # Ubuntu only: prepare installs the kubectx package there.
    - name: Stat the packaged kubectx and kubens (Ubuntu)
      ansible.builtin.stat:
        path: "/usr/bin/{{ item }}"
      loop: "{{ ['kubectx', 'kubens'] if ansible_facts['distribution'] == 'Ubuntu' else [] }}"
      register: verify_packaged_kubectx

    - name: Assert the packaged kubectx and kubens survived
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "/usr/bin/{{ item.item }} is gone -- a tombstone removed the package's own file."
        success_msg: "/usr/bin/{{ item.item }} intact"
      loop: "{{ verify_packaged_kubectx.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ==================================================================
    # MUST SURVIVE — the half that stops us becoming destructive
    # ==================================================================
    - name: Stat artefacts that must survive
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop:
        - disk-attach            # hyperi-infra's (server_base role)
        - hyperi-boot-tuning.sh  # hyperi-infra's (server_base role)
        - tinygo                 # user's own — undeclared, not ours to remove
        - github-mcp-server      # user's own — undeclared, not ours to remove
      register: verify_survive

    - name: Assert we did not delete things that are not ours
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          /usr/local/bin/{{ item.item }} was REMOVED and should not have been.
          disk-attach and hyperi-boot-tuning.sh belong to hyperi-infra
          (disk-attach.service attaches disks at boot — removing it can break
          storage). tinygo and github-mcp-server have no owner in either
          project, so they are the user's own: on a developer workstation
          undeclared state is legitimate. "Not declared by us" does not mean
          "ours to remove".
        success_msg: "/usr/local/bin/{{ item.item }} correctly left alone"
      loop: "{{ verify_survive.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ==================================================================
    # THE STALE COPY NO LONGER WINS — removing the tombstoned binary is only
    # worth anything if nothing still resolves to it.
    #
    # This scenario converges `--tags removals`, which removes and installs
    # nothing, so it cannot assert the replacement ARRIVED. That half belongs to
    # `existing-host`, which converges the whole playbook. Asserting it here
    # would only ever prove the scenario's own tag scope.
    # ==================================================================
    - name: Resolve which uv wins on PATH after remediation
      ansible.builtin.command: which uv
      register: verify_uv_which
      changed_when: false
      failed_when: false

    - name: Assert uv no longer resolves to the stale /usr/local/bin copy
      ansible.builtin.assert:
        that:
          - "'/usr/local/bin/uv' not in verify_uv_which.stdout"
        fail_msg: >-
          uv still resolves to '{{ verify_uv_which.stdout }}'. The tombstone did
          not fire, so the host looks current while silently rotting — which is
          exactly the failure this test exists to catch.
        success_msg: >-
          uv does not resolve to the stale copy
          (resolved: '{{ verify_uv_which.stdout | default('nothing', true) }}')

    # The Fedora yq migration is not asserted here: its removal sits in the
    # install path of utilities.yml, which a removals-only run never reaches.
    # kustomize is covered in the superseded-by-a-package section above.
    # The repo is the half that keeps serving BUSL packages if it survives.
    - name: Stat the HashiCorp repository artefacts (Ubuntu)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/hashicorp.sources
        - /etc/apt/sources.list.d/hashicorp.list
        - /usr/share/keyrings/hashicorp-archive-keyring.asc
        - /usr/share/keyrings/hashicorp-archive-keyring.gpg
      register: verify_hashicorp
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Assert the HashiCorp repository was unhooked
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          {{ item.item }} survived remediation. The HashiCorp repo goes on
          serving BUSL packages and updates for as long as it is configured,
          so leaving it is worse than leaving the binaries.
        success_msg: "{{ item.item }} removed"
      loop: "{{ verify_hashicorp.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('skipped') }}"
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Stat the retired vendor repository artefacts (Ubuntu)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/jfrog-cli.list
        - /etc/apt/sources.list.d/onlyoffice.list
      register: verify_retired_repos
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Assert the retired vendor repositories were unhooked
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          {{ item.item }} survived remediation. The tool is long gone but its
          repository keeps being fetched on every apt update.
        success_msg: "{{ item.item }} removed"
      loop: "{{ verify_retired_repos.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('skipped') }}"
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: List the installed flatpaks (Ubuntu)
      ansible.builtin.command: flatpak list --app --columns=application
      register: verify_flatpaks
      changed_when: false
      failed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Assert the DBeaver flatpak gave way to the apt package (Ubuntu)
      ansible.builtin.assert:
        that:
          - "'io.dbeaver.DBeaverCommunity' not in verify_flatpaks.stdout"
        fail_msg: >-
          The DBeaver flatpak survived. Ubuntu takes DBeaver from the vendor apt
          repo now, and leaving the flatpak puts a second DBeaver in the desktop
          menu — the sandboxed one, which cannot read ~/.ssh or a unix socket.
        success_msg: "DBeaver flatpak removed"
      when: ansible_facts['distribution'] == 'Ubuntu'

    # ==================================================================
    # HAND-INSTALLED DUPLICATES -- both directions.
    # ==================================================================
    - name: Stat the user-level copies
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item.path }}"
        follow: false
      loop:
        - {path: .local/bin/kind, gone: true}
        - {path: go/bin/dive, gone: true}
        - {path: .local/bin/kubeconform, gone: false}
        - {path: .local/bin/tinygo-dev, gone: false}
        - {path: .local/bin/argocd, gone: false}
        - {path: .local/bin/dive, gone: false}
        - {path: .local/bin/kubectx, gone: false}
        - {path: .local/bin/yq, gone: false}
      loop_control:
        label: "{{ item.path }}"
      register: verify_user_copies

    - name: Assert user-level duplicates went and everything else stayed
      ansible.builtin.assert:
        that:
          - (item.stat.exists or item.stat.islnk | default(false)) != item.item.gone
        fail_msg: >-
          ~/{{ item.item.path }} {{ 'survived beside the managed copy it shadows'
          if item.item.gone else 'was REMOVED -- it was the only copy, a link, a
          directory, or a tool the sweep does not cover' }}.
        success_msg: "~/{{ item.item.path }} {{ 'removed' if item.item.gone else 'left alone' }}"
      loop: "{{ verify_user_copies.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    # The managed copies themselves must never be what goes.
    - name: Stat the managed copies behind the duplicates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/kind
        - /usr/local/bin/dive
        - /usr/local/bin/argocd
        - /usr/local/bin/macbash
        - /usr/local/bin/git-scrub
        - /usr/local/bin/yq
        - /usr/local/go/bin/go
      register: verify_managed_copies

    - name: Assert the managed copies survived
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "{{ item.item }} is gone -- a duplicate sweep removed the managed copy."
        success_msg: "{{ item.item }} intact"
      loop: "{{ verify_managed_copies.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Re-read the installed packages
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: List the installed packages (Fedora)
      ansible.builtin.command:
        argv: [rpm, -qa, --qf, "%{NAME}\n"]
      register: verify_rpms
      changed_when: false
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Collect the installed package names
      ansible.builtin.set_fact:
        verify_installed: >-
          {{ ansible_facts.packages.keys() | list if ansible_facts['distribution'] == 'Ubuntu'
             else verify_rpms.stdout_lines }}

    # On the golink host /usr/local/go IS the distro tree, so the distro Go
    # stays. On Fedora the repository golangci-lint requires golang, so it stays
    # there too.
    - name: Assert the hand-installed and distro duplicates were removed
      ansible.builtin.assert:
        that:
          - verify_installed | select('match', item) | list | length == 0
        fail_msg: "{{ item }} is still installed beside the managed copy it duplicates."
        success_msg: "{{ item }} removed"
      loop: >-
        {{ ['^macbash$']
           + ([] if 'golink' in inventory_hostname else
              (['^golang-go$', '^golang-src$', '^golang-[0-9.]+-go$']
               if ansible_facts['distribution'] == 'Ubuntu' else [])) }}

    - name: Assert the packages that must stay are still installed
      ansible.builtin.assert:
        that:
          - item in verify_installed
        fail_msg: >-
          {{ item }} was removed. It has a dependant, is not on the purge list,
          is offered by a repository, or is the only Go.
        success_msg: "{{ item }} kept"
      loop: >-
        {{ ((['git-scrub', 'git-scrub-dependant', 'kind', 'dive']
             + (['golang-go'] if 'golink' in inventory_hostname else []))
            if ansible_facts['distribution'] == 'Ubuntu'
            else ['golangci-lint', 'golang']) }}

    # The Go purge must not leave the compiler toolchain for the updater's
    # unattended autoremove to take.
    - name: Simulate the updater's autoremove (Ubuntu)
      ansible.builtin.command:
        argv: [apt-get, -s, autoremove]
      register: verify_autoremove
      changed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Assert the Go purge orphaned no compiler toolchain (Ubuntu)
      ansible.builtin.assert:
        that:
          - verify_autoremove.stdout_lines | select('match', '^Remv ' ~ item ~ ' ') | list | length == 0
        fail_msg: "apt-get autoremove would now remove {{ item }}, orphaned by the Go purge."
        success_msg: "{{ item }} not autoremovable"
      loop:
        - gcc
        - binutils
        - libc6-dev
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: List what dnf would autoremove (Fedora)
      ansible.builtin.command:
        argv: [dnf, -q, repoquery, --unneeded, --qf, "%{name}\n"]
      register: verify_unneeded
      changed_when: false
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Assert the Go purge orphaned no compiler toolchain (Fedora)
      ansible.builtin.assert:
        that:
          - item not in verify_unneeded.stdout_lines
        fail_msg: "dnf autoremove would now remove {{ item }}, orphaned by the Go purge."
        success_msg: "{{ item }} not autoremovable"
      loop:
        - gcc
        - binutils
        - glibc-devel
      when: ansible_facts['distribution'] == 'Fedora'

    # PATH hygiene is NOT asserted here. The tasks that drop the unguarded
    # ~/.bashrc prepends live in the install path of the developer and
    # developer-rust roles, not under the `removals` tag this scenario
    # converges, so an assertion would only ever measure the tag scope. It needs
    # a full converge -- `existing-host`.
