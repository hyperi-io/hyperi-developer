---
# Verify the remediation actually happened.
#
# The point of this file is NOT "did the new tools arrive" — a normal converge
# shows that. It is "are the OLD artefacts GONE". Ansible cannot prune what it
# no longer declares, so every removal below is a tombstone we wrote by hand,
# and a tombstone nobody tests is a tombstone that silently stops working.
#
# The nastiest class is SHADOWING: the host looks correct because the command
# runs and reports a plausible version — but it is the stale user-level copy,
# which no system update will ever touch again.

- name: Verify remediation
  hosts: all
  gather_facts: true

  vars:
    # The DESKTOP user, which on a fleet machine is not the user ansible
    # connected as. Checking the service account's empty home passes every
    # user-scoped assert below while the real user still carries the artefact,
    # so this is supplied the same way the inventory takes its host:
    #     MOLECULE_TARGET_DESKTOP_USER=hyperi molecule verify -s existing-host
    verify_user: >-
      {{ lookup('env', 'MOLECULE_TARGET_DESKTOP_USER')
         | default(hyperi_target_user | default(ansible_user_id, true), true) }}

  tasks:
    # ------------------------------------------------------------------
    # SHADOWING — a stale user-level binary ahead of the system one on PATH
    # ------------------------------------------------------------------
    - name: Resolve the desktop user's home
      ansible.builtin.getent:
        database: passwd
        key: "{{ verify_user }}"
      become: true

    - name: Set the home to check
      ansible.builtin.set_fact:
        verify_home: "{{ ansible_facts.getent_passwd[verify_user][4] }}"

    - name: Report which user is being verified
      ansible.builtin.debug:
        msg: "Verifying user-scoped state for {{ verify_user }} ({{ verify_home }})"

    - name: Stat the retired user-level uv locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ verify_home }}/.cargo/bin/uv"
        - "{{ verify_home }}/.cargo/bin/ruff"
      register: verify_stale_uv
      become: true

    - name: Assert no stale user-level uv shadows the system install
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          {{ item.item }} still exists. uv is now installed system-wide from a
          repo; this stale user-level copy will win on PATH and will never be
          updated by a system update, so the host will look current while
          silently rotting.
        success_msg: "no stale user-level copy at {{ item.item }}"
      loop: "{{ verify_stale_uv.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Resolve which uv actually wins on PATH
      ansible.builtin.command: which uv
      register: verify_uv_which
      changed_when: false
      failed_when: false

    - name: Assert the winning uv is the system-wide one
      ansible.builtin.assert:
        that:
          - "'/.cargo/' not in verify_uv_which.stdout"
          - "'/.local/' not in verify_uv_which.stdout or ansible_facts['distribution'] == 'Ubuntu'"
        fail_msg: >-
          uv resolves to {{ verify_uv_which.stdout }} — a user-level path.
          Expected the repo-installed one (/usr/bin on Fedora,
          /opt/homebrew/bin on macOS). Ubuntu is the documented exception:
          no apt package exists, so uv is user-owned there by design.
        success_msg: "uv resolves to {{ verify_uv_which.stdout }}"
      when: verify_uv_which.rc == 0

    # ------------------------------------------------------------------
    # CANNOT CO-EXIST — the old thing actively conflicts with the new
    # ------------------------------------------------------------------
    - name: Stat retired container runtimes
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /Applications/OrbStack.app          # paid for commercial use; replaced by colima
        - /usr/bin/docker-desktop
        - /opt/docker-desktop
      register: verify_retired_runtimes

    - name: Assert retired container runtimes are gone
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          {{ item.item }} still present. It registers a competing docker
          context/socket, so which daemon `docker` talks to becomes ambiguous.
        success_msg: "{{ item.item }} absent"
      loop: "{{ verify_retired_runtimes.results }}"
      loop_control:
        label: "{{ item.item }}"

    # A docker context is a per-user file, not package state, so it survives
    # the uninstall. Left selected, it points at a dead socket and every docker
    # command fails.
    - name: Read the docker contexts
      ansible.builtin.command: docker context ls --quiet
      register: verify_docker_ctx
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ verify_user }}"

    - name: Assert the retired Docker Desktop context is gone
      ansible.builtin.assert:
        that:
          - "'desktop-linux' not in (verify_docker_ctx.stdout_lines | default([]))"
        fail_msg: >-
          The desktop-linux context is still registered. It points at Docker
          Desktop's socket, which no longer exists — and if it is also the
          selected context, every docker command on this host fails.
        success_msg: "no retired Docker Desktop context"
      when: verify_docker_ctx.rc == 0

    - name: Assert the selected docker context is not the retired one
      ansible.builtin.command: docker context show
      register: verify_docker_ctx_current
      changed_when: false
      failed_when: verify_docker_ctx_current.stdout | trim == 'desktop-linux'
      become: true
      become_user: "{{ verify_user }}"
      when: verify_docker_ctx.rc == 0

    # ------------------------------------------------------------------
    # RETIRED PACKAGES — dropped by decision, must not linger
    # ------------------------------------------------------------------
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert retired packages are gone
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.packages
        fail_msg: "{{ item }} is still installed — its tombstone did not fire."
        success_msg: "{{ item }} absent"
      loop:
        - telnet
        - net-tools
        - nmap
        - whois
        - traceroute
        - tree
        - httpie
      loop_control:
        label: "{{ item }}"

    # Debian's split packages. `telnet` is transitional and `nmap-common` holds
    # nmap's data files, so a host can pass the assert above while still
    # carrying a working telnet binary and most of nmap.
    - name: Assert the Debian split packages are gone too
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.packages
        fail_msg: "{{ item }} is still installed — its tombstone did not fire."
        success_msg: "{{ item }} absent"
      loop:
        - inetutils-telnet
        - telnet-ssl
        - nmap-common
      loop_control:
        label: "{{ item }}"
      when: ansible_facts['os_family'] == 'Debian'

    # ------------------------------------------------------------------
    # POWER PROFILE — only where one was applied
    # ------------------------------------------------------------------
    # power-profile is opt-in and outside every persona, so its absence is not
    # a failure. Where the drop-in IS present, a reload must have followed it:
    # a file on disk that logind never re-read is the silent failure here.
    - name: Stat the power-profile drop-in
      ansible.builtin.stat:
        path: /etc/systemd/logind.conf.d/10-hyperi-power-profile.conf
      register: verify_power_dropin
      when: ansible_facts['system'] == 'Linux'

    # busctl, not loginctl: the manager's properties are only on the bus, and
    # reading them is what proves logind re-read the drop-in.
    - name: Read the effective logind policy
      ansible.builtin.command:
        argv:
          - busctl
          - get-property
          - org.freedesktop.login1
          - /org/freedesktop/login1
          - org.freedesktop.login1.Manager
          - HandleLidSwitchExternalPower
      register: verify_logind
      changed_when: false
      when: verify_power_dropin.stat.exists | default(false)

    - name: Assert the deployed lid policy is the one logind is running
      ansible.builtin.assert:
        that:
          - "'ignore' in verify_logind.stdout"
        fail_msg: >-
          The drop-in is on disk but logind still suspends on lid close while on
          mains power — systemd-logind was never reloaded.
        success_msg: "lid close on mains power is ignored"
      when: verify_power_dropin.stat.exists | default(false)

    # ------------------------------------------------------------------
    # STALE CONFIG — blocks and repo files the old version wrote
    # ------------------------------------------------------------------
    - name: Read ~/.zprofile if present
      ansible.builtin.slurp:
        src: "{{ verify_home }}/.zprofile"
      register: verify_zprofile
      failed_when: false

    - name: Assert the retired GNU tools PATH shim is gone
      ansible.builtin.assert:
        that:
          - "'HYPERI: GNU tools PATH shim' not in (verify_zprofile.content | b64decode)"
        fail_msg: >-
          The GNU tools PATH shim is still in ~/.zprofile. gnu-tools is retired,
          so the shim now prepends paths for packages we no longer install.
        success_msg: "GNU tools PATH shim absent from ~/.zprofile"
      when: verify_zprofile.content is defined
