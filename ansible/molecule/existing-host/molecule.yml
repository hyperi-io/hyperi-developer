---
# Delegated scenario -- runs against a REAL, already-existing host.
#
# Set MOLECULE_TARGET_HOST and MOLECULE_TARGET_USER (see inventory.yml). This
# repo is public, so no host is named here.
#
# SAFETY: `create` and `destroy` are deliberately ABSENT from test_sequence.
# The default molecule sequence ends in `destroy`, which against someone's real
# workstation would be catastrophic. There is nothing to create (the host
# exists) and nothing may be destroyed. `molecule test -s existing-host` is
# therefore intentionally NOT a full create/destroy cycle.
#
# SNAPSHOT THE HOST BEFORE RUNNING. `converge` genuinely changes it -- that is
# the entire point of the scenario.
#
# Preview first, always (the Puppet `noop` habit -- tombstones are the
# destructive part of this playbook):
#     molecule converge -s existing-host -- --check --diff

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
    ignore-errors: true

ansible:
  cfg:
    defaults:
      host_key_checking: false
      interpreter_python: auto_silent
      # Molecule writes its own ansible.cfg and points ANSIBLE_CONFIG at it, so
      # `ansible/ansible.cfg` is never read and every role in main.yml fails to
      # resolve without this. MOLECULE_PROJECT_DIRECTORY is molecule's own
      # interpolation for the directory it was invoked from.
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
  playbooks:
    converge: converge.yml
    verify: verify.yml

provisioner:
  name: ansible
  inventory:
    # Molecule generates its own inventory from `platforms`, and this scenario
    # has none, so without the link the run targets the implicit localhost --
    # it converges the machine you launched it from. The link name has no
    # extension deliberately: ansible's YAML inventory plugin accepts that, and
    # `hosts` is the name molecule itself clears before relinking.
    links:
      hosts: inventory.yml
      # The version SSoT. Without it any task reading hyperi_core_versions
      # (the rustup pin, node_major) is undefined under this scenario.
      group_vars: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/group_vars

scenario:
  name: existing-host
  # No create / destroy / cleanup: this is a real machine.
  test_sequence:
    - dependency
    - syntax
    - converge
    - idempotence
    - verify
