---
# Data platform tools (Vector, ClickHouse, Confluent CLI, rpk, valkey-cli)
#
# macOS notes:
# - Vector: skipped — removed from homebrew-core; would need an unofficial
#   tap. If you need Vector on Mac, install manually with the tap that
#   works for your current Vector version.
# - ClickHouse: skipped — heavyweight, not part of standard Mac dev workflow.
#   Manual install if needed: `brew install --cask clickhouse-client` or
#   run via container.
# - Confluent CLI: INSTALLED on macOS — needs the confluentinc/tap added
#   first (which is done below).

- name: Skipped data platform tools notice (macOS)
  ansible.builtin.debug:
    msg: |
      Vector and ClickHouse are intentionally skipped on macOS
      (no clean homebrew formula). Install manually if needed.
      Confluent CLI IS installed below via the confluentinc/tap.
  when: ansible_facts['distribution'] == 'MacOSX'

# A minimal Ubuntu ships gpgv but not gpg, which the vendor key checks need.
- name: Ensure gpg is present for the vendor key checks (Linux)
  ansible.builtin.package:
    name: "{{ 'gpg' if ansible_facts['distribution'] == 'Ubuntu' else 'gnupg2' }}"
    state: present
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# ============================================================================
# VECTOR - Log aggregation and routing
# ============================================================================

- name: Install Vector (Fedora)
  block:
    - name: Add Vector repository
      ansible.builtin.yum_repository:
        name: vector
        description: Vector
        baseurl: https://yum.vector.dev/stable/vector-0/$basearch/
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey:
          - https://keys.datadoghq.com/DATADOG_RPM_KEY_CURRENT.public
          - https://keys.datadoghq.com/DATADOG_RPM_KEY_B01082D3.public
          - https://keys.datadoghq.com/DATADOG_RPM_KEY_FD4BF915.public

    - name: Install Vector
      ansible.builtin.dnf:
        name: vector
        state: present

  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Vector (Ubuntu)
  block:
    - name: Download Datadog APT GPG keys for Vector
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - url: https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
          dest: /tmp/vector-current.pub
        - url: https://keys.datadoghq.com/DATADOG_APT_KEY_C0962C7D.public
          dest: /tmp/vector-C0962C7D.pub
        - url: https://keys.datadoghq.com/DATADOG_APT_KEY_F14F620E.public
          dest: /tmp/vector-F14F620E.pub

    - name: Create Datadog keyring for Vector
      ansible.builtin.shell: |
        cat /tmp/vector-current.pub /tmp/vector-C0962C7D.pub /tmp/vector-F14F620E.pub | \
          gpg --dearmor --output /usr/share/keyrings/datadog-archive-keyring.gpg
        chmod 644 /usr/share/keyrings/datadog-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/datadog-archive-keyring.gpg

    # A host provisioned by an older revision carries the .list beside the
    # .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy Vector .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vector.list
        state: absent

    - name: Add Vector APT repository
      ansible.builtin.deb822_repository:
        name: vector
        types: deb
        uris: "https://apt.vector.dev/"
        suites: stable
        components: vector-0
        signed_by: /usr/share/keyrings/datadog-archive-keyring.gpg
        state: present

    - name: Install Vector
      ansible.builtin.apt:
        name: vector
        state: present
        update_cache: true

  when: ansible_facts['distribution'] == 'Ubuntu'

# Vector intentionally not installed on macOS — see header comment.

# ============================================================================
# CLICKHOUSE - Analytics database client
# ============================================================================

- name: Install ClickHouse client (Linux)
  vars:
    infrastructure_clickhouse_key:
      url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
      dest: >-
        {{ '/etc/apt/keyrings/clickhouse.asc' if ansible_facts['distribution'] == 'Ubuntu'
           else '/etc/pki/rpm-gpg/RPM-GPG-KEY-clickhouse' }}
      fingerprint: "{{ infrastructure_clickhouse_key_fingerprint }}"
  block:
    # Runs before any apt call: apt reads a leftover .list beside the .sources
    # written below as a second copy of the repo.
    - name: Remove the legacy ClickHouse .list (Ubuntu)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/clickhouse.list
        state: absent
      when: ansible_facts['distribution'] == 'Ubuntu'

    # Staged under a name nothing trusts and forced, so a rejected download is
    # replaced on the next run instead of kept by an If-Modified-Since 304.
    - name: Download the ClickHouse signing key
      ansible.builtin.get_url:
        url: "{{ infrastructure_clickhouse_key.url }}"
        dest: "{{ infrastructure_clickhouse_key.dest }}.unverified"
        mode: '0644'
        force: true

    - name: Read the ClickHouse signing key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, "{{ infrastructure_clickhouse_key.dest }}.unverified"]
      register: infrastructure_clickhouse_key_read
      changed_when: false
      check_mode: false

    # Fails closed: one primary key, and the pinned one, or nothing is trusted.
    - name: Verify the ClickHouse signing key fingerprint
      ansible.builtin.assert:
        that:
          - infrastructure_key_primaries | int == 1
          - infrastructure_key_fpr == infrastructure_clickhouse_key.fingerprint
        fail_msg: >-
          {{ infrastructure_clickhouse_key.url }} holds {{ infrastructure_key_primaries }} key(s), first
          {{ infrastructure_key_fpr or 'missing' }}; expected only {{ infrastructure_clickhouse_key.fingerprint }}
        quiet: true
      vars:
        infrastructure_key_primaries: "{{ infrastructure_clickhouse_key_read.stdout_lines | select('match', '^pub:') | list | length }}"
        infrastructure_key_fpr: >-
          {{ (infrastructure_clickhouse_key_read.stdout_lines | select('match', '^fpr:') | first | default('')).split(':')[9] | default('') }}

    - name: Install the verified ClickHouse signing key
      ansible.builtin.copy:
        src: "{{ infrastructure_clickhouse_key.dest }}.unverified"
        dest: "{{ infrastructure_clickhouse_key.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    # ClickHouse signs its repo metadata but not its rpms, so gpgcheck stays off
    # and the signed repomd, with the package checksums it lists, vouches for
    # each package.
    - name: Add ClickHouse repository (Fedora)
      ansible.builtin.yum_repository:
        name: clickhouse-stable
        description: ClickHouse - Stable Repository
        baseurl: https://packages.clickhouse.com/rpm/stable/
        enabled: true
        gpgcheck: false
        repo_gpgcheck: true
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-clickhouse
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install ClickHouse client (Fedora)
      ansible.builtin.dnf:
        name: clickhouse-client
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Add ClickHouse APT repository (Ubuntu)
      ansible.builtin.deb822_repository:
        name: clickhouse
        types: deb
        uris: "https://packages.clickhouse.com/deb"
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/clickhouse.asc
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install ClickHouse client (Ubuntu)
      ansible.builtin.apt:
        name: clickhouse-client
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

  rescue:
    - name: Record that the ClickHouse client did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['ClickHouse client: ' ~ (ansible_failed_result.msg | default('repo/install failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# ClickHouse intentionally not installed on macOS — see header comment.

# ============================================================================
# CONFLUENT CLI - Kafka client tools
# ============================================================================

# The CLI has its own unversioned repo. Confluent Platform's per-release repos
# also carry a confluent-cli, numbered by the platform release (8.x) rather than
# the CLI's own (4.x), so it outranks the real CLI on version.
- name: Install Confluent CLI from its package repository (Linux)
  vars:
    infrastructure_confluent_cli_key:
      url: >-
        https://packages.confluent.io/confluent-cli/{{ 'deb' if ansible_facts['distribution'] == 'Ubuntu' else 'rpm' }}/archive.key
      dest: >-
        {{ '/etc/apt/keyrings/confluent-cli.asc' if ansible_facts['distribution'] == 'Ubuntu'
           else '/etc/pki/rpm-gpg/RPM-GPG-KEY-confluent-cli' }}
      fingerprint: >-
        {{ infrastructure_confluent_cli_deb_key_fingerprint if ansible_facts['distribution'] == 'Ubuntu'
           else infrastructure_confluent_cli_rpm_key_fingerprint }}
  block:
    # The Confluent Platform repo an older revision configured. Runs before any
    # apt or dnf call so neither reads it again.
    - name: Remove the Confluent Platform apt repo and key (Ubuntu)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/confluent.sources
        - /etc/apt/sources.list.d/confluent.list
        - /etc/apt/keyrings/confluent.asc
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove the Confluent Platform repository (Fedora)
      ansible.builtin.yum_repository:
        name: Confluent
        state: absent
      when: ansible_facts['distribution'] == 'Fedora'

    # Staged under a name nothing trusts and forced, so a rejected download is
    # replaced on the next run instead of kept by an If-Modified-Since 304.
    - name: Download the Confluent CLI signing key
      ansible.builtin.get_url:
        url: "{{ infrastructure_confluent_cli_key.url }}"
        dest: "{{ infrastructure_confluent_cli_key.dest }}.unverified"
        mode: '0644'
        force: true

    - name: Read the Confluent CLI signing key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, "{{ infrastructure_confluent_cli_key.dest }}.unverified"]
      register: infrastructure_confluent_cli_key_read
      changed_when: false
      check_mode: false

    # Fails closed: one primary key, and the pinned one, or nothing is trusted.
    - name: Verify the Confluent CLI signing key fingerprint
      ansible.builtin.assert:
        that:
          - infrastructure_key_primaries | int == 1
          - infrastructure_key_fpr == infrastructure_confluent_cli_key.fingerprint
        fail_msg: >-
          {{ infrastructure_confluent_cli_key.url }} holds {{ infrastructure_key_primaries }} key(s), first
          {{ infrastructure_key_fpr or 'missing' }}; expected only {{ infrastructure_confluent_cli_key.fingerprint }}
        quiet: true
      vars:
        infrastructure_key_primaries: "{{ infrastructure_confluent_cli_key_read.stdout_lines | select('match', '^pub:') | list | length }}"
        infrastructure_key_fpr: >-
          {{ (infrastructure_confluent_cli_key_read.stdout_lines | select('match', '^fpr:') | first | default('')).split(':')[9] | default('') }}

    - name: Install the verified Confluent CLI signing key
      ansible.builtin.copy:
        src: "{{ infrastructure_confluent_cli_key.dest }}.unverified"
        dest: "{{ infrastructure_confluent_cli_key.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Add the Confluent CLI APT repository (Ubuntu)
      ansible.builtin.deb822_repository:
        name: confluent-cli
        types: deb
        uris: https://packages.confluent.io/confluent-cli/deb
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/confluent-cli.asc
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    # Both the packages and the repo metadata are signed with the same key.
    - name: Add the Confluent CLI repository (Fedora)
      ansible.builtin.yum_repository:
        name: confluent-cli
        description: Confluent CLI
        baseurl: https://packages.confluent.io/confluent-cli/rpm
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-confluent-cli
      when: ansible_facts['distribution'] == 'Fedora'

    # Also drops the Platform repo's lists, so the version read below sees only
    # what the CLI repo offers.
    - name: Refresh the apt cache (Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Read the confluent-cli versions the CLI repo offers (Ubuntu)
      ansible.builtin.command:
        argv: [apt-cache, madison, confluent-cli]
      register: infrastructure_confluent_cli_madison
      changed_when: false
      check_mode: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Read the confluent-cli versions the CLI repo offers (Fedora)
      ansible.builtin.command:
        argv: [dnf, -q, repoquery, --available, --qf, "%{evr}\n", confluent-cli]
      register: infrastructure_confluent_cli_repoquery
      changed_when: false
      check_mode: false
      when: ansible_facts['distribution'] == 'Fedora'

    # Empty when confluent-cli is not installed.
    - name: Read the installed confluent-cli version
      ansible.builtin.command:
        argv: >-
          {{ ['dpkg-query', '-W', '-f=${Version}', 'confluent-cli']
             if ansible_facts['distribution'] == 'Ubuntu'
             else ['rpm', '-q', '--qf', '%{VERSION}-%{RELEASE}', 'confluent-cli'] }}
      register: infrastructure_confluent_cli_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # A Platform-repo build outranks every CLI-repo version, so the package
    # manager never replaces it; removing it lets the CLI repo's build in.
    - name: Remove a confluent-cli the CLI repo does not carry
      ansible.builtin.package:
        name: confluent-cli
        state: absent
      when:
        - infrastructure_confluent_cli_installed.rc == 0
        - infrastructure_confluent_cli_installed.stdout not in infrastructure_confluent_cli_offered
      vars:
        infrastructure_confluent_cli_offered: >-
          {{ infrastructure_confluent_cli_madison.stdout_lines | map('split', '|') | map(attribute=1) | map('trim') | list
             if ansible_facts['distribution'] == 'Ubuntu'
             else infrastructure_confluent_cli_repoquery.stdout_lines }}

    - name: Install Confluent CLI
      ansible.builtin.package:
        name: confluent-cli
        state: present

  rescue:
    - name: Record that the Confluent CLI did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Confluent CLI: ' ~ (ansible_failed_result.msg | default('repo/install failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Tap Confluent formulae (macOS)
  community.general.homebrew_tap:
    name: confluentinc/tap
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install Confluent CLI via Homebrew (macOS)
  community.general.homebrew:
    name: confluentinc/tap/cli
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# RPK - Redpanda / Kafka CLI (data group)
# ============================================================================
# redpanda-rpk from Redpanda's package repo is rpk alone; the `redpanda` broker
# package depends on it rather than the other way round. Taking it from the repo
# puts rpk under the host's normal package updates.
- name: Install rpk from the Redpanda package repository (Linux)
  vars:
    infrastructure_redpanda_key:
      url: >-
        {{ 'https://linux.pkg.redpanda.com/redpanda-deb-signing-public.gpg'
           if ansible_facts['distribution'] == 'Ubuntu'
           else 'https://linux.pkg.redpanda.com/redpanda-rpm-signing-public.key' }}
      dest: >-
        {{ '/etc/apt/keyrings/redpanda.asc' if ansible_facts['distribution'] == 'Ubuntu'
           else '/etc/pki/rpm-gpg/RPM-GPG-KEY-redpanda' }}
      fingerprint: >-
        {{ infrastructure_redpanda_repo_key_fingerprint if ansible_facts['distribution'] == 'Ubuntu'
           else infrastructure_redpanda_rpm_key_fingerprint }}
  block:
    # Staged under a name nothing trusts and forced, so a rejected download is
    # replaced on the next run instead of kept by an If-Modified-Since 304.
    - name: Download the Redpanda signing key
      ansible.builtin.get_url:
        url: "{{ infrastructure_redpanda_key.url }}"
        dest: "{{ infrastructure_redpanda_key.dest }}.unverified"
        mode: '0644'
        force: true

    - name: Read the Redpanda signing key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, "{{ infrastructure_redpanda_key.dest }}.unverified"]
      register: infrastructure_redpanda_key_read
      changed_when: false
      check_mode: false

    # Fails closed: one primary key, and the pinned one, or nothing is trusted.
    - name: Verify the Redpanda signing key fingerprint
      ansible.builtin.assert:
        that:
          - infrastructure_key_primaries | int == 1
          - infrastructure_key_fpr == infrastructure_redpanda_key.fingerprint
        fail_msg: >-
          {{ infrastructure_redpanda_key.url }} holds {{ infrastructure_key_primaries }} key(s), first
          {{ infrastructure_key_fpr or 'missing' }}; expected only {{ infrastructure_redpanda_key.fingerprint }}
        quiet: true
      vars:
        infrastructure_key_primaries: "{{ infrastructure_redpanda_key_read.stdout_lines | select('match', '^pub:') | list | length }}"
        infrastructure_key_fpr: >-
          {{ (infrastructure_redpanda_key_read.stdout_lines | select('match', '^fpr:') | first | default('')).split(':')[9] | default('') }}

    - name: Install the verified Redpanda signing key
      ansible.builtin.copy:
        src: "{{ infrastructure_redpanda_key.dest }}.unverified"
        dest: "{{ infrastructure_redpanda_key.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Add the Redpanda APT repository (Ubuntu)
      ansible.builtin.deb822_repository:
        name: redpanda
        types: deb
        uris: https://linux.pkg.redpanda.com/apt
        suites: redpanda-apt
        components: main
        signed_by: /etc/apt/keyrings/redpanda.asc
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    # dnf rejects the signature Artifact Registry puts on the yum metadata as
    # bad, so only the rpms' own signatures are checked.
    - name: Add the Redpanda repository (Fedora)
      ansible.builtin.yum_repository:
        name: redpanda
        description: Redpanda
        baseurl: https://linux.pkg.redpanda.com/yum/redpanda-yum
        enabled: true
        gpgcheck: true
        repo_gpgcheck: false
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redpanda
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install rpk (Ubuntu)
      ansible.builtin.apt:
        name: redpanda-rpk
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install rpk (Fedora)
      ansible.builtin.dnf:
        name: redpanda-rpk
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    # The GitHub zip an older revision unpacked here shadows the packaged rpk on
    # PATH. Reached only once the package above is in, since a failed install
    # leaves the block for the rescue.
    - name: Remove the superseded /usr/local/bin/rpk
      ansible.builtin.file:
        path: /usr/local/bin/rpk
        state: absent

  rescue:
    - name: Record that rpk did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['rpk: ' ~ (ansible_failed_result.msg | default('repo/install failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Install rpk via Homebrew (macOS)
  block:
    # TODO verify: the redpanda-data/tap formula name/availability is UNVERIFIED
    # (flagged in the plan). If the tap or formula has moved this warns, and the
    # standalone rpk binary from GitHub is the fallback.
    - name: Tap redpanda-data formulae (macOS)
      community.general.homebrew_tap:
        name: redpanda-data/tap
        state: present

    - name: Install rpk via the redpanda formula (macOS)
      community.general.homebrew:
        name: redpanda-data/tap/redpanda
        state: present

  rescue:
    - name: Record that rpk did not install (macOS)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['rpk (macOS): ' ~ (ansible_failed_result.msg | default('brew tap/install failed'))] }}

  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# VALKEY-CLI - Valkey client (data group)
# ============================================================================
# HyperI runs VALKEY, not Redis, so we install Valkey's CLI. valkey-cli speaks
# the Redis wire protocol, so it also talks to Dragonfly and any Redis server -
# no need for the (licence-encumbered) Redis client.
#   Fedora : dnf `valkey`        (ships valkey-cli; Fedora 41+ replaced redis)
#   Ubuntu : apt `valkey-tools`  (client tools, from the archive)
#   macOS  : brew `valkey`
- name: Install valkey-cli (Valkey client; speaks the Redis protocol)
  block:
    - name: Install valkey (Fedora - ships valkey-cli)
      ansible.builtin.dnf:
        name: valkey
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install valkey-tools (Ubuntu - client tools)
      ansible.builtin.apt:
        name: valkey-tools
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install valkey via Homebrew (macOS)
      community.general.homebrew:
        name: valkey
        state: present
      become: false
      environment: "{{ homebrew_env }}"
      when: ansible_facts['distribution'] == 'MacOSX'

  rescue:
    - name: Record that valkey-cli did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['valkey-cli: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

