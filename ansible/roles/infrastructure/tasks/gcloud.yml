---
# Google Cloud CLI installation via official repositories
# Auto-updates via standard package manager upgrades

# ============================================================================
# FEDORA - Add Google Cloud repository and install
# ============================================================================

- name: Install Google Cloud CLI (Fedora)
  block:
    # Google builds the repo per arch (x86_64, aarch64), the same tokens as dnf's
    # $basearch.
    - name: Add Google Cloud SDK repository
      ansible.builtin.yum_repository:
        name: google-cloud-cli
        description: Google Cloud CLI
        baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-$basearch
        enabled: true
        gpgcheck: true
        repo_gpgcheck: false
        gpgkey:
          - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg

    - name: Install Google Cloud CLI
      ansible.builtin.dnf:
        name: google-cloud-cli
        state: present

  rescue:
    - name: Record that the Google Cloud CLI did not install (Fedora)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Google Cloud CLI: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - Add Google Cloud repository and install
# ============================================================================

- name: Install Google Cloud CLI (Ubuntu)
  block:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - apt-transport-https
          - gnupg
        state: present

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # apt reads an armored key directly when the file ends in .asc, so no
    # dearmor step and no scratch file under /tmp.
    - name: Download the Google Cloud apt signing key
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /etc/apt/keyrings/cloud.google.asc
        mode: '0644'
        force: true

    # A host provisioned by an older revision carries google-cloud-sdk.list
    # beside the .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy Google Cloud CLI .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/google-cloud-sdk.list
        state: absent

    - name: Add Google Cloud CLI repository
      ansible.builtin.deb822_repository:
        name: google-cloud-sdk
        types: deb
        uris: "https://packages.cloud.google.com/apt"
        suites: cloud-sdk
        components: main
        signed_by: /etc/apt/keyrings/cloud.google.asc
        state: present

    # /usr/share/keyrings/cloud.google.gpg, the dearmored copy an older revision
    # wrote, is left in place: Google's own instructions for other repos (gcsfuse)
    # name that path, and deleting a keyring a source still names stops apt for
    # the whole box.

    - name: Install Google Cloud CLI
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present
        update_cache: true

  rescue:
    - name: Record that the Google Cloud CLI did not install (Ubuntu)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Google Cloud CLI: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# macOS - Install via Homebrew
# ============================================================================

- name: Install Google Cloud CLI via Homebrew cask (macOS)
  community.general.homebrew_cask:
    name: google-cloud-sdk
    state: present
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
