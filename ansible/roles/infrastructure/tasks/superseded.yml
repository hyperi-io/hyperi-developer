---
# Binaries older revisions dropped in /usr/local/bin for tools a package now
# supplies. /usr/local/bin precedes /usr/bin on the default PATH, so a leftover
# copy shadows the package and nothing ever updates it again.
#
# Each copy goes only once /usr/bin/<bin> resolves to a real file outside
# /usr/local: where it does not -- absent, dangling, or a symlink back into
# /usr/local -- the /usr/local/bin copy is the only working one and it stays.
# Only the /usr/local/bin path is touched, never the package's own file.
#
# readlink -e rather than package_facts: package_facts needs the rpm Python
# bindings, which a minimal Fedora does not carry, and fails the run without
# them.
#
# Runs on every install of these tools rather than behind the removals opt-in,
# because the package that replaces the copy arrives on that same run.

- name: Resolve the packaged binaries that supersede /usr/local/bin copies
  ansible.builtin.command:
    argv: [readlink, -e, "/usr/bin/{{ item.bin }}"]
  loop: "{{ infrastructure_superseded | selectattr('distros', 'contains', ansible_facts['distribution']) }}"
  loop_control:
    label: "{{ item.bin }}"
  register: infrastructure_superseded_packaged
  changed_when: false
  failed_when: false
  check_mode: false
  vars:
    infrastructure_superseded:
      # GitHub-release binaries until ca841da; Ubuntu's kubectx package ships
      # both. Fedora packages neither, so there /usr/local/bin is the install.
      - { bin: kubectx, distros: [Ubuntu] }
      - { bin: kubens, distros: [Ubuntu] }
      # Fedora moved to dnf; Ubuntu still installs k9s to /usr/local/bin.
      - { bin: k9s, distros: [Fedora] }
      # Fedora moved to dnf; Ubuntu still installs kustomize to /usr/local/bin.
      - { bin: kustomize, distros: [Fedora] }
      # The get.helm.sh binary, before helm came from package repositories.
      - { bin: helm, distros: [Fedora, Ubuntu] }

- name: Remove /usr/local/bin copies a package now supplies
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item.item.bin }}"
    state: absent
  loop: "{{ infrastructure_superseded_packaged.results }}"
  loop_control:
    label: "{{ item.item.bin }}"
  when:
    - item.rc == 0
    - not item.stdout.startswith('/usr/local/')
