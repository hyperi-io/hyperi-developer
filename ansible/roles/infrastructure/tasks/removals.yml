---
# Tombstones for the HashiCorp tools we replaced with their open-source forks.
#
#   terraform -> tofu  (OpenTofu, MPL-2.0)
#   vault     -> bao   (OpenBao, MPL-2.0)
#
# Ansible cannot remove what we simply stop declaring, so every host we have
# ever provisioned keeps terraform and vault until we say otherwise.
#
# The HashiCorp repo, its key and the Homebrew tap go only where Packer is not
# installed, since the opt-in `packer` role installs from them. A repo left
# behind with a key the host no longer trusts fails every apt refresh.
#
# Removing terraform WILL break tooling that still shells out to it -- notably
# hyperi-infra, which invokes `terraform` directly. That is why this runs on
# `--tags removals` alone: installing the IaC tools is not a request to delete
# somebody's Terraform.

# Before the package removals, which refresh the apt cache and fail on a repo
# signed by a key the host no longer trusts.
- name: Check whether Packer is installed (Ubuntu)
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${Status}', packer]
  register: infrastructure_packer_deb
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'Ubuntu'

# Both filenames: deb822_repository writes .sources, and older setups wrote .list.
- name: Remove the HashiCorp APT repository where Packer is not installed (Ubuntu)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/hashicorp.sources
    - /etc/apt/sources.list.d/hashicorp.list
    - /usr/share/keyrings/hashicorp-archive-keyring.asc
    - /usr/share/keyrings/hashicorp-archive-keyring.asc.unverified
    - /usr/share/keyrings/hashicorp-archive-keyring.gpg
  register: infrastructure_hashicorp_repo_removed
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - "'install ok installed' not in infrastructure_packer_deb.stdout | default('')"

- name: Refresh the APT cache after removing the repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - infrastructure_hashicorp_repo_removed is changed

- name: Check whether Packer is installed (Fedora)
  ansible.builtin.command:
    argv: [rpm, -q, packer]
  register: infrastructure_packer_rpm
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'Fedora'

- name: Remove the HashiCorp YUM repository where Packer is not installed (Fedora)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/hashicorp.repo
    - /etc/pki/rpm-gpg/RPM-GPG-KEY-hashicorp
    - /etc/pki/rpm-gpg/RPM-GPG-KEY-hashicorp.unverified
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - infrastructure_packer_rpm.rc | default(0) != 0

- name: Remove Terraform and Vault (Ubuntu)
  ansible.builtin.apt:
    name:
      - terraform
      - vault
    state: absent
    purge: false
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Remove Terraform and Vault (Fedora)
  ansible.builtin.dnf:
    name:
      - terraform
      - vault
    state: absent
  when: ansible_facts['distribution'] == 'Fedora'

# NOT touched: `aws-vault`. It is the ByteNess aws-vault, nothing to do with
# HashiCorp Vault despite the name, and it is still installed on purpose.
- name: Remove Terraform and Vault (macOS)
  community.general.homebrew:
    name:
      - hashicorp/tap/terraform
      - hashicorp/tap/vault
    state: absent
  become: false
  environment: "{{ homebrew_env }}"
  failed_when: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Check whether Packer is installed (macOS)
  ansible.builtin.command:
    argv: [brew, list, hashicorp/tap/packer]
  register: infrastructure_packer_brew
  become: false
  environment: "{{ homebrew_env }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'MacOSX'

# Untap only after the formulae are gone, or brew refuses.
- name: Remove the HashiCorp Homebrew tap where Packer is not installed (macOS)
  community.general.homebrew_tap:
    name: hashicorp/tap
    state: absent
  become: false
  environment: "{{ homebrew_env }}"
  failed_when: false
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - infrastructure_packer_brew.rc | default(0) != 0
