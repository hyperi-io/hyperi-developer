---
# Azure CLI installation

# ============================================================================
# FEDORA - Add Microsoft repository and install
# ============================================================================

- name: Install Azure CLI (Fedora)
  block:
    - name: Import Microsoft GPG key
      ansible.builtin.rpm_key:
        state: present
        key: https://packages.microsoft.com/keys/microsoft.asc

    - name: Add Azure CLI repository
      ansible.builtin.yum_repository:
        name: azure-cli
        description: Azure CLI
        baseurl: https://packages.microsoft.com/yumrepos/azure-cli
        enabled: true
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc

    - name: Install Azure CLI
      ansible.builtin.dnf:
        name: azure-cli
        state: present

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - Add Microsoft repository and install
# ============================================================================

- name: Install Azure CLI (Ubuntu)
  block:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - apt-transport-https
          - lsb-release
          - gnupg
        state: present

    - name: Download Microsoft GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /usr/share/keyrings/microsoft.asc
        mode: '0644'

    # Use the running release when Microsoft publishes it, else the newest suite
    # it does publish -- see azure_cli_supported_suites.
    - name: Determine Azure CLI repo codename
      ansible.builtin.set_fact:
        azure_cli_codename: >-
          {{ ansible_facts['distribution_release']
             if ansible_facts['distribution_release'] in azure_cli_supported_suites
             else azure_cli_supported_suites | last }}

    # A host provisioned by an older revision carries azure-cli.list beside the
    # .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy Azure CLI .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/azure-cli.list
        state: absent

    - name: Add Azure CLI repository
      ansible.builtin.deb822_repository:
        name: azure-cli
        types: deb
        uris: "https://packages.microsoft.com/repos/azure-cli/"
        suites: "{{ azure_cli_codename }}"
        components: main
        signed_by: /usr/share/keyrings/microsoft.asc
        architectures: amd64
        state: present

    - name: Install Azure CLI
      ansible.builtin.apt:
        name: azure-cli
        state: present
        update_cache: true

  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# macOS - Install via Homebrew
# ============================================================================

- name: Install Azure CLI via Homebrew (macOS)
  community.general.homebrew:
    name: azure-cli
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
