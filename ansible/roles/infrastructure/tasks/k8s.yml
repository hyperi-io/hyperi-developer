---
# Kubernetes tools installation (kubectl, k9s, kubectx/kubens, kind, ArgoCD, dive)

# ============================================================================
# KUBECTL - Dynamic version detection
# ============================================================================

- name: Detect latest stable Kubernetes version
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: k8s_stable_version
  delegate_to: localhost
  become: false
  check_mode: false

- name: Extract Kubernetes minor version
  ansible.builtin.set_fact:
    k8s_version: "{{ k8s_stable_version.content | trim | regex_replace('^v([0-9]+\\.[0-9]+).*', '\\1') }}"

- name: Display detected Kubernetes version
  ansible.builtin.debug:
    msg: "Using Kubernetes {{ k8s_version }}"

# Fedora
- name: Add Kubernetes repository (Fedora)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key"
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install kubectl (Fedora)
  ansible.builtin.dnf:
    name: kubectl
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

# Ubuntu
- name: Add Kubernetes GPG key (Ubuntu)
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
  when: ansible_facts['distribution'] == 'Ubuntu'

# A host provisioned by an older revision carries kubernetes.list beside the
# .sources this writes, and apt then reads the repo twice.
- name: Remove the legacy Kubernetes .list (Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Kubernetes repository (Ubuntu)
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/"
    suites: "/"
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install kubectl (Ubuntu)
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  when: ansible_facts['distribution'] == 'Ubuntu'


# ============================================================================
# kubectx + kubens - Ubuntu universe package; Fedora GitHub release (Tier 3)
# ============================================================================
# Ubuntu ships kubectx in universe, and that one package bundles kubens too.
# Fedora packages neither (none in the Fedora 44 repos), so it takes upstream's
# release binaries into /usr/local/bin.
- name: Install kubectx and kubens (Ubuntu)
  when: ansible_facts['distribution'] == 'Ubuntu'
  block:
    - name: Install kubectx (Ubuntu)
      ansible.builtin.apt:
        name: kubectx
        state: present
        update_cache: true

  rescue:
    - name: Record that kubectx/kubens did not install (Ubuntu)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['kubectx/kubens: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

- name: Install kubectx and kubens (Fedora)
  when: ansible_facts['distribution'] == 'Fedora'
  block:
    - name: List the kubectx releases
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ infrastructure_kubectx_repo }}/releases?per_page=30"
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: infrastructure_kubectx_releases
      check_mode: false

    # Sorted rather than trusting the API's order, then cut to the releases past
    # the cooldown (infrastructure_release_cutoff).
    - name: List the kubectx releases past the cooldown
      ansible.builtin.set_fact:
        infrastructure_kubectx_candidates: >-
          {{ infrastructure_kubectx_releases.json
             | rejectattr('draft') | rejectattr('prerelease')
             | selectattr('published_at', 'le', infrastructure_release_cutoff)
             | sort(attribute='published_at', reverse=true)
             | map(attribute='tag_name') | list }}

    - name: Check a kubectx release is past the cooldown
      ansible.builtin.assert:
        that: infrastructure_kubectx_candidates | length > 0
        fail_msg: >-
          no {{ infrastructure_kubectx_repo }} release among the newest 30 is at
          least {{ infrastructure_min_release_age_days }} days old
        quiet: true

    # Assets carry the tag verbatim (kubectx_v0.11.0_linux_x86_64.tar.gz) and
    # name the arches x86_64 and arm64; `--version` prints the bare version.
    - name: Pick the newest kubectx release past the cooldown
      ansible.builtin.set_fact:
        infrastructure_kubectx_tag: "{{ infrastructure_kubectx_candidates | first }}"
        infrastructure_kubectx_arch: "{{ 'arm64' if hyperi_arch_deb == 'arm64' else 'x86_64' }}"

    # The bash scripts older revisions installed have no --version and treat it
    # as a context or namespace name, so they run against an empty kubeconfig.
    - name: Read the installed kubectx and kubens versions
      ansible.builtin.command:
        argv: ["/usr/local/bin/{{ item }}", --version]
      environment:
        KUBECONFIG: /dev/null
      loop:
        - kubectx
        - kubens
      register: infrastructure_kubectx_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # The version match is what skips the download on a current host and what
    # replaces both once a new release clears the cooldown, the old bash scripts
    # included.
    - name: Download and extract kubectx and kubens (Fedora)
      ansible.builtin.unarchive:
        src: >-
          https://github.com/{{ infrastructure_kubectx_repo }}/releases/download/{{ infrastructure_kubectx_tag
          }}/{{ item.item }}_{{ infrastructure_kubectx_tag }}_linux_{{ infrastructure_kubectx_arch }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: ["{{ item.item }}"]
        owner: root
        group: root
        mode: '0755'
      loop: "{{ infrastructure_kubectx_installed.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not ansible_check_mode
        - (item.stdout | default('') | trim) != (infrastructure_kubectx_tag | regex_replace('^v', ''))

  rescue:
    - name: Record that kubectx/kubens did not install (Fedora)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['kubectx/kubens: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

# ============================================================================
# k9s - Fedora dnf (Tier 1); Ubuntu keeps the GitHub binary (Tier 3) below
# ============================================================================
# Fedora packages k9s natively (verified in the official repo for Fedora 43/44,
# and 43 is our supported floor). Ubuntu has no apt package or vendor repo for
# it, so on Ubuntu it stays a GitHub-release binary in the block below and
# hyperi-update re-fetches it.
- name: Install k9s (Fedora)
  block:
    - name: Install k9s (Fedora)
      ansible.builtin.dnf:
        name: k9s
        state: present

  rescue:
    - name: Record that k9s did not install (Fedora)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['k9s: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'


# ============================================================================
# LINUX - GitHub-release binaries (Tier 3: hyperi-update re-fetches these)
# ============================================================================
# No apt/dnf repo, snap, or language manager ships these, so they come from
# GitHub releases and hyperi-update re-pulls the latest each run. k9s is here
# for Ubuntu only (Fedora took the dnf package above).
- name: Install Kubernetes CLI tools via binary download (Linux)
  block:
    # k9s -- Ubuntu only (Fedora uses dnf, above)
    - name: Get latest k9s version (Ubuntu)
      ansible.builtin.uri:
        url: https://api.github.com/repos/derailed/k9s/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: k9s_latest
      check_mode: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Download and extract k9s (Ubuntu)
      ansible.builtin.unarchive:
        src: "https://github.com/derailed/k9s/releases/download/{{ k9s_latest.json.tag_name }}/k9s_Linux_{{ hyperi_arch_deb }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: k9s
        mode: '0755'
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - not ansible_check_mode

    # kind, not minikube. kind runs vanilla kubeadm Kubernetes in docker, which
    # is closer to the real clusters our helm/argocd work targets; minikube is
    # its own opinionated distribution.
    #
    # minikube used to be installed HERE while developer/tasks/removals.yml
    # tombstoned it -- the same run removed it and put it back, and since the
    # developer role runs first, the reinstall won. The tombstone only works
    # once the install is gone too.
    - name: Get latest kind version
      ansible.builtin.uri:
        url: https://api.github.com/repos/kubernetes-sigs/kind/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: kind_latest
      check_mode: false

    - name: Download kind
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes-sigs/kind/releases/download/{{ kind_latest.json.tag_name }}/kind-linux-{{ hyperi_arch_deb }}"
        dest: /usr/local/bin/kind
        mode: '0755'

    # ArgoCD CLI
    - name: Get latest ArgoCD version
      ansible.builtin.uri:
        url: https://api.github.com/repos/argoproj/argo-cd/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: argocd_latest
      check_mode: false

    - name: Download ArgoCD CLI
      ansible.builtin.get_url:
        url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_latest.json.tag_name }}/argocd-linux-{{ hyperi_arch_deb }}"
        dest: /usr/local/bin/argocd
        mode: '0755'

    # dive
    - name: Get latest dive version
      ansible.builtin.uri:
        url: https://api.github.com/repos/wagoodman/dive/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: dive_latest
      check_mode: false

    # dive tags its releases v0.13.1 but names the asset dive_0.13.1_... -- the
    # leading v is stripped in the filename but not the path.
    - name: Set the dive asset version
      ansible.builtin.set_fact:
        dive_version: "{{ dive_latest.json.tag_name | regex_replace('^v', '') }}"

    - name: Download and extract dive
      ansible.builtin.unarchive:
        src: >-
          https://github.com/wagoodman/dive/releases/download/{{ dive_latest.json.tag_name }}/dive_{{ dive_version }}_linux_{{ hyperi_arch_deb }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: dive
        mode: '0755'
      when: not ansible_check_mode

    # kustomize -- Fedora packages it natively and currently matches upstream
    # exactly, so only Ubuntu runs the release dance below.
    #
    # It is a monorepo: /releases/latest can point at a non-CLI component
    # (api/, cmd/config/), so we take the newest `kustomize/vX` release and use
    # its own asset URL (which already carries the correctly-encoded tag path).
    - name: Install kustomize (Fedora)
      ansible.builtin.dnf:
        name: kustomize
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Get kustomize releases (Ubuntu)
      ansible.builtin.uri:
        url: https://api.github.com/repos/kubernetes-sigs/kustomize/releases
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: kustomize_releases
      check_mode: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Select the latest kustomize CLI asset URL (Ubuntu)
      ansible.builtin.set_fact:
        kustomize_asset_url: >-
          {{ (kustomize_releases.json | selectattr('tag_name', 'match', 'kustomize/v') | list | first).assets
             | selectattr('name', 'search', '_linux_' ~ hyperi_arch_deb ~ '.tar.gz')
             | map(attribute='browser_download_url') | first }}
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Download and extract kustomize (Ubuntu)
      ansible.builtin.unarchive:
        src: "{{ kustomize_asset_url }}"
        dest: /usr/local/bin
        remote_src: true
        include: kustomize
        mode: '0755'
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - not ansible_check_mode

    # kubeconform (CI parity: hyperi-ci runs it as a blocking gate).
    - name: Get latest kubeconform version
      ansible.builtin.uri:
        url: https://api.github.com/repos/yannh/kubeconform/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: kubeconform_latest
      check_mode: false

    - name: Resolve the kubeconform tag
      ansible.builtin.set_fact:
        kubeconform_ref: "{{ kubeconform_latest.json.tag_name }}"

    - name: Download and extract kubeconform
      ansible.builtin.unarchive:
        src: "https://github.com/yannh/kubeconform/releases/download/{{ kubeconform_ref }}/kubeconform-linux-{{ hyperi_arch_deb }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: kubeconform
        mode: '0755'
      when: not ansible_check_mode

    # kube-linter (CI parity). Asset naming is uneven: amd64 has no arch suffix
    # (kube-linter-linux.tar.gz), arm64 does (kube-linter-linux_arm64.tar.gz).
    - name: Get latest kube-linter version
      ansible.builtin.uri:
        url: https://api.github.com/repos/stackrox/kube-linter/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: kube_linter_latest
      check_mode: false

    - name: Resolve the kube-linter tag
      ansible.builtin.set_fact:
        kube_linter_ref: "{{ kube_linter_latest.json.tag_name }}"

    - name: Download and extract kube-linter
      ansible.builtin.unarchive:
        src: >-
          https://github.com/stackrox/kube-linter/releases/download/{{ kube_linter_ref }}/kube-linter-linux{{ '_arm64' if hyperi_arch_deb == 'arm64' else '' }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: kube-linter
        mode: '0755'
      when: not ansible_check_mode

  rescue:
    # One dead upstream must not cost the whole k8s toolset. See
    # docs/resilient-deploy.md.
    - name: Record that a Kubernetes CLI tool did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Kubernetes CLI tools (k9s/kind/argocd/dive/kustomize/kubeconform/kube-linter): '
                ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# ============================================================================
# macOS - Install via Homebrew
# ============================================================================

- name: Install Kubernetes tools via Homebrew (macOS)
  block:
    - name: Install kubectl
      community.general.homebrew:
        name: kubernetes-cli
        state: present

    - name: Install k9s
      community.general.homebrew:
        name: k9s
        state: present

    - name: Install kubectx
      community.general.homebrew:
        name: kubectx
        state: present

    - name: Install kind
      community.general.homebrew:
        name: kind
        state: present

    - name: Install ArgoCD CLI
      community.general.homebrew:
        name: argocd
        state: present

    - name: Install dive
      community.general.homebrew:
        name: dive
        state: present

    - name: Install kustomize
      community.general.homebrew:
        name: kustomize
        state: present

    - name: Install kubeconform
      community.general.homebrew:
        name: kubeconform
        state: present

    - name: Install kube-linter
      community.general.homebrew:
        name: kube-linter
        state: present

  # One unavailable formula would otherwise cost the other nine.
  rescue:
    - name: Record that the Kubernetes tools did not install (macOS)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Kubernetes tools: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))] }}

  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
