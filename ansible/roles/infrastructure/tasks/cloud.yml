---
# Cloud tools installation (AWS CLI, Helm, OpenTofu, OpenBao, checkov,
# terraform-docs)
# Note: kubectl moved to k8s.yml
#
# NO HASHICORP TOOLS. HashiCorp relicensed the lot to BUSL in 2023 and IBM
# completed its acquisition in February 2025; we use the open-source forks the
# Linux Foundation now stewards instead:
#
#   terraform -> tofu   (OpenTofu, MPL-2.0)
#   vault     -> bao    (OpenBao, MPL-2.0)
#
# `aws-vault` below is NOT HashiCorp Vault -- it is aws-vault (the ByteNess fork
# of 99designs/aws-vault), an unrelated tool for keeping AWS credentials in the OS keychain. It stays.
#
# Packer has no viable fork (the community never produced one), so it comes
# from HashiCorp's repo in its own opt-in role, `packer`, rather than shipping a
# BUSL binary to every box that asks for the IaC tools.

# ============================================================================
# OPENTOFU REPOSITORY (Ubuntu and Fedora)
# ============================================================================
# OpenTofu's own repo on both, so the version tracks upstream rather than a
# distro freeze. Ubuntu does not package tofu at all; Fedora does, but its
# package sits in the frozen release repo a full minor behind (1.11.5 against
# upstream 1.12.6), which is the wrong side of "almost current" for the tool
# that plans and applies infrastructure.
#
# The apt suite is literally "any" and the packages are arch-generic, so this
# needs no codename and no arch handling.
#
# The package is `tofu` on both. Fedora's own package is `opentofu`, and the two
# conflict over /usr/bin/tofu, so the distro one is removed below.
#
# NOTE the gpgkey URLs. OpenTofu's RPM instructions print
# `.../tofu/gpgkeys` (plural), which 404s and fails the install outright --
# the working URL is `gpgkey`, singular, as the apt side already uses. Their
# snippet also pins `sslcacert=/etc/pki/tls/certs/ca-bundle.crt`, which breaks
# the repo wherever that path is not populated AND still exits 0, so it is
# omitted here in favour of the system default.

- name: Configure OpenTofu repository (Ubuntu)
  block:
    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Two keys, both required: the project's signing key and the package
    # host's. They go in one keyring; apt accepts either signature.
    - name: Add OpenTofu project GPG key
      ansible.builtin.get_url:
        url: https://get.opentofu.org/opentofu.gpg
        dest: /etc/apt/keyrings/opentofu.gpg
        mode: '0644'

    - name: Add OpenTofu package host GPG key
      ansible.builtin.get_url:
        url: https://packages.opentofu.org/opentofu/tofu/gpgkey
        dest: /etc/apt/keyrings/opentofu-repo.asc
        mode: '0644'

    # A host provisioned by an older revision carries the .list beside the
    # .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy OpenTofu .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/opentofu.list
        state: absent

    # signed_by names the PACKAGE HOST key: packages.opentofu.org signs
    # InRelease with it (NO_PUBKEY 70DF59811A8B9109 when absent), and deb822
    # Signed-By takes a single path. The project key stays fetched beside it
    # for verifying release artefacts by hand.
    - name: Add OpenTofu repository
      ansible.builtin.deb822_repository:
        name: opentofu
        types: deb
        uris: "https://packages.opentofu.org/opentofu/tofu/any/"
        suites: any
        components: main
        signed_by: /etc/apt/keyrings/opentofu-repo.asc
        state: present

  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Configure OpenTofu repository (Fedora)
  ansible.builtin.yum_repository:
    name: opentofu
    description: OpenTofu
    baseurl: "https://packages.opentofu.org/opentofu/tofu/rpm_any/rpm_any/$basearch"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: false
    gpgkey:
      - https://get.opentofu.org/opentofu.gpg
      - https://packages.opentofu.org/opentofu/tofu/gpgkey
  when: ansible_facts['distribution'] == 'Fedora'

# Fedora's own `opentofu` package owns the same /usr/bin/tofu, so dnf will not
# install the vendor `tofu` beside it -- it reports "already installed" and
# exits 0, leaving the older build in place.
- name: Remove the distro OpenTofu package superseded by the vendor repo (Fedora)
  ansible.builtin.dnf:
    name: opentofu
    state: absent
  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# AWS CLI V2 (Linux - official snap, classic confinement)
# ============================================================================
# Fedora packages awscli2 natively (2.36.0 in updates), which is the right rung
# and, more to the point, the only one that works: nothing here installs snapd
# and Fedora does not ship it, so a snap on Fedora is a warning line, not a
# tool.
#
# Ubuntu keeps the official snap. Its universe `awscli` IS v2 (2.31.35), but
# universe freezes at release for five years while the AWS CLI ships weekly, so
# the snap is the one that stays current. classic confinement is required so the
# CLI can read ~/.aws and the rest of the host filesystem.
#
# The snap's DEFAULT track is `v2/stable`; `latest/stable` is still v1. Install
# without naming a channel, as AWS documents, and do not "fix" it to latest.
- name: Install AWS CLI v2 (Fedora)
  block:
    - name: Install awscli2
      ansible.builtin.dnf:
        name: awscli2
        state: present

  rescue:
    - name: Record that AWS CLI v2 did not install (Fedora)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['AWS CLI v2: ' ~ (ansible_failed_result.msg | default('dnf install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

- name: Install AWS CLI v2 via snap (Ubuntu)
  block:
    - name: Install the aws-cli snap (classic)
      community.general.snap:
        name: aws-cli
        classic: true
        state: present

  rescue:
    - name: Record that AWS CLI v2 did not install (Ubuntu)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['AWS CLI v2: ' ~ (ansible_failed_result.msg | default('snap install failed'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'

# A Fedora box provisioned by an older revision carries the snap alongside the
# dnf package, and the snap's /snap/bin can win on PATH.
- name: Remove the aws-cli snap (Fedora -- superseded by awscli2)
  community.general.snap:
    name: aws-cli
    state: absent
  failed_when: false
  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# AWS SESSION MANAGER PLUGIN (for aws ssm start-session)
# ============================================================================

# AWS publishes no repo for it, only a package per distro family and arch with a
# detached signature beside it. The package is installed only once that
# signature checks out against the AWS key shipped in this role, which AWS
# publishes in its documentation rather than beside the download.
#
# The scratch steps are changed_when: false: they work in a throwaway directory,
# and the install below is what reports a real change.
- name: Install AWS Session Manager Plugin (Linux)
  vars:
    infrastructure_ssm_pkg: "session-manager-plugin.{{ 'rpm' if ansible_facts['distribution'] == 'Fedora' else 'deb' }}"
    infrastructure_ssm_url: >-
      https://s3.amazonaws.com/session-manager-downloads/plugin/latest/{{
      'linux' if ansible_facts['distribution'] == 'Fedora' else 'ubuntu' }}_{{
      'arm64' if hyperi_arch_deb == 'arm64' else '64bit' }}/{{ infrastructure_ssm_pkg }}
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  block:
    - name: Ensure gpg is present for the signature check
      ansible.builtin.package:
        name: "{{ 'gnupg2' if ansible_facts['distribution'] == 'Fedora' else 'gpg' }}"
        state: present

    - name: Create a private working directory for the plugin
      ansible.builtin.tempfile:
        state: directory
        suffix: .ssm-plugin
      register: infrastructure_ssm_dir
      changed_when: false
      check_mode: false

    - name: Download the Session Manager Plugin package and its signature
      ansible.builtin.get_url:
        url: "{{ infrastructure_ssm_url }}{{ item }}"
        dest: "{{ infrastructure_ssm_dir.path }}/{{ infrastructure_ssm_pkg }}{{ item }}"
        mode: '0644'
      loop: ['', '.sig']
      changed_when: false
      check_mode: false

    - name: Stage the AWS Session Manager signing key
      ansible.builtin.copy:
        src: session-manager-plugin.asc
        dest: "{{ infrastructure_ssm_dir.path }}/signing-key.asc"
        mode: '0644'
      changed_when: false
      check_mode: false

    # gpgv reads a binary keyring only.
    - name: Convert the signing key to a keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --homedir
          - "{{ infrastructure_ssm_dir.path }}"
          - --dearmor
          - --output
          - "{{ infrastructure_ssm_dir.path }}/signing-key.gpg"
          - "{{ infrastructure_ssm_dir.path }}/signing-key.asc"
      changed_when: false
      check_mode: false

    # Fails closed: a missing, bad or foreign signature stops the install.
    - name: Verify the Session Manager Plugin signature
      ansible.builtin.command:
        argv:
          - gpgv
          - --status-fd
          - '1'
          - --keyring
          - "{{ infrastructure_ssm_dir.path }}/signing-key.gpg"
          - "{{ infrastructure_ssm_dir.path }}/{{ infrastructure_ssm_pkg }}.sig"
          - "{{ infrastructure_ssm_dir.path }}/{{ infrastructure_ssm_pkg }}"
      register: infrastructure_ssm_verify
      changed_when: false
      check_mode: false
      failed_when: >-
        infrastructure_ssm_verify.rc != 0
        or ('[GNUPG:] VALIDSIG ' ~ infrastructure_ssm_signing_fingerprint) not in infrastructure_ssm_verify.stdout

    # disable_gpg_check: the RPM carries no rpm-native signature; the detached
    # one above is what AWS signs.
    - name: Install Session Manager Plugin (Fedora)
      ansible.builtin.dnf:
        name: "{{ infrastructure_ssm_dir.path }}/{{ infrastructure_ssm_pkg }}"
        state: present
        disable_gpg_check: true
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install Session Manager Plugin (Ubuntu)
      ansible.builtin.apt:
        deb: "{{ infrastructure_ssm_dir.path }}/{{ infrastructure_ssm_pkg }}"
      when: ansible_facts['distribution'] == 'Ubuntu'

  rescue:
    - name: Record that the Session Manager Plugin did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Session Manager Plugin: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  always:
    - name: Remove the plugin working directory
      ansible.builtin.file:
        path: "{{ infrastructure_ssm_dir.path }}"
        state: absent
      changed_when: false
      check_mode: false
      when: infrastructure_ssm_dir.path is defined

# ============================================================================
# AWS-VAULT (secure credential storage in OS keychain)
# ============================================================================
# The ByteNess fork, not 99designs/aws-vault: 99designs stopped at v7.2.0 in
# 2023. The fork publishes the same asset names, so a host carrying the old
# binary has it replaced in place at /usr/local/bin/aws-vault.

- name: Install aws-vault (Linux)
  block:
    - name: List the aws-vault releases
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ infrastructure_aws_vault_repo }}/releases?per_page=30"
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: infrastructure_aws_vault_releases
      check_mode: false

    # Sorted rather than trusting the API's order, then cut to the releases past
    # the cooldown (infrastructure_release_cutoff).
    - name: List the aws-vault releases past the cooldown
      ansible.builtin.set_fact:
        infrastructure_aws_vault_candidates: >-
          {{ infrastructure_aws_vault_releases.json
             | rejectattr('draft') | rejectattr('prerelease')
             | selectattr('published_at', 'le', infrastructure_release_cutoff)
             | sort(attribute='published_at', reverse=true)
             | map(attribute='tag_name') | list }}

    - name: Check an aws-vault release is past the cooldown
      ansible.builtin.assert:
        that: infrastructure_aws_vault_candidates | length > 0
        fail_msg: >-
          no {{ infrastructure_aws_vault_repo }} release among the newest 30 is at
          least {{ infrastructure_min_release_age_days }} days old
        quiet: true

    - name: Pick the newest aws-vault release past the cooldown
      ansible.builtin.set_fact:
        infrastructure_aws_vault_version: "{{ infrastructure_aws_vault_candidates | first }}"
        infrastructure_aws_vault_asset: "aws-vault-linux-{{ hyperi_arch_deb }}"

    - name: Fetch the aws-vault release checksums
      ansible.builtin.uri:
        url: >-
          https://github.com/{{ infrastructure_aws_vault_repo }}/releases/download/{{
          infrastructure_aws_vault_version }}/aws-vault_sha256_checksums.txt
        return_content: true
      register: infrastructure_aws_vault_sums
      check_mode: false

    - name: Resolve the aws-vault checksum
      ansible.builtin.set_fact:
        infrastructure_aws_vault_sha: >-
          {{ (infrastructure_aws_vault_sums.content.splitlines()
              | select('match', '^[0-9a-f]{64} +' ~ infrastructure_aws_vault_asset ~ '$')
              | first).split() | first }}

    # Without a checksum get_url keeps whatever already sits at dest, so a new
    # release never landed. The digest comes from the same release, so it detects
    # a change and a truncated download; it is not a provenance check.
    - name: Download aws-vault binary
      ansible.builtin.get_url:
        url: >-
          https://github.com/{{ infrastructure_aws_vault_repo }}/releases/download/{{
          infrastructure_aws_vault_version }}/{{ infrastructure_aws_vault_asset }}
        dest: /usr/local/bin/aws-vault
        checksum: "sha256:{{ infrastructure_aws_vault_sha }}"
        owner: root
        group: root
        mode: '0755'

  rescue:
    - name: Record that aws-vault did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['aws-vault: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# ============================================================================
# HELM (Linux - Helm's apt repo on Ubuntu, Fedora's own package on Fedora)
# ============================================================================
# Ubuntu takes Helm's apt repo on packages.buildkite.com and Fedora the helm
# package in its own repos, so the host updater keeps Helm current on both.
- name: Install Helm from its package repositories (Linux)
  block:
    # Runs before any apt call: a leftover .list naming a different Signed-By
    # for the same URI as helm.sources stops apt reading any source list.
    - name: Remove the superseded Helm apt sources and key (Ubuntu)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/helm.list
        - /etc/apt/sources.list.d/helm-stable-debian.list
        - /etc/apt/keyrings/helm.asc
      when: ansible_facts['distribution'] == 'Ubuntu'

    # Downloaded under a name no apt source trusts and copied to the trusted path
    # only once its fingerprint matches; forced, so a rejected download is
    # replaced on the next run instead of kept by an If-Modified-Since 304.
    - name: Download the Helm apt signing key (Ubuntu)
      ansible.builtin.get_url:
        url: "{{ infrastructure_helm_apt_key_url }}"
        dest: /etc/apt/keyrings/helm-buildkite.asc.unverified
        mode: '0644'
        force: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    # A minimal Ubuntu ships gpgv but not gpg, which the fingerprint read needs.
    - name: Ensure gpg is present for the fingerprint check (Ubuntu)
      ansible.builtin.apt:
        name: gpg
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Read the Helm apt signing key fingerprint (Ubuntu)
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, /etc/apt/keyrings/helm-buildkite.asc.unverified]
      register: infrastructure_helm_key
      changed_when: false
      check_mode: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    # Fails closed: neither the trusted key nor the repo is written unless the
    # file holds exactly one key and it matches Helm's published fingerprint.
    # apt trusts every key in a Signed-By file, so a second key riding along
    # with the right one would be trusted too.
    - name: Verify the Helm apt signing key fingerprint (Ubuntu)
      ansible.builtin.assert:
        that:
          - infrastructure_helm_key_count | int == 1
          - infrastructure_helm_key_fpr == infrastructure_helm_apt_key_fingerprint | upper | replace(' ', '')
        fail_msg: >-
          Helm apt key file holds {{ infrastructure_helm_key_count }} key(s), primary
          {{ infrastructure_helm_key_fpr or 'missing' }}; expected exactly one,
          {{ infrastructure_helm_apt_key_fingerprint }}
        quiet: true
      vars:
        infrastructure_helm_key_count: "{{ infrastructure_helm_key.stdout_lines | select('match', '^pub:') | list | length }}"
        infrastructure_helm_key_fpr: >-
          {{ (infrastructure_helm_key.stdout_lines | select('match', '^fpr:')
              | first | default('')).split(':')[9] | default('') }}
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install the verified Helm apt signing key (Ubuntu)
      ansible.builtin.copy:
        src: /etc/apt/keyrings/helm-buildkite.asc.unverified
        dest: /etc/apt/keyrings/helm-buildkite.asc
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Add the Helm APT repository (Ubuntu)
      ansible.builtin.deb822_repository:
        name: helm
        types: deb
        uris: "https://packages.buildkite.com/helm-linux/helm-debian/any/"
        suites: any
        components: main
        signed_by: /etc/apt/keyrings/helm-buildkite.asc
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install Helm (Ubuntu)
      ansible.builtin.apt:
        name: helm
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove the baltocdn Helm repository (Fedora)
      ansible.builtin.yum_repository:
        name: helm
        state: absent
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install Helm (Fedora)
      ansible.builtin.dnf:
        name: helm
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    # helm resolves its plugin directory from the running process's own HOME,
    # so this has to be the desktop user rather than the connecting account.
    - name: Install Helm Dashboard plugin
      ansible.builtin.command: helm plugin install https://github.com/komodorio/helm-dashboard.git
      become: true
      become_user: "{{ actual_user }}"
      failed_when: false
      changed_when: false

  rescue:
    - name: Record that Helm did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Helm: ' ~ (ansible_failed_result.msg | default('repo/install failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# ============================================================================
# OPENTOFU + OPENBAO
# ============================================================================
# Packaging differs per platform, so each takes the best rung available:
#
#            tofu                          bao
#   Fedora   OpenTofu repo (above)         dnf (native)
#   Ubuntu   OpenTofu repo (above)         OpenBao repo (see below)
#   macOS    brew core                     brew core
#
# tofu comes from the vendor repo on both distros so the version tracks
# upstream: brew and both repos carry 1.12.6, where Fedora's own package is
# frozen at 1.11.5.
#
# bao stays on Fedora's dnf, which trails upstream by a patch rather than a
# minor.

# Both installs depend on a repository an earlier task adds, so they are the
# one pair in this file that cannot succeed in check mode -- the repo is only
# previewed and the package resolves against nothing. The rescue is what keeps
# that a warning rather than an aborted remediation, and it covers an
# unreachable vendor repo on a real run for the same reason.
- name: Install OpenTofu
  block:
    - name: Install OpenTofu (Ubuntu)
      ansible.builtin.apt:
        name: tofu
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install OpenTofu (Fedora)
      ansible.builtin.dnf:
        name: tofu
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

  rescue:
    - name: Record that OpenTofu did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['OpenTofu: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('repo/install failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Install OpenBao (Fedora)
  ansible.builtin.dnf:
    name: openbao
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

# OpenBao now runs an official APT repo, so Ubuntu takes it. It replaces the
# `openbao` snap, which never installed anything: both `2/stable` and
# `latest/stable` are empty (only beta/edge carry a revision), so the task
# failed into its rescue and every box got a warning line instead of `bao`.
# The snap also asked for classic confinement on a strictly-confined snap.
#
# The repo is signed by the `[S]` subkey E617DCD4065C2AFC0B2CF7A7BA8BC08C0F691F94
# of the project key below -- verify that chain again before changing the URL.
# Fedora keeps its native dnf package (a higher rung); macOS uses brew.
- name: Install OpenBao from the official repository (Ubuntu)
  block:
    - name: Add the OpenBao GPG key
      ansible.builtin.get_url:
        url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc
        dest: /etc/apt/keyrings/openbao.asc
        mode: '0644'

    - name: Add the OpenBao repository
      ansible.builtin.deb822_repository:
        name: openbao
        types: deb
        uris: "https://pkgs.openbao.org/deb/"
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/openbao.asc
        state: present

    - name: Install OpenBao
      ansible.builtin.apt:
        name: openbao
        state: present
        update_cache: true

  rescue:
    - name: Record that OpenBao did not install
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['OpenBao: ' ~ (ansible_failed_result.msg | default('repo/install failed'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'

# The snap never carried a stable revision, but a box that ran an older
# revision of this role may still have it parked in a broken state.
- name: Remove the openbao snap (Ubuntu -- superseded by the official repo)
  community.general.snap:
    name: openbao
    state: absent
  failed_when: false
  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# macOS - Install via Homebrew
# ============================================================================

- name: Install cloud tools via Homebrew (macOS)
  block:
    - name: Install AWS CLI
      community.general.homebrew:
        name: awscli
        state: present

    - name: Install Helm
      community.general.homebrew:
        name: helm
        state: present

    # Both are in homebrew-core, so no tap is needed. That is a straight
    # improvement on what they replace: HashiCorp pulled terraform and vault
    # OUT of homebrew-core into their own tap after the licence change, which
    # is the tap we no longer add.
    - name: Install OpenTofu
      community.general.homebrew:
        name: opentofu
        state: present

    - name: Install OpenBao
      community.general.homebrew:
        name: openbao
        state: present

    - name: Install Helm Dashboard plugin
      ansible.builtin.command: helm plugin install https://github.com/komodorio/helm-dashboard.git
      failed_when: false
      changed_when: false

    - name: Install Session Manager Plugin
      community.general.homebrew_cask:
        name: session-manager-plugin
        state: present

    # The `aws-vault` cask was renamed `aws-vault-binary` and still ships
    # 99designs v7.2.0; the `aws-vault` formula builds the ByteNess fork. Both
    # link the same `aws-vault` binary, so the cask goes first.
    - name: Remove the aws-vault-binary cask (superseded by the formula)
      community.general.homebrew_cask:
        name: aws-vault-binary
        state: absent

    - name: Install aws-vault
      community.general.homebrew:
        name: aws-vault
        state: present

  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# CHECKOV - IaC / config security scanner (CI parity)
# ============================================================================
# checkov scans OpenTofu/Terraform, Kubernetes, CloudFormation and more, so it
# lives with the IaC tools. It is a Python tool that no distro packages, so
# Linux uses uv (Tier 2 -- hyperi-update refreshes it via `uv tool upgrade
# --all`). macOS has a brew formula. uv is installed by the base.
- name: Install checkov (macOS)
  community.general.homebrew:
    name: checkov
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install checkov (Linux)
  ansible.builtin.command:
    cmd: uv tool install checkov
    creates: "{{ user_home }}/.local/share/uv/tools/checkov"
  become: true
  become_user: "{{ actual_user }}"
  environment:
    PATH: "/usr/local/bin:{{ user_home }}/.local/bin:{{ ansible_facts['env'].PATH }}"
  register: infrastructure_checkov
  changed_when: "'Installed' in infrastructure_checkov.stdout | default('')"
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Warn if checkov did not install
  # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
  # that playbooks/main.yml post_tasks reports from; a per-role name would
  # fragment the summary so almost nothing would be reported.
  ansible.builtin.set_fact:
    deploy_warnings: >-
      {{ deploy_warnings | default([])
         + ['checkov: uv tool install failed -- ' ~ (infrastructure_checkov.stderr | default('') | trim | truncate(120))] }}
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - infrastructure_checkov.rc | default(0) != 0

# ============================================================================
# TERRAFORM-DOCS - module reference generator for OpenTofu / Terraform
# ============================================================================
# Engine-agnostic despite the name -- it parses `.tf` whichever binary runs it,
# and OpenTofu ships no native `tofu docs` (opentofu/opentofu#2081 open).
#
# Module code must stay in `.tf`: `.tofu` parsing is limited, so a `.tofu`
# module yields an incomplete inputs/outputs table rather than failing loudly.
#
# No distro packages it. The project ships release tarballs, so Linux takes the
# binary (Tier 3: hyperi-update re-fetches it) and macOS the brew formula --
# neither path needs a Go toolchain.
- name: Install terraform-docs (macOS)
  community.general.homebrew:
    name: terraform-docs
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install terraform-docs (Linux)
  block:
    - name: Get latest terraform-docs version
      ansible.builtin.uri:
        url: https://api.github.com/repos/terraform-docs/terraform-docs/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: terraform_docs_latest
      check_mode: false

    # The asset carries the tag verbatim, v and all:
    # terraform-docs-v0.24.0-linux-amd64.tar.gz. The tarball holds LICENSE,
    # README.md and the binary at the root, so only the binary is extracted.
    - name: Download and extract terraform-docs
      ansible.builtin.unarchive:
        src: >-
          https://github.com/terraform-docs/terraform-docs/releases/download/{{
          terraform_docs_latest.json.tag_name }}/terraform-docs-{{
          terraform_docs_latest.json.tag_name }}-linux-{{ hyperi_arch_deb }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: terraform-docs
        mode: '0755'
      when: not ansible_check_mode

  rescue:
    - name: Record that terraform-docs did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['terraform-docs: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
