---
# Infrastructure Role — Generic IaC + cloud CLIs (any IaC operator).
# Not HyperI-specific. Org tooling lives in `soe`.

# Before the installs: removing terraform/vault must not race the tofu/bao
# install, and the HashiCorp repo has to go before an apt update reads it again.
#
# `removals` ONLY, and never on a propagated tag. Installing the IaC tools is
# not a request to delete someone's Terraform or unhook their HashiCorp repo --
# that is a remediation, asked for explicitly. `--tags infrastructure` and
# `--tags cloud` used to fire it too, which meant a routine IaC install silently
# took both away.
- name: Remove the retired HashiCorp tools (opt-in)
  ansible.builtin.include_tasks:
    file: removals.yml
    apply:
      tags: ['removals', 'never']
  tags: ['removals', 'never']
  when: "'removals' in ansible_run_tags"

- name: Install IaC + AWS cloud tools (OpenTofu, OpenBao, AWS CLI)
  ansible.builtin.include_tasks:
    file: cloud.yml
    apply:
      tags: ['infrastructure', 'cloud']
  tags: ['infrastructure', 'cloud']

- name: Install Azure CLI
  ansible.builtin.include_tasks:
    file: azure.yml
    apply:
      tags: ['infrastructure', 'azure']
  tags: ['infrastructure', 'azure']

- name: Install Google Cloud CLI
  ansible.builtin.include_tasks:
    file: gcloud.yml
    apply:
      tags: ['infrastructure', 'gcloud']
  tags: ['infrastructure', 'gcloud']

- name: Install Kubernetes tools
  ansible.builtin.include_tasks:
    file: k8s.yml
    apply:
      tags: ['infrastructure', 'k8s']
  tags: ['infrastructure', 'k8s']

# The `data` group: vector, clickhouse-client, rpk (Redpanda), valkey-cli.
- name: Install data platform tools (data group)
  ansible.builtin.include_tasks:
    file: data_tools.yml
    apply:
      tags: ['infrastructure', 'data']
  tags: ['infrastructure', 'data']

- name: Install Cloudflare CLIs
  ansible.builtin.include_tasks:
    file: cloudflare.yml
    apply:
      tags: ['infrastructure', 'cloudflare']
  tags: ['infrastructure', 'cloudflare']

# Last: report what actually runs, once every install above has had its turn.
- name: Verify the infrastructure toolchain
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: ['infrastructure', 'verify']
  tags: ['infrastructure', 'verify']
