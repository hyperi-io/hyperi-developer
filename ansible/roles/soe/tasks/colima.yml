---
# macOS container runtime (soe, macOS only). The developer base ships only the
# Docker CLI (bring-your-own-daemon); HyperI Macs get a daemon by default:
#   - colima: runs docker-ce in a small Virtualization.framework VM -- the same
#     engine Linux runs natively. Homebrew formula (Tier 1, brew upgrade sweeps it).
#   - Apple `container`: native per-container micro-VMs on Apple silicon. The
#     homebrew-core formula (Tier 1, brew upgrade sweeps it), which needs Apple
#     silicon and macOS 26. Optional: warn, never abort.
# Both are wrapped warn-and-continue so a single failure does not sink the soe run.

- name: Install colima (Docker daemon for macOS)
  block:
    - name: Install colima via Homebrew
      community.general.homebrew:
        name: colima
        state: present
      become: false
      environment: "{{ homebrew_env }}"

  rescue:
    - name: Record that colima did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # cross-role accumulator the play summarises at the end; prefixing it
      # per-role would break the accumulation.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['colima: ' ~ (ansible_failed_result.msg | default('brew install failed'))] }}

# Installing colima is not enough to make it usable. Two things bite otherwise,
# and both look like application faults rather than environment faults:
#
#   1. It does not start at login. After a reboot the daemon is simply down, and
#      every container-backed integration test fails on a missing socket. This
#      is a LaunchAgent, not a LaunchDaemon: colima's VM is per-user (state in
#      ~/.colima), so starting it as root at boot would build a DIFFERENT VM
#      whose socket nobody's DOCKER_HOST points at -- it would look fine and
#      silently not work.
#   2. Its socket lives under $HOME, not /var/run/docker.sock. The `docker` CLI
#      finds it via the docker context, but anything speaking to the daemon
#      directly does NOT -- testcontainers (bollard) hardcodes the conventional
#      path and dies with SocketNotFoundError("/var/run/docker.sock") while
#      `docker ps` works fine two lines earlier.
#
# Set unconditionally: colima is the only macOS daemon we run (docker-ce on
# Linux, colima here), so there is no other socket to defer to.
- name: Make colima usable (autostart + socket discovery)
  block:
    # `which`, not `command -v`: command is a shell builtin and
    # ansible.builtin.command execs directly, so it fails on every host --
    # taking the LaunchAgent and the socket config below with it, and reporting
    # as though the brew install were at fault. This path is macOS-only, where
    # /usr/bin/which is always present.
    - name: Locate the colima binary
      ansible.builtin.command:
        cmd: which colima
      register: soe_colima_bin
      changed_when: false
      failed_when: soe_colima_bin.rc != 0

    - name: Start colima at login
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env'].HOME }}/Library/LaunchAgents/io.hyperi.colima.plist"
        mode: '0644'
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>io.hyperi.colima</string>
              <key>ProgramArguments</key>
              <array>
                  <string>{{ soe_colima_bin.stdout | trim }}</string>
                  <string>start</string>
              </array>
              <key>EnvironmentVariables</key>
              <dict>
                  <key>PATH</key>
                  <string>{{ (soe_colima_bin.stdout | trim | dirname) }}:/usr/bin:/bin:/usr/sbin:/sbin</string>
              </dict>
              <key>RunAtLoad</key>
              <true/>
              <!-- colima is a VM, so KeepAlive would fight a deliberate stop. -->
              <key>KeepAlive</key>
              <false/>
              <key>StandardOutPath</key>
              <string>{{ ansible_facts['env'].HOME }}/.cache/hyperi-ai/colima-launchagent.log</string>
              <key>StandardErrorPath</key>
              <string>{{ ansible_facts['env'].HOME }}/.cache/hyperi-ai/colima-launchagent.log</string>
          </dict>
          </plist>
      become: false

    # Sizing has to be asserted explicitly. colima's default VM is small, and
    # the always-on dev daemons (ClickHouse, Redpanda) already reserve several
    # GB of it, so a testcontainers suite gets what is left -- which is not
    # enough to bring a broker up inside its 60s readiness budget. Every test
    # then fails at once, looking like a broker fault rather than a starved VM.
    #
    # CPUs are not pinned, so leaving two for macOS is enough. Memory is
    # reserved, so take half and no more.
    - name: Work out the VM sizing this Mac should give colima
      # noqa: var-naming[no-role-prefix] -- soe_ IS the role prefix here
      ansible.builtin.set_fact:
        soe_colima_cpu: "{{ [ansible_facts['processor_vcpus'] | int - 2, 2] | max }}"
        soe_colima_mem_gb: "{{ [ansible_facts['memtotal_mb'] | int // 2048, 4] | max }}"

    - name: Read colima's persisted VM sizing
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env'].HOME }}/.colima/default/colima.yaml"
      register: soe_colima_cfg
      failed_when: false

    # Only ever grows the VM. A hand-tuned larger allocation is a deliberate
    # choice and this must not quietly claw it back.
    - name: Resize the colima VM when it is smaller than this Mac can afford
      ansible.builtin.command:
        cmd: "colima start --cpu {{ soe_colima_cpu }} --memory {{ soe_colima_mem_gb }}"
      become: false
      register: soe_colima_resize
      changed_when: soe_colima_resize.rc == 0
      when: >-
        soe_colima_cfg.content is not defined
        or ((soe_colima_cfg.content | b64decode | from_yaml).cpu | default(0) | int < soe_colima_cpu | int)
        or ((soe_colima_cfg.content | b64decode | from_yaml).memory | default(0) | int < soe_colima_mem_gb | int)

    - name: Load the colima launch agent
      ansible.builtin.command:
        cmd: >-
          launchctl bootstrap gui/{{ ansible_facts['user_uid'] }}
          {{ ansible_facts['env'].HOME }}/Library/LaunchAgents/io.hyperi.colima.plist
      become: false
      register: soe_colima_bootstrap
      # Runs every time, not just when the plist changed: 37 is "already
      # bootstrapped", so a re-run is a no-op, and it also re-loads the agent if
      # someone unloaded it by hand. Gating on `changed` would leave that broken.
      failed_when: soe_colima_bootstrap.rc not in [0, 37]
      changed_when: soe_colima_bootstrap.rc == 0

    # .zshenv, NOT .zshrc: zsh reads .zshrc only for interactive shells, so a
    # build script, CI runner or agent tool invoking `zsh -c` would still miss
    # it and fail on the socket. .zshenv is read by every shell.
    #
    # Per-user rather than /etc/zshenv on purpose. colima's VM and socket are
    # per-user even though the binary is shared -- the socket path is under
    # $HOME -- so this is user state, not machine state.
    - name: Point DOCKER_HOST at colima's socket
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env'].HOME }}/.zshenv"
        create: true
        mode: '0644'
        marker: "# {mark} colima docker socket (hyperi-developer)"
        block: |
          # colima is the macOS container daemon (docker-ce on Linux, colima on
          # the Mac -- nothing else), and its socket is not at the conventional
          # /var/run/docker.sock that testcontainers and friends look for.
          export DOCKER_HOST="unix://$HOME/.colima/default/docker.sock"
      become: false

  rescue:
    - name: Record that the colima autostart/socket wiring did not apply
      # noqa: var-naming[no-role-prefix] -- shared cross-role accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['colima-wiring: ' ~ (ansible_failed_result.msg | default('autostart/socket setup failed'))] }}

# The formula declares `depends_on arch: :arm64` and `macos: :tahoe`, so any
# other Mac would only collect a warning.
- name: Install Apple container (native macOS containers)
  when:
    - hyperi_arch_deb == 'arm64'
    - ansible_facts['distribution_major_version'] | int >= 26
  block:
    - name: Install Apple container via Homebrew
      community.general.homebrew:
        name: container
        state: present
      become: false
      environment: "{{ homebrew_env }}"

    # Earlier runs of this role installed Apple's signed .pkg into /usr/local.
    # Its receipt is the record of exactly which files that put there.
    - name: Check for the Apple container .pkg receipt
      ansible.builtin.command:
        cmd: pkgutil --pkg-info com.apple.container-installer
      register: soe_container_pkg_receipt
      changed_when: false
      failed_when: false
      check_mode: false

    # Removed only once the brew copy is in place, so the host is never left
    # without a container CLI.
    - name: Remove the Apple container .pkg install
      when: soe_container_pkg_receipt.rc == 0
      block:
        # The uninstaller refuses while the services run, and as root it would
        # only look in root's launchd domain, not the user's where they live.
        - name: Stop the .pkg container services
          ansible.builtin.command:
            cmd: /usr/local/bin/container system stop
          become: false
          register: soe_container_pkg_stop
          changed_when: soe_container_pkg_stop.rc == 0
          failed_when: false

        # -k keeps ~/Library/Application Support/com.apple.container, which the
        # brew copy reads as its own data.
        - name: Uninstall the .pkg with Apple's own uninstaller
          ansible.builtin.command:
            cmd: /usr/local/bin/uninstall-container.sh -k
            removes: /usr/local/bin/uninstall-container.sh
          become: true

  rescue:
    - name: Record that Apple container did not install
      # noqa: var-naming[no-role-prefix] -- shared cross-role accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['apple-container: ' ~ (ansible_failed_result.msg | default('brew install or .pkg removal failed'))] }}
