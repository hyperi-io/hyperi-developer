---
# Claude Code CLI installation. THE BINARY ONLY.
#
# Every platform takes Anthropic's native build, installed per user by the
# binary's own `claude install`, whose updater then keeps it current. This is
# what https://claude.ai/install.sh does, with one step it skips: the release
# manifest's detached signature is checked against the pinned release key
# before the manifest's SHA256 is trusted for the binary.
#
# The HyperI managed settings live in claude_policy.yml, and the split is the
# point: this file is reachable from outside soe by design (developer-ai's
# Codex plugin hard-requires Claude Code), so `--tags claude` must only ever
# install the CLI, never write org policy into /etc/claude-code/.

- name: Inspect the Claude Code launcher
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/bin/claude"
    follow: false
  register: soe_claude_launcher

# A launcher linking into the native versions directory is a native install, which its own updater maintains.
- name: Decide whether Claude Code needs a native install
  ansible.builtin.set_fact:
    soe_claude_native_present: >-
      {{ soe_claude_launcher.stat.islnk | default(false)
         and soe_claude_launcher.stat.lnk_target is match('^' ~ (user_home ~ '/.local/share/claude/versions/') | regex_escape) }}

# ============================================================================
# Native install, verified against the signed release manifest
# ============================================================================

- name: Install Claude Code natively
  when: not soe_claude_native_present | bool
  vars:
    soe_claude_on_mac: "{{ ansible_facts['distribution'] == 'MacOSX' }}"
    soe_claude_platform: >-
      {{ ('darwin' if soe_claude_on_mac else 'linux') ~ '-'
         ~ ('arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x64') }}
    soe_claude_version: "{{ soe_claude_channel_file.content | default('') | b64decode | trim }}"
  block:
    # A minimal Ubuntu ships gpgv but not gpg, which the fingerprint read needs.
    - name: Ensure gpg is present for the release signature check (Linux)
      ansible.builtin.package:
        name: "{{ 'gpg' if ansible_facts['distribution'] == 'Ubuntu' else 'gnupg2' }}"
        state: present
      become: true
      when: not soe_claude_on_mac

    - name: Ensure gnupg is present for the release signature check (macOS)
      community.general.homebrew:
        name: gnupg
        state: present
      environment: "{{ homebrew_env }}"
      become: false
      when: soe_claude_on_mac

    - name: Create a staging directory for the Claude Code download
      ansible.builtin.tempfile:
        state: directory
        prefix: claude-install.
      register: soe_claude_stage
      become: "{{ not soe_claude_on_mac }}"
      become_user: "{{ actual_user if not soe_claude_on_mac else omit }}"

    - name: Fetch the Claude Code release key and the channel pointer
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ soe_claude_stage.path }}/{{ item.name }}"
        mode: '0644'
        force: true
      loop:
        - {name: key.asc, url: "{{ soe_claude_key_url }}"}
        - {name: channel, url: "{{ soe_claude_release_url }}/{{ soe_claude_channel }}"}
      become: "{{ not soe_claude_on_mac }}"
      become_user: "{{ actual_user if not soe_claude_on_mac else omit }}"

    - name: Read the Claude Code channel version
      ansible.builtin.slurp:
        src: "{{ soe_claude_stage.path }}/channel"
      register: soe_claude_channel_file

    # An HTML error page must not reach the manifest URL.
    - name: Check the channel pointer names a version
      ansible.builtin.assert:
        that: soe_claude_version is match('^[0-9]+\.[0-9]+\.[0-9]+')
        fail_msg: "{{ soe_claude_release_url }}/{{ soe_claude_channel }} returned {{ soe_claude_version[:60] }}"
        quiet: true

    - name: Fetch the Claude Code release manifest and its signature
      ansible.builtin.get_url:
        url: "{{ soe_claude_release_url }}/{{ soe_claude_version }}/{{ item }}"
        dest: "{{ soe_claude_stage.path }}/{{ item }}"
        mode: '0644'
        force: true
      loop: [manifest.json, manifest.json.sig]
      become: "{{ not soe_claude_on_mac }}"
      become_user: "{{ actual_user if not soe_claude_on_mac else omit }}"

    - name: Read the Claude Code release key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, "{{ soe_claude_stage.path }}/key.asc"]
      environment: "{{ homebrew_env if soe_claude_on_mac else {} }}"
      register: soe_claude_key_read
      changed_when: false
      check_mode: false

    # Exactly one primary key, and the pinned one: gpgv trusts every key in the keyring.
    - name: Verify the Claude Code release key fingerprint
      ansible.builtin.assert:
        that:
          - soe_claude_key_primaries | int == 1
          - soe_claude_key_fpr == soe_claude_key_fingerprint | upper | replace(' ', '')
        fail_msg: >-
          {{ soe_claude_key_url }} holds {{ soe_claude_key_primaries }} key(s), first
          {{ soe_claude_key_fpr or 'missing' }}; expected only {{ soe_claude_key_fingerprint }}
        quiet: true
      vars:
        soe_claude_key_primaries: "{{ soe_claude_key_read.stdout_lines | select('match', '^pub:') | list | length }}"
        soe_claude_key_fpr: >-
          {{ (soe_claude_key_read.stdout_lines | select('match', '^fpr:') | first | default('')).split(':')[9] | default('') }}

    # gpgv reads a binary keyring only.
    - name: Convert the Claude Code release key to a keyring
      ansible.builtin.command:
        argv: [gpg, --batch, --yes, --dearmor, --output, "{{ soe_claude_stage.path }}/key.gpg", "{{ soe_claude_stage.path }}/key.asc"]
        creates: "{{ soe_claude_stage.path }}/key.gpg"
      environment: "{{ homebrew_env if soe_claude_on_mac else {} }}"

    - name: Verify the Claude Code release manifest signature
      ansible.builtin.command:
        argv:
          - gpgv
          - --keyring
          - "{{ soe_claude_stage.path }}/key.gpg"
          - "{{ soe_claude_stage.path }}/manifest.json.sig"
          - "{{ soe_claude_stage.path }}/manifest.json"
      environment: "{{ homebrew_env if soe_claude_on_mac else {} }}"
      changed_when: false
      check_mode: false

    - name: Read the Claude Code release manifest
      ansible.builtin.slurp:
        src: "{{ soe_claude_stage.path }}/manifest.json"
      register: soe_claude_manifest

    - name: Download the Claude Code binary, checked against the signed manifest
      ansible.builtin.get_url:
        url: "{{ soe_claude_release_url }}/{{ soe_claude_version }}/{{ soe_claude_platform }}/claude"
        dest: "{{ soe_claude_stage.path }}/claude"
        checksum: "sha256:{{ (soe_claude_manifest.content | b64decode | from_json).platforms[soe_claude_platform].checksum }}"
        mode: '0755'
      become: "{{ not soe_claude_on_mac }}"
      become_user: "{{ actual_user if not soe_claude_on_mac else omit }}"

    - name: Install Claude Code for the desktop user
      ansible.builtin.command:
        argv: ["{{ soe_claude_stage.path }}/claude", install, "{{ soe_claude_channel }}"]
        creates: "{{ user_home }}/.local/bin/claude"
      become: "{{ not soe_claude_on_mac }}"
      become_user: "{{ actual_user if not soe_claude_on_mac else omit }}"

  rescue:
    - name: Record that Claude Code did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['Claude Code: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))] }}

  always:
    - name: Remove the Claude Code staging directory
      ansible.builtin.file:
        path: "{{ soe_claude_stage.path }}"
        state: absent
      become: true
      when: soe_claude_stage.path is defined

# ============================================================================
# Retire the packaged installs, once the native one runs
# ============================================================================

- name: Check the native Claude Code runs
  ansible.builtin.command:
    argv: ["{{ user_home }}/.local/bin/claude", --version]
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  register: soe_claude_native_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove the packaged Claude Code installs the native one replaces
  when: soe_claude_native_check.rc == 0
  block:
    - name: Remove the npm Claude Code package
      community.general.npm:
        name: '@anthropic-ai/claude-code'
        global: true
        state: absent
      environment: >-
        {{ npm_config_env if ansible_facts['distribution'] == 'MacOSX'
           else {'NPM_CONFIG_PREFIX': user_home ~ '/.npm-global'} }}
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      failed_when: false

    - name: Remove the Claude Code package (Ubuntu)
      ansible.builtin.apt:
        name: claude-code
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove the Claude Code apt repository and key (Ubuntu)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/claude-code.sources
        - /etc/apt/keyrings/claude-code.asc
        - /etc/apt/keyrings/claude-code.asc.unverified
      become: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove the Claude Code package (Fedora)
      ansible.builtin.dnf:
        name: claude-code
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Remove the Claude Code repository (Fedora)
      ansible.builtin.yum_repository:
        name: claude-code
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Remove the Claude Code repository key (Fedora)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code
        - /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code.unverified
      become: true
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Remove the Homebrew Claude Code cask (macOS)
      community.general.homebrew_cask:
        name: claude-code
        state: absent
      environment: "{{ homebrew_cask_env }}"
      become: false
      when: ansible_facts['distribution'] == 'MacOSX'

# The system-wide managed settings live in claude_policy.yml, under a tag that
# only `soe` selects. They are org policy, and this file is not.
