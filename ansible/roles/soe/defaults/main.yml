---
# Claude Code on Linux comes from Anthropic's signed apt/dnf repository. The
# fingerprint is the release signing key published at
# https://code.claude.com/docs/en/setup, checked before the key is trusted.
soe_claude_key_url: https://downloads.claude.ai/keys/claude-code.asc
soe_claude_key_fingerprint: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE  # gitleaks:allow -- public key fingerprint
# `stable` can lag a just-launched model by about a week; set `latest` to follow every release.
soe_claude_channel: stable
soe_claude_apt_repo_url: "https://downloads.claude.ai/claude-code/apt/{{ soe_claude_channel }}"
soe_claude_rpm_repo_url: "https://downloads.claude.ai/claude-code/rpm/{{ soe_claude_channel }}"

# ============================================================================
# Local services -- persistent ClickHouse + Redpanda for ad-hoc work, OPT-IN.
# ============================================================================
#
# Spike instances: somewhere to poke at a query or hand-feed a topic without
# waiting for a suite to build. Integration and e2e suites create and tear down
# their own containers and must not reach for these -- a shared daemon makes a
# suite non-hermetic and order-dependent.
#
# Deployed but stopped. `restart: no` keeps them off after a reboot; they cost
# nothing until `local-services up`, which is seconds because the images are
# already pulled.
soe_local_services_enabled: false

# Per-user because colima's VM and Docker socket belong to one user, so the
# macOS case is forced and Linux matches it. user_home, not env.HOME, so a
# fleet machine reached as a service account still lands in the desktop
# user's home.
soe_local_services_dir: "{{ user_home }}/.config/hyperi/local-services"

soe_local_clickhouse_name: local-clickhouse
soe_local_redpanda_name: local-redpanda

# Latest on every `up`. A spike box tracking upstream finds breakage early, and
# is expected to run ahead of what any product formally supports.
soe_local_clickhouse_tag: latest
soe_local_redpanda_tag: latest

# Off the default ports so these never collide with a project's own compose
# stack, which is free to use 8123/9000.
soe_local_clickhouse_http_port: 18123
soe_local_clickhouse_native_port: 19000
soe_local_redpanda_kafka_port: 9092
soe_local_redpanda_admin_port: 9644

soe_local_clickhouse_password: proofadmin

# Tenant-isolation custom-settings prefix, e.g. SET DFE_current_tenant_id.
soe_local_clickhouse_custom_settings_prefix: DFE_

# Hard cap per container. These share a laptop with an IDE and a browser, and
# an uncapped ClickHouse sizes its caches to the whole VM.
soe_local_memory_limit: 1g

# Seastar's own allocator reservation, which must stay under the container cap
# or the broker is OOM-killed while warming up.
soe_local_redpanda_seastar_memory: 700M
