---
# Ghostty terminal emulator installation
# Uses modular configuration: base config + platform-specific files

# ============================================================
# Variables
# ============================================================
- name: Set Ghostty config directory paths
  ansible.builtin.set_fact:
    ghostty_skel_dir: /etc/skel/.config/ghostty
    ghostty_macos_dir: "{{ ansible_facts['env'].HOME }}/Library/Application Support/com.mitchellh.ghostty"

# ============================================================
# Font Installation
# ============================================================
- name: Install JetBrains Mono font (Fedora)
  ansible.builtin.dnf:
    name: jetbrains-mono-fonts
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install JetBrains Mono font (Ubuntu)
  ansible.builtin.apt:
    name: fonts-jetbrains-mono
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install JetBrains Mono font via Homebrew cask (macOS)
  community.general.homebrew_cask:
    name: font-jetbrains-mono
    state: present
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Ghostty Installation - Fedora (COPR)
# ============================================================
- name: Enable scottames/ghostty COPR (Fedora)
  community.general.copr:
    name: scottames/ghostty
    state: enabled
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Ghostty (Fedora)
  ansible.builtin.dnf:
    name: ghostty
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================
# Ghostty Installation - Ubuntu (ppa:mkasberg/ghostty-ubuntu)
# ============================================================
- name: Install Ghostty from its PPA (Ubuntu)
  vars:
    developer_gui_ghostty_keyring: /etc/apt/keyrings/ghostty-ppa.asc
    developer_gui_ghostty_repo_uri: http://ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu/ubuntu
    developer_gui_ghostty_pinned: "{{ ghostty_ppa_signing_fingerprint | upper | replace(' ', '') }}"
    # Check mode adds no repo, so there is nothing to install from yet.
    developer_gui_ghostty_repo_pending: "{{ ansible_check_mode and developer_gui_ghostty_repo is changed }}"
  when: ansible_facts['distribution'] == 'Ubuntu'
  block:
    # A minimal Ubuntu ships neither: gpg reads the key fingerprint, and
    # deb822_repository needs python3-debian.
    - name: Ensure gpg and python3-debian are present
      ansible.builtin.apt:
        name: [gpg, python3-debian]
        state: present

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # failed_when: on a fresh host there is no trusted key to read yet.
    - name: Read the trusted Ghostty PPA signing key
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, "{{ developer_gui_ghostty_keyring }}"]
      register: developer_gui_ghostty_trusted
      changed_when: false
      failed_when: false
      check_mode: false

    # A trusted file that already holds exactly the pinned key needs no fetch,
    # so a keyserver outage cannot fail the converge of a provisioned host.
    - name: Check whether the trusted Ghostty PPA key is already the pinned one
      ansible.builtin.set_fact:
        developer_gui_ghostty_key_current: >-
          {{ developer_gui_ghostty_trusted.rc | default(1) == 0
             and (developer_gui_ghostty_trusted.stdout_lines | select('match', '^pub:') | list | length) == 1
             and ((developer_gui_ghostty_trusted.stdout_lines | select('match', '^fpr:') | first | default('')).split(':')[9]
                  | default('')) == developer_gui_ghostty_pinned }}

    # Not in check mode: keyserver.ubuntu.com answers the HEAD request get_url
    # makes there with 405, and with no download there is nothing to verify.
    - name: Fetch and verify the Ghostty PPA signing key
      when:
        - not developer_gui_ghostty_key_current | bool
        - not ansible_check_mode
      block:
        - name: Download the Ghostty PPA signing key
          ansible.builtin.get_url:
            url: "{{ ghostty_ppa_signing_key_url }}"
            dest: "{{ developer_gui_ghostty_keyring }}.unverified"
            mode: '0644'
            force: true

        - name: Read the Ghostty PPA signing key fingerprint
          ansible.builtin.command:
            argv: [gpg, --show-keys, --with-colons, "{{ developer_gui_ghostty_keyring }}.unverified"]
          register: developer_gui_ghostty_key
          changed_when: false

        # Exactly one primary key, and the pinned one: apt trusts every key in a
        # Signed-By file, so a second key riding along would be trusted too.
        - name: Verify the Ghostty PPA signing key fingerprint
          ansible.builtin.assert:
            that:
              - developer_gui_ghostty_key_count | int == 1
              - developer_gui_ghostty_key_fpr == developer_gui_ghostty_pinned
            fail_msg: >-
              Ghostty PPA key file holds {{ developer_gui_ghostty_key_count }} key(s), primary
              {{ developer_gui_ghostty_key_fpr or 'missing' }}; expected exactly one,
              {{ ghostty_ppa_signing_fingerprint }}
            quiet: true
          vars:
            developer_gui_ghostty_key_count: "{{ developer_gui_ghostty_key.stdout_lines | select('match', '^pub:') | list | length }}"
            developer_gui_ghostty_key_fpr: >-
              {{ (developer_gui_ghostty_key.stdout_lines | select('match', '^fpr:')
                  | first | default('')).split(':')[9] | default('') }}

        - name: Install the verified Ghostty PPA signing key
          ansible.builtin.copy:
            src: "{{ developer_gui_ghostty_keyring }}.unverified"
            dest: "{{ developer_gui_ghostty_keyring }}"
            remote_src: true
            owner: root
            group: root
            mode: '0644'

    # The running release when the PPA publishes it, else the newest series it
    # does publish -- see ghostty_ppa_supported_suites.
    #
    # http for the same reason as the git-core PPA in developer/tasks/git.yml:
    # Launchpad over https hangs on half-working IPv6, and signed_by verifies
    # what arrives whatever carried it.
    - name: Add the Ghostty PPA repository
      ansible.builtin.deb822_repository:
        name: ghostty-ppa
        types: deb
        uris: "{{ developer_gui_ghostty_repo_uri }}"
        suites: >-
          {{ ansible_facts['distribution_release']
             if ansible_facts['distribution_release'] in ghostty_ppa_supported_suites
             else ghostty_ppa_supported_suites | last }}
        components: main
        signed_by: "{{ developer_gui_ghostty_keyring }}"
        state: present
      register: developer_gui_ghostty_repo

    - name: Refresh the apt cache for the Ghostty PPA
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      when: not developer_gui_ghostty_repo_pending

    - name: Read the ghostty versions apt offers
      ansible.builtin.command:
        argv: [apt-cache, madison, ghostty]
      register: developer_gui_ghostty_madison
      changed_when: false
      check_mode: false
      when: not developer_gui_ghostty_repo_pending

    # Empty when ghostty is not installed.
    - name: Read the installed ghostty version
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Version}', ghostty]
      register: developer_gui_ghostty_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # The .deb releases an older revision installed are versioned 1.3.1-0~ppa2,
    # which sorts above the PPA's 1.3.1~ppa2-noble1, so apt would keep that
    # unmanaged copy forever. A version no repo offers is replaced by the PPA's
    # newest build.
    - name: Replace a ghostty no repository carries
      ansible.builtin.apt:
        name: "ghostty={{ developer_gui_ghostty_ppa_versions | community.general.version_sort | last }}"
        allow_downgrade: true
      vars:
        developer_gui_ghostty_offered: >-
          {{ developer_gui_ghostty_madison.stdout_lines | map('split', '|') | map(attribute=1) | map('trim') | list }}
        developer_gui_ghostty_ppa_versions: >-
          {{ developer_gui_ghostty_madison.stdout_lines | select('search', developer_gui_ghostty_repo_uri)
             | map('split', '|') | map(attribute=1) | map('trim') | list }}
      when:
        - not developer_gui_ghostty_repo_pending
        - developer_gui_ghostty_installed.rc == 0
        - developer_gui_ghostty_ppa_versions | length > 0
        - developer_gui_ghostty_installed.stdout not in developer_gui_ghostty_offered

    - name: Install Ghostty (Ubuntu)
      ansible.builtin.apt:
        name: ghostty
        state: present
      when: not developer_gui_ghostty_repo_pending

  rescue:
    # A source whose key no longer verifies fails every later apt cache refresh
    # in the run. Deleted as a file: deb822_repository state=absent also deletes
    # the keyring of the same name, which is the trusted key here.
    - name: Remove the Ghostty PPA repository after a key mismatch
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ghostty-ppa.sources
        state: absent
      when: ansible_failed_task.action in ['assert', 'ansible.builtin.assert']

    # unique: a persona can pull this role into the play a second time.
    - name: Record that Ghostty did not install (Ubuntu)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared accumulator
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ (deploy_warnings | default([])
              + ['Ghostty: ' ~ (ansible_failed_task.name | default('unknown task'))
                 ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))]) | unique }}

# ============================================================
# Ghostty Installation - macOS (Homebrew)
# ============================================================
- name: Install Ghostty via Homebrew cask (macOS)
  community.general.homebrew_cask:
    name: ghostty
    state: present
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Linux Configuration Deployment (system-wide via /etc/skel)
# ============================================================
- name: Create Ghostty skel config directory (Linux)
  ansible.builtin.file:
    path: "{{ ghostty_skel_dir }}"
    state: directory
    mode: '0755'
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Deploy Ghostty base configuration (Linux)
  ansible.builtin.copy:
    src: ghostty/config
    dest: "{{ ghostty_skel_dir }}/config"
    mode: '0644'
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Deploy Ghostty Linux platform configuration
  ansible.builtin.copy:
    src: ghostty/platform-linux.conf
    dest: "{{ ghostty_skel_dir }}/platform-linux.conf"
    mode: '0644'
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# Vendored Solarized themes - always refreshed (managed files, not user-edited)
- name: Deploy Ghostty themes (Linux skel)
  ansible.builtin.copy:
    src: ghostty/themes/
    dest: "{{ ghostty_skel_dir }}/themes/"
    mode: '0644'
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# Deploy to current user as well (Linux)
- name: Create Ghostty config directory for actual user (Linux)
  ansible.builtin.file:
    path: "{{ user_home }}/.config/ghostty"
    state: directory
    mode: '0755'
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Deploy Ghostty base configuration for actual user (Linux)
  ansible.builtin.copy:
    src: ghostty/config
    dest: "{{ user_home }}/.config/ghostty/config"
    mode: '0644'
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
    force: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Deploy Ghostty Linux platform config for actual user
  ansible.builtin.copy:
    src: ghostty/platform-linux.conf
    dest: "{{ user_home }}/.config/ghostty/platform-linux.conf"
    mode: '0644'
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
    force: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Deploy Ghostty themes for actual user (Linux)
  ansible.builtin.copy:
    src: ghostty/themes/
    dest: "{{ user_home }}/.config/ghostty/themes/"
    mode: '0644'
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# Heal existing configs: the base config ships with force:false to preserve user
# edits, so older installs keep their (broken) builtin Solarized theme line. This
# rewrites just that line to the vendored themes without touching anything else.
- name: Fix stale Ghostty Solarized theme line in existing user config (Linux)
  ansible.builtin.replace:
    path: "{{ user_home }}/.config/ghostty/config"
    regexp: '^theme\s*=.*Solarized.*$'
    replace: 'theme = light:solarized-light,dark:solarized-dark'
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# ============================================================
# macOS Configuration Deployment
# ============================================================
- name: Create Ghostty config directory (macOS)
  ansible.builtin.file:
    path: "{{ ghostty_macos_dir }}"
    state: directory
    mode: '0755'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Deploy Ghostty base configuration (macOS)
  ansible.builtin.copy:
    src: ghostty/config
    dest: "{{ ghostty_macos_dir }}/config"
    mode: '0644'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Deploy Ghostty macOS platform configuration
  ansible.builtin.copy:
    src: ghostty/platform-macos.conf
    dest: "{{ ghostty_macos_dir }}/platform-macos.conf"
    mode: '0644'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Deploy Ghostty themes (macOS)
  ansible.builtin.copy:
    src: ghostty/themes/
    dest: "{{ ghostty_macos_dir }}/themes/"
    mode: '0644'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# CLI on PATH
# ============================================================
# Linux gets this free: the PPA and COPR packages both drop /usr/bin/ghostty.
#
# macOS does not. The cask installs Ghostty.app plus manpages and completions,
# but no binary -- so `ghostty +validate-config`, `ghostty +list-themes` and
# the rest are unreachable without typing the full bundle path. Upstream
# documents no way to fix this, so we symlink it ourselves.
#
# /usr/local/bin because it is on the default macOS PATH and is not Homebrew's
# (brew owns /opt/homebrew on Apple Silicon, and dropping a non-brew symlink in
# its bin would upset brew doctor and risk cleanup removing it). It is also
# where the rest of our own tools go.
#
# The target path is stable across Ghostty's in-place auto-updates.
- name: Check Ghostty.app is present before linking (macOS)
  ansible.builtin.stat:
    path: /Applications/Ghostty.app/Contents/MacOS/ghostty
  register: ghostty_macos_app
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Ensure /usr/local/bin exists (macOS)
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: '0755'
  become: true
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - ghostty_macos_app.stat.exists | default(false)

- name: Put the Ghostty CLI on PATH (macOS)
  ansible.builtin.file:
    src: /Applications/Ghostty.app/Contents/MacOS/ghostty
    dest: /usr/local/bin/ghostty
    state: link
    force: true
  become: true
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - ghostty_macos_app.stat.exists | default(false)

- name: Verify the Ghostty CLI resolves on PATH (macOS)
  ansible.builtin.command:
    cmd: ghostty --version
  register: ghostty_cli_check
  changed_when: false
  failed_when: false
  become: false
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - ghostty_macos_app.stat.exists | default(false)

- name: Warn if the Ghostty CLI is still not reachable (macOS)
  ansible.builtin.debug:
    msg: >-
      Ghostty CLI symlinked to /usr/local/bin/ghostty but `ghostty --version`
      did not run. Check /usr/local/bin is on your PATH.
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - ghostty_macos_app.stat.exists | default(false)
    - ghostty_cli_check.rc | default(1) != 0
