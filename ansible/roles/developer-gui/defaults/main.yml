---
# Developer-GUI role defaults.

# ============================================================================
# Ghostty on Ubuntu -- ppa:mkasberg/ghostty-ubuntu
# ============================================================================
# Launchpad builds the PPA per Ubuntu series, and a new series appears only
# once Launchpad opens it. Oldest first; the last entry is the fallback for a
# series the PPA does not publish yet.
ghostty_ppa_supported_suites:
  - noble
  - resolute
# Launchpad's signing key for the PPA, as its archive API reports it
# (signing_key_fingerprint on ~mkasberg/+archive/ubuntu/ghostty-ubuntu).
ghostty_ppa_signing_fingerprint: 0721FDF5FECB88DC6920361657C8EF455CEAE491  # gitleaks:allow -- public key fingerprint
ghostty_ppa_signing_key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x{{ ghostty_ppa_signing_fingerprint }}"

# ============================================================================
# VSCode privacy + AI-upsell de-nag profile -- OPT-IN (hyperi-io/hyperi-developer#7)
# ============================================================================
# Off by default: this rewrites part of a personal settings.json, so it goes
# on only where someone asked for it. The profile itself (which keys, which
# values) lives entirely in the hyperi-vscode-privacy script -- see
# files/hyperi-vscode-privacy for the tiers and the JSONC-merge design.
vscode_privacy_enabled: false

# Separate from the flag above: flipping vscode_privacy_enabled back to
# false does not retroactively undo a previous apply (this role has no
# fleet-wide tombstone pass for it). Set this true to strip the managed
# block back out of every detected editor's settings.json on the next run.
vscode_privacy_uninstall: false
