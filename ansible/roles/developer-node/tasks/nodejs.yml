---
# JS/TS developer extras -- the layer ON TOP of the core Node runtime.
#
# The runtime itself (node n + n-1, npm, corepack/pnpm, semantic-release) moved
# into the `developer` core role: it is tooling-and-CI infrastructure, needed by
# a Rust or Python developer who would never select a JS tag. What is left here
# is what only a JS/TS developer wants -- the lint and format stack.
#
# Installed with pnpm, matching developer-typescript, so JS tooling has one
# global package manager rather than two.

- name: Install the JS/TS lint and format tooling (eslint, prettier)
  ansible.builtin.command:
    cmd: pnpm install -g eslint prettier
  # pnpm_env is set by the core role -- it carries PNPM_HOME and puts pnpm's
  # global bin on PATH, without which pnpm refuses `install -g` entirely.
  environment: "{{ pnpm_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  register: developer_node_pnpm_lint
  # pnpm prints the same summary either way; the only honest signal that it did
  # anything is the added count, which reads "added 0," on a repeat run.
  # `changed_when: true` here made every run report changed forever.
  changed_when: "'added 0,' not in developer_node_pnpm_lint.stdout"
  failed_when:
    - developer_node_pnpm_lint.rc != 0
    - "'already installed' not in developer_node_pnpm_lint.stderr"
