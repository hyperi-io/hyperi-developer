---
# TypeScript toolchain — installs typescript + tsx + ts-node globally via pnpm.
# Node.js and pnpm come from the core `developer` role now; developer-node is
# still the declared dependency (meta/main.yml) and pulls that role in.

- name: Install TypeScript and runners (typescript, tsx, ts-node)
  ansible.builtin.command:
    cmd: pnpm install -g typescript tsx ts-node
  # Same prerequisite as developer-node: pnpm will not do a global install
  # unless PNPM_HOME is set and its bin directory is on PATH. pnpm_env comes
  # from the core role, which installs pnpm in the first place.
  environment: "{{ pnpm_env }}"
  become: false
  register: pnpm_install_ts
  # See developer-node: pnpm's summary looks the same on a repeat run, so key
  # off the added count rather than reporting changed unconditionally.
  changed_when: "'added 0,' not in pnpm_install_ts.stdout"
  failed_when:
    - pnpm_install_ts.rc != 0
    - "'already installed' not in pnpm_install_ts.stderr"
