---
# Gitleaks - Secret detection tool (blocking gate for `hyperi-ci check`).
#
# Fedora dnf (8.30.0 against upstream 8.30.1), Ubuntu release binary, macOS brew.
#
# Ubuntu universe carries 8.16.0 and freezes for the life of the release, which
# is fourteen minors adrift on a secret scanner.
#
# There is no better Linux channel to move to, and it was looked for. Upstream
# documents only Homebrew, Docker, Go and the release binaries -- they run no
# apt or dnf repo, and there is no snap. Debian sid carries 8.26.0 and trixie
# 8.16.0, which is where Ubuntu's came from; neither is current, and mixing sid
# into Ubuntu is not on. For a secret scanner an unofficial third-party repo is
# a worse trust proposition than the upstream release anyway.
#
# The release carries `gitleaks_<ver>_checksums.txt`, so this fetch can be
# digest-verified when hyperi-ci #66 lands the repo-wide hardening.
#
# The binary was dropped once for 404ing on arm64. The cause was a hardcoded
# `linux_x64`, not the channel: gitleaks names amd64 "x64" and arm64 "arm64", so
# the arch token needs mapping rather than substituting.

# ============================================================================
# MACOS - Install via Homebrew
# ============================================================================

- name: Install Gitleaks (macOS)
  community.general.homebrew:
    name: gitleaks
    state: present
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# FEDORA - dnf (tracks upstream within a release)
# ============================================================================

- name: Install Gitleaks (Fedora)
  block:
    - name: Install Gitleaks via dnf (Fedora)
      ansible.builtin.dnf:
        name: gitleaks
        state: present

  rescue:
    - name: Record that Gitleaks did not install (Fedora)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator playbooks/main.yml post_tasks reports from.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['gitleaks: ' ~ (ansible_failed_result.msg | default('dnf install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - GitHub release binary (Tier 3: hyperi-update re-fetches it)
# ============================================================================

- name: Install Gitleaks (Ubuntu)
  block:
    - name: Get latest Gitleaks version
      ansible.builtin.uri:
        url: https://api.github.com/repos/gitleaks/gitleaks/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: contributor_gitleaks_latest
      check_mode: false

    - name: Resolve the Gitleaks tag
      ansible.builtin.set_fact:
        contributor_gitleaks_ref: "{{ contributor_gitleaks_latest.json.tag_name }}"

    # gitleaks calls amd64 "x64"; arm64 keeps its own name.
    - name: Map the architecture to the Gitleaks asset token
      ansible.builtin.set_fact:
        contributor_gitleaks_arch: "{{ 'arm64' if hyperi_arch_deb == 'arm64' else 'x64' }}"

    - name: Download and extract Gitleaks
      ansible.builtin.unarchive:
        src: >-
          https://github.com/gitleaks/gitleaks/releases/download/{{ contributor_gitleaks_ref | trim }}/gitleaks_{{
          contributor_gitleaks_ref | trim | regex_replace('^v', '') }}_linux_{{ contributor_gitleaks_arch }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: gitleaks
        mode: '0755'
      when: not ansible_check_mode

  rescue:
    - name: Record that Gitleaks did not install (Ubuntu)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator playbooks/main.yml post_tasks reports from.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['gitleaks: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'

# An Ubuntu box provisioned by an older revision carries the universe package,
# and /usr/bin/gitleaks would lose to /usr/local/bin -- but the stale copy stays
# on disk and apt keeps it. Remove it so there is one gitleaks.
- name: Remove the superseded gitleaks apt package (Ubuntu)
  ansible.builtin.apt:
    name: gitleaks
    state: absent
    purge: false
  failed_when: false
  when: ansible_facts['distribution'] == 'Ubuntu'
