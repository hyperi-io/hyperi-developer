---
# act - Run GitHub Actions locally

# ============================================================================
# FEDORA - Install via COPR repository
# ============================================================================

- name: Install act (Fedora)
  block:
    - name: Enable act COPR repository
      ansible.builtin.command:
        cmd: dnf copr enable -y goncalossilva/act
      args:
        creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:goncalossilva:act.repo

    - name: Install act-cli
      ansible.builtin.dnf:
        name: act-cli
        state: present

  rescue:
    - name: Record that act did not install (Fedora)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['act: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - Install via binary from GitHub releases
# ============================================================================
# Tier 3: Ubuntu has no distro/vendor-repo/snap channel for act, so it stays a
# re-fetched GitHub release -- hyperi-update pulls the latest on each run.

- name: Install act (Ubuntu)
  block:
    - name: Resolve the act release
      ansible.builtin.include_role:
        name: github_release
        # The include is already gated by this file's tags, and its tasks carry none.
        apply:
          tags: ['always']
      vars:
        github_release_repo: nektos/act

    # act does NOT use one naming scheme across arches: amd64 is `x86_64`,
    # arm64 is `arm64` (not `aarch64`). So neither shared token fits both, and
    # a substring swap on either would 404. Verified against the real release.
    - name: Determine the act asset architecture
      ansible.builtin.set_fact:
        contributor_act_arch: "{{ 'arm64' if hyperi_arch_deb == 'arm64' else 'x86_64' }}"

    # Straight from the URL, as gitleaks does: unarchive reports a change only
    # when the binary differs, and no root-written file sits at a fixed /tmp path.
    - name: Download and extract act
      ansible.builtin.unarchive:
        src: >-
          https://github.com/nektos/act/releases/download/{{ github_release_doc.tag_name
          }}/act_Linux_{{ contributor_act_arch }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: act
        owner: root
        group: root
        mode: '0755'
      when: not ansible_check_mode

  rescue:
    - name: Record that act did not install (Ubuntu)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['act: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# MACOS - Install via Homebrew
# ============================================================================

- name: Install act (macOS)
  community.general.homebrew:
    name: act
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
