---
# actionlint - static checker for GitHub Actions workflow files.
#
# Linux takes the GitHub release binary (Tier 3) on both distros; brew on macOS.
#
# Not the Ubuntu community snap: it is strictly confined, so it cannot read
# /projects, and `actionlint <workflow>` there exits 3 with "no such file" on a
# file that exists.

# ============================================================================
# MACOS - Install via Homebrew
# ============================================================================

- name: Install actionlint (macOS)
  community.general.homebrew:
    name: actionlint
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# LINUX - GitHub release binary (Tier 3)
# ============================================================================

- name: Install actionlint (Linux)
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  block:
    - name: Get latest actionlint version from GitHub API
      ansible.builtin.uri:
        url: https://api.github.com/repos/rhysd/actionlint/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: contributor_actionlint_release
      check_mode: false

    # Tags carry a leading `v`; the asset name and `-version` output drop it.
    - name: Set actionlint version fact
      ansible.builtin.set_fact:
        contributor_actionlint_version: "{{ contributor_actionlint_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Read the installed actionlint version
      ansible.builtin.command:
        argv: [/usr/local/bin/actionlint, -version]
      register: contributor_actionlint_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # The version match is what skips the download on a current host and what
    # replaces the binary once a new release ships.
    - name: Download and extract actionlint
      ansible.builtin.unarchive:
        src: >-
          https://github.com/rhysd/actionlint/releases/download/{{ contributor_actionlint_release.json.tag_name
          }}/actionlint_{{ contributor_actionlint_version }}_linux_{{ hyperi_arch_deb }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: [actionlint]
        owner: root
        group: root
        mode: '0755'
      when:
        - not ansible_check_mode
        - (contributor_actionlint_installed.stdout_lines | default([''], true) | first) != contributor_actionlint_version

    # Last in the block, so a failed binary install keeps the snap as the only
    # actionlint. failed_when: a host without snapd has nothing to remove.
    - name: Remove the strict-confined actionlint snap (Ubuntu)
      community.general.snap:
        name: actionlint
        state: absent
      failed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

  rescue:
    - name: Record that actionlint did not install
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator reported by playbooks/main.yml post_tasks.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['actionlint: ' ~ (ansible_failed_result.msg | default('download failed'))] }}
