---
# hadolint - Dockerfile linter (blocking gate for `hyperi-ci check`).
#
# Fedora ships it in dnf (OS-swept). Ubuntu has no distro/repo/snap channel, so
# it stays a re-fetched GitHub release (Tier 3 -- hyperi-update pulls the latest
# on each run). brew on macOS.
#
# hadolint's release assets use x86_64/arm64, NOT amd64/aarch64, so neither
# shared arch token fits -- map explicitly like act does.

# ============================================================================
# MACOS - Install via Homebrew
# ============================================================================

- name: Install hadolint (macOS)
  community.general.homebrew:
    name: hadolint
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# FEDORA - dnf package
# ============================================================================

- name: Install hadolint (Fedora)
  block:
    - name: Install hadolint via dnf (Fedora)
      ansible.builtin.dnf:
        name: hadolint
        state: present

  rescue:
    - name: Record that hadolint did not install (Fedora)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator reported by playbooks/main.yml post_tasks.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['hadolint: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - re-fetched GitHub binary (Tier 3)
# ============================================================================

- name: Install hadolint (Ubuntu)
  block:
    - name: Determine the hadolint asset architecture
      ansible.builtin.set_fact:
        contributor_hadolint_arch: "{{ 'arm64' if hyperi_arch_deb == 'arm64' else 'x86_64' }}"

    # Same shape as gitleaks.yml in this role.
    - name: Get latest hadolint version
      ansible.builtin.uri:
        url: https://api.github.com/repos/hadolint/hadolint/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: contributor_hadolint_latest
      check_mode: false

    - name: Resolve the hadolint tag
      ansible.builtin.set_fact:
        contributor_hadolint_ref: "{{ contributor_hadolint_latest.json.tag_name }}"
        contributor_hadolint_asset: "hadolint-linux-{{ contributor_hadolint_arch }}"

    - name: Fetch the hadolint release checksums
      ansible.builtin.uri:
        url: https://github.com/hadolint/hadolint/releases/download/{{ contributor_hadolint_ref }}/checksums.sha256
        return_content: true
      register: contributor_hadolint_sums
      check_mode: false

    # The file marks binary mode with `*` before each name.
    - name: Resolve the hadolint checksum
      ansible.builtin.set_fact:
        contributor_hadolint_sha: >-
          {{ (contributor_hadolint_sums.content.splitlines()
              | select('match', '^[0-9a-f]{64} +[*]?' ~ contributor_hadolint_asset ~ '$')
              | first).split() | first }}

    # Without a checksum get_url keeps whatever already sits at dest, so a new
    # release never landed. The digest comes from the same release, so it detects
    # a change and a truncated download; it is not a provenance check.
    - name: Download hadolint binary (Ubuntu)
      ansible.builtin.get_url:
        url: "https://github.com/hadolint/hadolint/releases/download/{{ contributor_hadolint_ref }}/{{ contributor_hadolint_asset }}"
        dest: /usr/local/bin/hadolint
        checksum: "sha256:{{ contributor_hadolint_sha }}"
        owner: root
        group: root
        mode: '0755'

  rescue:
    - name: Record that hadolint did not install (Ubuntu)
      # noqa: var-naming[no-role-prefix] -- shared accumulator, see note above.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['hadolint: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'
