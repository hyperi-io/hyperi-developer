---
# hadolint - Dockerfile linter (blocking gate for `hyperi-ci check`).
#
# Linux takes upstream's GitHub release binary (Tier 3 -- hyperi-update
# re-fetches it). Ubuntu has no distro/repo/snap channel, and Fedora's dnf
# package trails upstream by several minors, so both distros share this path.
# brew on macOS.
#
# hadolint's release assets use x86_64/arm64, NOT amd64/aarch64, so neither
# shared arch token fits -- map explicitly like act does.

# ============================================================================
# MACOS - Install via Homebrew
# ============================================================================

- name: Install hadolint (macOS)
  community.general.homebrew:
    name: hadolint
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# LINUX - re-fetched GitHub binary (Tier 3)
# ============================================================================

- name: Install hadolint (Linux)
  block:
    - name: Determine the hadolint asset architecture
      ansible.builtin.set_fact:
        contributor_hadolint_arch: "{{ 'arm64' if hyperi_arch_deb == 'arm64' else 'x86_64' }}"

    - name: Resolve the hadolint release
      ansible.builtin.include_role:
        name: github_release
        # The include is already gated by this file's tags, and its tasks carry none.
        apply:
          tags: ['always']
      vars:
        github_release_repo: hadolint/hadolint

    - name: Resolve the hadolint tag
      ansible.builtin.set_fact:
        contributor_hadolint_ref: "{{ github_release_doc.tag_name }}"
        contributor_hadolint_asset: "hadolint-linux-{{ contributor_hadolint_arch }}"

    - name: Fetch the hadolint release checksums
      ansible.builtin.uri:
        url: https://github.com/hadolint/hadolint/releases/download/{{ contributor_hadolint_ref }}/checksums.sha256
        return_content: true
      register: contributor_hadolint_sums
      check_mode: false

    # The file marks binary mode with `*` before each name.
    - name: Resolve the hadolint checksum
      ansible.builtin.set_fact:
        contributor_hadolint_sha: >-
          {{ (contributor_hadolint_sums.content.splitlines()
              | select('match', '^[0-9a-f]{64} +[*]?' ~ contributor_hadolint_asset ~ '$')
              | first).split() | first }}

    # Without a checksum get_url keeps whatever already sits at dest, so a new
    # release never landed. The digest comes from the same release, so it detects
    # a change and a truncated download; it is not a provenance check.
    - name: Download hadolint binary (Linux)
      ansible.builtin.get_url:
        url: "https://github.com/hadolint/hadolint/releases/download/{{ contributor_hadolint_ref }}/{{ contributor_hadolint_asset }}"
        dest: /usr/local/bin/hadolint
        checksum: "sha256:{{ contributor_hadolint_sha }}"
        owner: root
        group: root
        mode: '0755'

    # The dnf package older revisions installed. Inside the block, so it goes
    # only once the binary above is in place to replace it.
    - name: Check for the superseded hadolint package (Fedora)
      ansible.builtin.command:
        argv: [rpm, -q, hadolint]
      register: contributor_hadolint_rpm
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Remove the superseded hadolint package (Fedora)
      ansible.builtin.include_role:
        name: system_cleanup
        tasks_from: purge_packages.yml
        # The include is already gated by this file's tags, and its tasks carry none.
        apply:
          tags: ['always']
      vars:
        system_cleanup_purge_packages: [hadolint]
        system_cleanup_purge_reason: the hadolint package superseded by the release binary
      when:
        - ansible_facts['distribution'] == 'Fedora'
        - contributor_hadolint_rpm.rc == 0

  rescue:
    - name: Record that hadolint did not install (Linux)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator reported by playbooks/main.yml post_tasks.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['hadolint: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
