---
# Binaries in a cargo home that duplicate a managed install, that this role has
# retired, or that a relocated CARGO_HOME left behind in ~/.cargo.
#
# A cargo-installed binary is deregistered with `cargo uninstall --root` before
# anything is deleted: `cargo install-update -a` reinstalls whatever the home's
# install record still lists, so deleting the file alone brings it back with the
# next upstream release. The file itself goes afterwards for a binary cargo has
# no record of, which is what an installer script or a copied directory leaves.
#
# A copy goes only when the copy it duplicates exists and is a different file
# (device and inode after following links), so the only working copy of a tool
# is never the one removed.

- name: Name the cargo homes to sweep
  ansible.builtin.set_fact:
    developer_rust_swept_homes: >-
      {{ [developer_rust_cargo_home]
         + ([user_home ~ '/.cargo'] if developer_rust_cargo_home_stale | default(false) | bool else []) }}

# ============================================================
# Duplicates of a managed install (Linux)
# ============================================================
# sccache is the /usr/local/bin release hyperi-rust-setup installs. uv is the
# astral role's (~/.local/bin on Ubuntu, dnf on Fedora); its old installer
# script put uv and uvx in the cargo home. sd and fnm are crates of tools the
# developer role installs system-wide.
- name: Remove cargo-home copies of managed tools (Linux)
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  vars:
    developer_rust_managed_dupes:
      - {bin: sccache, crate: sccache, managed: [/usr/local/bin/sccache]}
      - {bin: sd, crate: sd, managed: [/usr/local/bin/sd, /usr/bin/sd]}
      - {bin: fnm, crate: fnm, managed: [/usr/local/bin/fnm]}
      - {bin: uv, managed: ["{{ user_home }}/.local/bin/uv", /usr/bin/uv]}
      - {bin: uvx, managed: ["{{ user_home }}/.local/bin/uvx", /usr/bin/uvx]}
    developer_rust_dupe_paths: >-
      {{ (developer_rust_managed_dupes | map(attribute='managed') | flatten)
         + (developer_rust_swept_homes | map('regex_replace', '$', '/bin')
            | product(developer_rust_managed_dupes | map(attribute='bin')) | map('join', '/') | list) }}
    # path -> "device:inode" for every candidate that resolves to a file.
    developer_rust_dupe_ids: >-
      {{ dict(developer_rust_dupe_stat.stdout_lines | default([]) | map('regex_replace', '^\S+ ', '')
              | zip(developer_rust_dupe_stat.stdout_lines | default([]) | map('regex_replace', ' .*$', ''))) }}
  block:
    # Missing paths make stat exit non-zero and drop out of the output.
    - name: Identify the managed tools and their cargo-home copies
      ansible.builtin.command:
        argv: "{{ ['stat', '-L', '--printf', '%d:%i %n\\n', '--'] + developer_rust_dupe_paths }}"
      become: true
      become_user: "{{ actual_user }}"
      register: developer_rust_dupe_stat
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Deregister cargo-home copies of managed tools
      ansible.builtin.command:
        argv: [cargo, uninstall, --root, "{{ item.0 }}", "{{ item.1.crate }}"]
      environment: "{{ cargo_env }}"
      become: true
      become_user: "{{ actual_user }}"
      loop: "{{ developer_rust_swept_homes | product(developer_rust_managed_dupes) | list }}"
      loop_control:
        label: "{{ item.0 }}/bin/{{ item.1.bin }}"
      register: developer_rust_dupe_uninstall
      changed_when: "'Removing' in developer_rust_dupe_uninstall.stderr | default('')"
      # Not registered with cargo: the file removal below takes it.
      failed_when: false
      when:
        - item.1.crate is defined
        - developer_rust_dupe_path in developer_rust_dupe_ids
        - developer_rust_dupe_managed | length > 0
        - developer_rust_dupe_ids[developer_rust_dupe_path] not in developer_rust_dupe_managed
      vars:
        developer_rust_dupe_path: "{{ item.0 }}/bin/{{ item.1.bin }}"
        developer_rust_dupe_managed: >-
          {{ item.1.managed | select('in', developer_rust_dupe_ids)
             | map('extract', developer_rust_dupe_ids) | list }}

    - name: Remove cargo-home copies of managed tools
      ansible.builtin.file:
        path: "{{ item.0 }}/bin/{{ item.1.bin }}"
        state: absent
      become: true
      become_user: "{{ actual_user }}"
      loop: "{{ developer_rust_swept_homes | product(developer_rust_managed_dupes) | list }}"
      loop_control:
        label: "{{ item.0 }}/bin/{{ item.1.bin }}"
      when:
        - developer_rust_dupe_path in developer_rust_dupe_ids
        - developer_rust_dupe_managed | length > 0
        - developer_rust_dupe_ids[developer_rust_dupe_path] not in developer_rust_dupe_managed
      vars:
        developer_rust_dupe_path: "{{ item.0 }}/bin/{{ item.1.bin }}"
        developer_rust_dupe_managed: >-
          {{ item.1.managed | select('in', developer_rust_dupe_ids)
             | map('extract', developer_rust_dupe_ids) | list }}

# ============================================================
# Retired tools
# ============================================================
# Coverage is cargo-llvm-cov. hyperi-ci prefers tarpaulin when both are present,
# so a stale copy keeps Linux on the tool macOS cannot run.
- name: Deregister the superseded cargo-tarpaulin
  ansible.builtin.command:
    argv: [cargo, uninstall, --root, "{{ item }}", cargo-tarpaulin]
    removes: "{{ item }}/bin/cargo-tarpaulin"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  loop: "{{ developer_rust_swept_homes }}"
  register: developer_rust_tarpaulin_uninstall
  changed_when: "'Removing' in developer_rust_tarpaulin_uninstall.stderr | default('')"
  # Not registered with cargo: the file removal below takes it.
  failed_when: false

- name: Remove the superseded cargo-tarpaulin
  ansible.builtin.file:
    path: "{{ item }}/bin/cargo-tarpaulin"
    state: absent
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  loop: "{{ developer_rust_swept_homes }}"

# ============================================================
# What a relocated CARGO_HOME left in ~/.cargo
# ============================================================
# ~/.cargo/bin stays on PATH wherever a profile still names it, so a tool left
# there runs instead of the copy in the effective home, which is the one the
# installs and `cargo install-update` keep current. Only a binary the effective
# home also holds goes. The registry and git caches, the install record and
# anything installed only there stay: they may be the developer's own.
- name: Remove binaries the effective cargo home supersedes
  when: developer_rust_cargo_home_stale | default(false) | bool
  block:
    - name: List the binaries left in ~/.cargo/bin
      ansible.builtin.find:
        paths: "{{ user_home }}/.cargo/bin"
        file_type: any
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      register: developer_rust_stale_bins

    # find reports a link's own inode, so both sides are stat'd through links.
    - name: Identify each ~/.cargo/bin binary and its effective-home namesake
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: true
        get_checksum: false
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      loop: >-
        {{ developer_rust_stale_bins.files | map(attribute='path') | sort
           | map('regex_replace', '^.*/', developer_rust_cargo_home ~ '/bin/') | list
           + (developer_rust_stale_bins.files | map(attribute='path') | sort | list) }}
      register: developer_rust_bin_pairs

    - name: Remove ~/.cargo/bin binaries the effective home also holds
      ansible.builtin.file:
        path: "{{ item.1.item }}"
        state: absent
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      # First half of the stat results is the effective home, second half the stale one.
      loop: >-
        {{ developer_rust_bin_pairs.results[:developer_rust_stale_bins.matched]
           | zip(developer_rust_bin_pairs.results[developer_rust_stale_bins.matched:]) | list }}
      loop_control:
        label: "{{ item.1.item }}"
      when:
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.dev != item.1.stat.dev or item.0.stat.inode != item.1.stat.inode
