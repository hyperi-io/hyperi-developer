---
# Rust toolchain and cargo tools installation
#
# rustup comes from upstream (static.rust-lang.org), pinned by version with a
# SHA256 we hold -- see hyperi_core_versions in group_vars/all.yml. Not a
# `curl | sh`: the binary is fetched by get_url and its checksum is VERIFIED
# before it executes, which is the whole difference the install policy is
# about. And not the distro package either, on either distro:
#
#   Ubuntu's rustup is 1.26.0 and ships NO rustup-init -- only /usr/bin/rustup
#   plus proxies. `rustup default stable` there installs a toolchain but never
#   creates ~/.cargo/bin, so the `creates:` guard below would never match and
#   every later task in this file (which resolves ~/.cargo/bin/rustup) would
#   fail on a path that does not exist.
#
#   Fedora's rustup is current TODAY, but that is a coincidence of timing, not
#   a guarantee -- it freezes on its own schedule like every distro package.
#
# rustup only bootstraps; the toolchain then tracks stable via `rustup update`
# (hyperi-update runs it), so the pin above ages slowly and never gates the
# Rust version a developer actually compiles with.

# ============================================================
# Rust Installation (Linux -- one path for both distros)
# ============================================================

- name: Install Rust via rustup (Linux)
  block:
    - name: Remove distro Rust packages if present (Fedora)
      ansible.builtin.dnf:
        name:
          - rust
          - cargo
          - rustfmt
          - clippy
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Remove distro Rust packages if present (Ubuntu)
      ansible.builtin.apt:
        name:
          - rustc
          - cargo
          - rustfmt
          - rust-clippy
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    # rustup owns its own updates after bootstrap (`rustup update`, which
    # hyperi-update runs), so once ~/.cargo/bin/rustup exists there is nothing
    # to re-bootstrap. Gating the fetch on that keeps the run idempotent --
    # otherwise the download-then-delete pair below reports changed every time.
    - name: Check whether rustup is already installed
      ansible.builtin.stat:
        path: "{{ user_home }}/.cargo/bin/rustup"
      register: developer_rustup_bin

    - name: Bootstrap the Rust toolchain
      when: not developer_rustup_bin.stat.exists
      block:
        # checksum: is the point of this task. A tag or a CDN object can move;
        # a SHA256 we hold cannot be moved by anyone upstream.
        - name: Download rustup-init
          ansible.builtin.get_url:
            url: >-
              https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/{{ hyperi_arch_gnu }}-unknown-linux-gnu/rustup-init
            dest: /tmp/rustup-init
            mode: '0755'
            checksum: "sha256:{{ rustup_sha256 }}"

        # --no-modify-path: this role already manages the ~/.cargo/bin PATH
        # entry in .bashrc below, and letting rustup-init add its own leaves two.
        - name: Install the Rust toolchain via rustup-init
          ansible.builtin.command:
            cmd: /tmp/rustup-init -y --default-toolchain stable --no-modify-path
            creates: "{{ user_home }}/.cargo/bin/rustup"
          become: true
          become_user: "{{ actual_user }}"
          environment:
            CARGO_HOME: "{{ user_home }}/.cargo"
            RUSTUP_HOME: "{{ user_home }}/.rustup"

        - name: Remove the rustup-init download
          ansible.builtin.file:
            path: /tmp/rustup-init
            state: absent

    - name: Install Rust components via rustup
      ansible.builtin.command:
        cmd: "{{ user_home }}/.cargo/bin/rustup component add rustfmt clippy"
      become: true
      become_user: "{{ actual_user }}"
      environment:
        CARGO_HOME: "{{ user_home }}/.cargo"
        RUSTUP_HOME: "{{ user_home }}/.rustup"
      # `component add` already prints "component X is up to date" and no-ops
      # when present, so key changed off that rather than always reporting it.
      register: developer_rustup_components
      # rustup writes its `info: component X is up to date` progress to STDERR,
      # not stdout -- and prints it even on the first run because rustfmt and
      # clippy ship in the default profile. So this task is effectively always
      # "not changed", which is honest: the components are present either way.
      changed_when: "'is up to date' not in developer_rustup_components.stderr"

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Install Rust via Homebrew (macOS)
  community.general.homebrew:
    name:
      - rust
      - rustfmt
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Cargo bin directory setup
# ============================================================

- name: Create cargo bin directory (Linux)
  ansible.builtin.file:
    path: "{{ user_home }}/.cargo/bin"
    state: directory
    mode: '0755'
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Create cargo bin directory (macOS)
  ansible.builtin.file:
    path: "{{ user_home }}/.cargo/bin"
    state: directory
    mode: '0755'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ~/.profile, not ~/.bashrc: bash reads .bashrc only for INTERACTIVE shells, so
# a PATH set there is invisible to `bash -c cargo ...`, to an IDE-spawned build
# and to a systemd user unit. .profile is read once at login and inherited by
# everything the session starts.
#
# The guard is required either way -- an unguarded prepend stacks a copy per
# nested shell -- and it also makes this a no-op on a soe box, where
# /etc/profile.d/dev-path.sh already covers ~/.cargo/bin.
- name: Add cargo bin to PATH in .profile (Linux)
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.profile"
    marker: "# {mark} HYPERI: cargo bin on PATH"
    create: true
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
    mode: '0644'
    block: |
      case ":$PATH:" in
          *":$HOME/.cargo/bin:"*) ;;
          *) export PATH="$HOME/.cargo/bin:$PATH" ;;
      esac
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# The unguarded line this replaces stacked a duplicate per nested shell.
- name: Remove the retired cargo PATH line from .bashrc (Linux)
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    regexp: "^export PATH=.*\\.cargo/bin"
    state: absent
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Add cargo bin to PATH in .zshrc (macOS)
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.zshrc"
    regexp: "^export PATH=.*\\.cargo/bin"
    line: 'export PATH="{{ user_home }}/.cargo/bin:$PATH"'
    state: present
    create: true
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Build dependencies for cargo tools that compile from source
# ============================================================

- name: Install cargo build dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - libssl-dev
      - pkg-config
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install cargo build dependencies (Fedora)
  ansible.builtin.dnf:
    name:
      - openssl-devel
      - pkg-config
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================
# Project build dependencies (gRPC + Kafka)
# ============================================================
# Not for the cargo tools above -- these build the developer's OWN Rust
# services: protoc for prost/tonic (gRPC codegen at build time), and the
# librdkafka headers the rdkafka crate links against. Distro packages, so the
# host's normal updates keep them current.

- name: Install gRPC/Kafka build dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - protobuf-compiler
      - librdkafka-dev
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install gRPC/Kafka build dependencies (Fedora)
  ansible.builtin.dnf:
    name:
      - protobuf-compiler
      - librdkafka-devel
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install gRPC/Kafka build dependencies (macOS)
  community.general.homebrew:
    name:
      - protobuf
      - librdkafka
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Cargo tools installation
# ============================================================

# Tagged rust-cache too: the setup script below runs under this environment,
# and an untagged set_fact leaves it undefined when only the cap tag is selected.
- name: Set cargo environment (Linux)
  ansible.builtin.set_fact:
    cargo_env:
      PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env'].PATH }}"
      CARGO_HOME: "{{ user_home }}/.cargo"
      RUSTUP_HOME: "{{ user_home }}/.rustup"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  tags: ['rust-cache']

- name: Set cargo environment (macOS)
  ansible.builtin.set_fact:
    cargo_env:
      PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:{{ user_home }}/.cargo/bin:{{ ansible_facts['env'].PATH }}"
      CARGO_HOME: "{{ user_home }}/.cargo"
  when: ansible_facts['distribution'] == 'MacOSX'
  tags: ['rust-cache']

# cargo-binstall is installed for the developer to reach for by hand. The tasks
# below deliberately do NOT go through it: binstall fetches a publisher's
# prebuilt binary, where a lockfile has no meaning, and its handling of
# `--locked` on the compile fallback is not something to rely on. These use
# `cargo install --locked`, whose semantics are defined.
- name: Install cargo-binstall (prebuilt cargo tool fetcher)
  ansible.builtin.command:
    cmd: cargo install cargo-binstall --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-binstall"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# --locked on every one of these, and it is not optional. `cargo install`
# IGNORES the crate's published Cargo.lock by default and re-resolves, so
# without it a tool is built against dependency versions its author never
# tested and a semver-compatible upstream release can break one box and not
# the next. These compile from source, so a cold box pays for it once.
- name: Install the cargo tool set
  ansible.builtin.command:
    cmd: "cargo install {{ item.crate }} --locked"
    creates: "{{ user_home }}/.cargo/bin/{{ item.bin }}"
  loop:
    - {crate: bacon, bin: bacon}
    - {crate: cargo-nextest, bin: cargo-nextest}
    - {crate: cargo-deny, bin: cargo-deny}
    # Unused dependencies, the one lens the Rust review practice has no tool for.
    - {crate: cargo-machete, bin: cargo-machete}
    # Breaking API changes, before a library release fans out to its consumers.
    - {crate: cargo-semver-checks, bin: cargo-semver-checks}
  loop_control:
    label: "{{ item.crate }}"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# Coverage is cargo-llvm-cov, not cargo-tarpaulin. tarpaulin is ptrace-based and
# therefore Linux-x86_64 only, which left a macOS developer with no coverage tool
# at all -- hyperi-ci reports "No coverage tool found" and runs the tests bare.
# llvm-cov uses rustc's own source-based instrumentation and works on all three.
- name: Install cargo-llvm-cov (code coverage)
  ansible.builtin.command:
    cmd: cargo install cargo-llvm-cov --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-llvm-cov"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install the llvm-tools component (cargo-llvm-cov dependency)
  ansible.builtin.command:
    cmd: "{{ user_home }}/.cargo/bin/rustup component add llvm-tools-preview"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  environment: "{{ cargo_env }}"
  register: developer_rust_llvm_tools
  changed_when: "'is up to date' not in developer_rust_llvm_tools.stderr"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# hyperi-ci prefers tarpaulin over llvm-cov when both are present, so leaving a
# stale copy behind would keep Linux on the tool macOS cannot run.
- name: Remove the superseded cargo-tarpaulin
  ansible.builtin.command:
    cmd: cargo uninstall cargo-tarpaulin
    removes: "{{ user_home }}/.cargo/bin/cargo-tarpaulin"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install cargo-pgo (profile-guided optimisation)
  ansible.builtin.command:
    cmd: cargo install cargo-pgo --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-pgo"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install cargo-chef (Docker layer caching)
  ansible.builtin.command:
    cmd: cargo install cargo-chef --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-chef"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# cargo-audit + cargo-hack are CI gates (hyperi-ci drives them for Rust):
# cargo-audit scans deps against the RustSec advisory DB, cargo-hack runs the
# feature-matrix build. Same cargo channel + `cargo install-update -a` refresh
# path as the tools above.
- name: Install cargo-audit (RustSec advisory audit)
  ansible.builtin.command:
    cmd: cargo install cargo-audit --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-audit"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install cargo-hack (feature-matrix testing)
  ansible.builtin.command:
    cmd: cargo install cargo-hack --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-hack"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# ============================================================
# cargo-update: allows manual `cargo install-update -a` to
# update all cargo-installed tools to latest versions
# ============================================================

- name: Install cargo-update (for updating cargo tools)
  ansible.builtin.command:
    cmd: cargo install cargo-update --locked
    creates: "{{ user_home }}/.cargo/bin/cargo-install-update"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# ============================================================
# Build acceleration: sccache + mold
# ============================================================
# Delegated to `hyperi-rust-setup`, a standalone script a developer can also
# run by hand -- the same shape as disk-attach. Ansible just calls it.
#
# Everything it does could be inlined here, but then it would only exist for
# people who run the whole playbook. A dev who wants a fast Rust box on a
# machine we do not manage should be able to run one command.

# Tagged rust-cache as well: this script writes the cache caps, so the cap tag
# has to be able to install and run it without a full toolchain converge.
- name: Install the hyperi-rust-setup tool
  ansible.builtin.copy:
    src: hyperi-rust-setup
    dest: /usr/local/bin/hyperi-rust-setup
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu', 'Debian']
  tags: ['rust-cache']

- name: Install the hyperi-rust-setup tool (macOS)
  ansible.builtin.copy:
    src: hyperi-rust-setup
    dest: /usr/local/bin/hyperi-rust-setup
    mode: '0755'
  become: true
  when: ansible_facts['distribution'] == 'MacOSX'
  tags: ['rust-cache']

# --yes because Ansible is the unattended caller; a human running it by hand
# gets the confirmation prompt instead.
- name: Configure the Rust build environment
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/hyperi-rust-setup --yes
      --sccache-size {{ rust_cache_sccache_max }}
      --ccache-size {{ rust_cache_ccache_max }}
      --sccache-basedirs {{ rust_cache_sccache_basedirs | quote }}
      {{ '' if rust_cache_central_build_dir else '--no-build-dir' }}
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  environment: "{{ cargo_env }}"
  register: developer_rust_setup
  changed_when: "'CHANGED' in developer_rust_setup.stdout"
  # An optional build accelerator must never abort the run (see S1.T11).
  failed_when: false
  tags: ['rust-cache']

- name: Report Rust build environment setup
  ansible.builtin.debug:
    msg: "{{ developer_rust_setup.stdout_lines | default(['(no output)']) }}"
  when: developer_rust_setup.rc | default(0) != 0
  tags: ['rust-cache']

# ============================================================
# Build cache caps
# ============================================================
# Separate file because it is the only part with a scheduled component, and it
# is switchable independently of the accelerators above.

- name: Bound the Rust build caches
  ansible.builtin.include_tasks:
    file: cache.yml
    apply:
      tags: ['developer-rust', 'rust', 'rust-cache']
  when: rust_cache_manage | default(true)
  tags: ['developer-rust', 'rust', 'rust-cache']
