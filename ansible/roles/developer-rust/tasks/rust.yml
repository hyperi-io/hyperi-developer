---
# Rust toolchain and cargo tools installation
#
# rustup comes from upstream (static.rust-lang.org), resolved to the current
# rustup-init at install time and checked against the SHA256 published beside
# it. Not a `curl | sh`: the binary is fetched by get_url and its checksum is
# verified before it executes, which is the whole difference the install policy
# is about. And not the distro package either, on either distro:
#
#   Ubuntu's rustup is 1.26.0 and ships NO rustup-init -- only /usr/bin/rustup
#   plus proxies. `rustup default stable` there installs a toolchain but never
#   creates ~/.cargo/bin, so the `creates:` guard below would never match and
#   every later task in this file (which resolves ~/.cargo/bin/rustup) would
#   fail on a path that does not exist.
#
#   Fedora's rustup is current TODAY, but that is a coincidence of timing, not
#   a guarantee -- it freezes on its own schedule like every distro package.
#
# rustup only bootstraps. The toolchain then tracks stable via `rustup update`
# (hyperi-update runs it), so what a developer compiles with is whatever stable
# is on the day, edition 2024 included.

# ============================================================
# Where the toolchain actually lives
# ============================================================
# Everything below addresses cargo through these two facts, never through a
# hard-coded ~/.cargo. Cargo reads $CARGO_HOME/config.toml and rustup reads
# $RUSTUP_HOME, and neither is required to be under the home directory -- a
# box with a dedicated toolchain volume relocates both. Writing to ~/.cargo on
# such a host produces a file the tool silently ignores while a stale one stays
# in effect, which is a failure mode with no error message anywhere in it.
#
# Ask the target user's own login shell, because that is the environment the
# developer's cargo runs in: it sees /etc/environment (via pam_env under
# become), /etc/profile.d and ~/.profile, which is where a relocation is
# declared. Ansible's `ansible_facts['env']` is the CONNECTION user's
# environment -- root under become -- so it cannot answer this.
#
# `${CARGO_HOME:-$HOME/.cargo}` is resolved by that shell, so the fallback uses
# the user's real home and matches hyperi-rust-govern's own resolution.
#
# The sentinel is not decoration: a login shell runs /etc/profile.d and
# ~/.profile first, and anything they print lands on stdout ahead of the answer.
# Selecting on a marker rather than on line 0 is what stops a login banner
# becoming CARGO_HOME.
# One task for every platform. Linux runs it under become as the target user;
# macOS as the connecting user, who is the target there. `timeout` is Linux
# coreutils: a profile that blocks would otherwise hang the converge, and
# `failed_when: false` offers no protection against a hang.
#
# Two sentinel lines rather than one line split on whitespace, so a path with a
# space in it resolves whole instead of silently as its first word. `last`,
# not `first`: the profile runs before the printf, so ours is always last, and
# a profile that prints the sentinel itself cannot win.
- name: Probe the target user's cargo environment
  ansible.builtin.command:
    cmd: >-
      {{ 'zsh' if ansible_facts['distribution'] == 'MacOSX' else 'timeout 30 bash' }}
      -lc 'printf "HYPERI_CARGO_HOME %s\nHYPERI_RUSTUP_HOME %s\n" "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}"'
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  register: developer_rust_env_probe
  changed_when: false
  failed_when: false
  # Must run in check mode too: the facts below are undefined without it, and
  # every later task then templates an empty path.
  check_mode: false
  tags: ['rust-cache', 'rust-governor']

# An explicit role variable, else what the host said, else the upstream default
# so nothing downstream is ever templated blank. Trailing slashes are stripped
# because the retire task below compares this against ~/.cargo as a string, and
# `~/.cargo/` would read as a relocation and rename the live config.
- name: Resolve the effective cargo and rustup homes
  ansible.builtin.set_fact:
    developer_rust_cargo_home: >-
      {{ rust_cargo_home | default(_probed_cargo, true)
         | default(user_home ~ '/.cargo', true) | regex_replace('/+$', '') }}
    developer_rust_rustup_home: >-
      {{ rust_rustup_home | default(_probed_rustup, true)
         | default(user_home ~ '/.rustup', true) | regex_replace('/+$', '') }}
  vars:
    _lines: "{{ developer_rust_env_probe.stdout_lines | default([], true) }}"
    _probed_cargo: >-
      {{ _lines | select('match', '^HYPERI_CARGO_HOME ') | list | last
         | default('') | regex_replace('^\S+ ', '') }}
    _probed_rustup: >-
      {{ _lines | select('match', '^HYPERI_RUSTUP_HOME ') | list | last
         | default('') | regex_replace('^\S+ ', '') }}
  tags: ['rust-cache', 'rust-governor']

# Absolute, and free of the two characters that would break the root-owned
# unit file this value is templated into: `%` is a systemd specifier and `"`
# ends the quoted assignment.
- name: Check the resolved toolchain paths are usable
  ansible.builtin.assert:
    that:
      - developer_rust_cargo_home is match('^/')
      - developer_rust_rustup_home is match('^/')
      - developer_rust_cargo_home is not search('[%"]')
      - developer_rust_rustup_home is not search('[%"]')
    fail_msg: >-
      Resolved CARGO_HOME={{ developer_rust_cargo_home }},
      RUSTUP_HOME={{ developer_rust_rustup_home }} -- not an absolute path, or
      contains % or ". Set rust_cargo_home/rust_rustup_home explicitly.
    quiet: true
  tags: ['rust-cache', 'rust-governor']

- name: Report where the toolchain was resolved to
  ansible.builtin.debug:
    msg: >-
      CARGO_HOME={{ developer_rust_cargo_home }}
      RUSTUP_HOME={{ developer_rust_rustup_home }}
    verbosity: 1
  tags: ['rust-cache', 'rust-governor']

# ============================================================
# Rust Installation (Linux -- one path for both distros)
# ============================================================

- name: Install Rust via rustup (Linux)
  # No rescue: every `cargo install` below needs the toolchain this block
  # bootstraps, so warning past it only moves the abort to a task that reports
  # it as a missing command.
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  block:
    - name: Remove distro Rust packages if present (Fedora)
      ansible.builtin.dnf:
        name:
          - rust
          - cargo
          - rustfmt
          - clippy
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Remove distro Rust packages if present (Ubuntu)
      ansible.builtin.apt:
        name:
          - rustc
          - cargo
          - rustfmt
          - rust-clippy
        state: absent
      become: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    # rustup owns its own updates after bootstrap (`rustup update`, which
    # hyperi-update runs), so once ~/.cargo/bin/rustup exists there is nothing
    # to re-bootstrap. Gating the fetch on that keeps the run idempotent --
    # otherwise the download-then-delete pair below reports changed every time.
    - name: Check whether rustup is already installed
      ansible.builtin.stat:
        path: "{{ developer_rust_cargo_home }}/bin/rustup"
      register: developer_rustup_bin

    - name: Bootstrap the Rust toolchain
      when: not developer_rustup_bin.stat.exists
      block:
        # The checksum is fetched from the same publisher, immediately before
        # the binary, so the download stays verified without holding a version
        # here. The file reads `<sha256> *./rustup-init`.
        - name: Look up the current rustup-init checksum
          ansible.builtin.uri:
            url: >-
              https://static.rust-lang.org/rustup/dist/{{ hyperi_arch_gnu }}-unknown-linux-gnu/rustup-init.sha256
            return_content: true
          register: developer_rustup_sha
          check_mode: false

        - name: Download rustup-init
          ansible.builtin.get_url:
            url: >-
              https://static.rust-lang.org/rustup/dist/{{ hyperi_arch_gnu }}-unknown-linux-gnu/rustup-init
            dest: /tmp/rustup-init
            mode: '0755'
            checksum: "sha256:{{ developer_rustup_sha.content.split() | first }}"

        # --no-modify-path: this role already manages the ~/.cargo/bin PATH
        # entry in .bashrc below, and letting rustup-init add its own leaves two.
        - name: Install the Rust toolchain via rustup-init
          ansible.builtin.command:
            cmd: /tmp/rustup-init -y --default-toolchain stable --no-modify-path
            creates: "{{ developer_rust_cargo_home }}/bin/rustup"
          become: true
          become_user: "{{ actual_user }}"
          environment:
            CARGO_HOME: "{{ developer_rust_cargo_home }}"
            RUSTUP_HOME: "{{ developer_rust_rustup_home }}"

        - name: Remove the rustup-init download
          ansible.builtin.file:
            path: /tmp/rustup-init
            state: absent

    # rustup-init above only runs on a box that has no rustup, so this is what
    # moves an existing toolchain forward and makes a re-run land on current
    # stable. `rustup check` reports without changing anything, and exits
    # non-zero merely because a rustup self-update is offered.
    - name: Check whether the Rust toolchain is current
      ansible.builtin.command:
        cmd: "{{ developer_rust_cargo_home }}/bin/rustup check"
      become: true
      become_user: "{{ actual_user }}"
      environment:
        CARGO_HOME: "{{ developer_rust_cargo_home }}"
        RUSTUP_HOME: "{{ developer_rust_rustup_home }}"
      register: developer_rustup_check
      changed_when: false
      failed_when: false
      check_mode: false

    # Matched on the stable line alone -- `rustup - update available` is rustup
    # offering to replace itself, which `rustup self update` owns, not this.
    #
    # A check that did not run is not the same as a toolchain that is current,
    # so a failed check falls through to attempting the update rather than
    # silently deciding there was nothing to do.
    - name: Update the Rust toolchain to current stable
      ansible.builtin.command:
        cmd: "{{ developer_rust_cargo_home }}/bin/rustup update stable"
      become: true
      become_user: "{{ actual_user }}"
      environment:
        CARGO_HOME: "{{ developer_rust_cargo_home }}"
        RUSTUP_HOME: "{{ developer_rust_rustup_home }}"
      changed_when: true
      when: >-
        developer_rustup_check.rc | default(1) != 0
        or developer_rustup_check.stdout_lines
        | select('search', '^stable-.*update available')
        | list | length > 0

    - name: Install Rust components via rustup
      ansible.builtin.command:
        cmd: "{{ developer_rust_cargo_home }}/bin/rustup component add rustfmt clippy"
      become: true
      become_user: "{{ actual_user }}"
      environment:
        CARGO_HOME: "{{ developer_rust_cargo_home }}"
        RUSTUP_HOME: "{{ developer_rust_rustup_home }}"
      # `component add` already prints "component X is up to date" and no-ops
      # when present, so key changed off that rather than always reporting it.
      register: developer_rustup_components
      # rustup writes its `info: component X is up to date` progress to STDERR,
      # not stdout -- and prints it even on the first run because rustfmt and
      # clippy ship in the default profile. So this task is effectively always
      # "not changed", which is honest: the components are present either way.
      changed_when: "'is up to date' not in developer_rustup_components.stderr"

# brew's rust formula conflicts with rustup and brew refuses the pair, so a
# Mac already on rustup keeps it -- rustup's toolchains carry cargo and
# rustfmt, the same arrangement as the Linux path.
- name: Check for rustup (macOS)
  ansible.builtin.command:
    cmd: zsh -lc 'command -v rustup'
  register: developer_rust_macos_rustup
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install Rust via Homebrew (macOS)
  community.general.homebrew:
    name:
      - rust
      - rustfmt
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - developer_rust_macos_rustup.rc | default(1) != 0

# ============================================================
# Cargo bin directory setup
# ============================================================

# As the user, not as root. The path comes from the user's own environment, and
# every other consumer of it runs as the user -- having root create an arbitrary
# user-supplied directory tree and hand the leaf to that user is a privilege
# boundary this task has no reason to cross.
- name: Create cargo bin directory (Linux)
  ansible.builtin.file:
    path: "{{ developer_rust_cargo_home }}/bin"
    state: directory
    mode: '0755'
  become: true
  become_user: "{{ actual_user }}"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Create cargo bin directory (macOS)
  ansible.builtin.file:
    path: "{{ developer_rust_cargo_home }}/bin"
    state: directory
    mode: '0755'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ~/.profile, not ~/.bashrc: bash reads .bashrc only for INTERACTIVE shells, so
# a PATH set there is invisible to `bash -c cargo ...`, to an IDE-spawned build
# and to a systemd user unit. .profile is read once at login and inherited by
# everything the session starts.
#
# The guard is required either way -- an unguarded prepend stacks a copy per
# nested shell -- and it also makes this a no-op on a soe box, where
# /etc/profile.d/dev-path.sh already covers the cargo bin directory.
#
# `${CARGO_HOME:-$HOME/.cargo}` rather than the resolved path: pam_env has
# already applied /etc/environment by the time .profile runs, so the shell
# knows the answer itself. That keeps the entry correct if the toolchain is
# relocated later without a converge, and it is the same expression
# hyperi-rust-govern resolves the real cargo with.
- name: Add cargo bin to PATH in .profile (Linux)
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.profile"
    marker: "# {mark} HYPERI: cargo bin on PATH"
    create: true
    owner: "{{ actual_user }}"
    group: "{{ actual_user }}"
    mode: '0644'
    block: |
      case ":$PATH:" in
          *":${CARGO_HOME:-$HOME/.cargo}/bin:"*) ;;
          *) export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH" ;;
      esac
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# The unguarded line this replaces stacked a duplicate per nested shell.
- name: Remove the retired cargo PATH line from .bashrc (Linux)
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    regexp: "^export PATH=.*\\.cargo/bin"
    state: absent
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# Same shell-derived form as the Linux .profile block above, for the same
# reason.
#
# The regexp matches the two forms this role has ever written and nothing else.
# It has to match the new line as well as the retired one, or lineinfile appends
# a fresh copy every run -- but a loose `.*cargo.*/bin` also swallows an
# unrelated `export PATH=` line that merely mentions cargo somewhere, replacing
# every other entry on it.
#
# No `mode`: lineinfile applies it to a pre-existing file too, so setting 0644
# would widen a .zshrc the user had deliberately kept at 0600.
- name: Add cargo bin to PATH in .zshrc (macOS)
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.zshrc"
    regexp: '^export PATH="?(\$\{CARGO_HOME:-\$HOME/\.cargo\}|\S*/\.cargo)/bin'
    line: 'export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"'
    state: present
    create: true
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Build dependencies for cargo tools that compile from source
# ============================================================

- name: Install cargo build dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - libssl-dev
      - pkg-config
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install cargo build dependencies (Fedora)
  ansible.builtin.dnf:
    name:
      - openssl-devel
      - pkg-config
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================
# Project build dependencies (gRPC + Kafka)
# ============================================================
# Not for the cargo tools above -- these build the developer's OWN Rust
# services: protoc for prost/tonic (gRPC codegen at build time), and the
# librdkafka headers the rdkafka crate links against. Distro packages, so the
# host's normal updates keep them current.

- name: Install gRPC/Kafka build dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - protobuf-compiler
      - librdkafka-dev
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install gRPC/Kafka build dependencies (Fedora)
  ansible.builtin.dnf:
    name:
      - protobuf-compiler
      - librdkafka-devel
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install gRPC/Kafka build dependencies (macOS)
  community.general.homebrew:
    name:
      - protobuf
      - librdkafka
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================
# Cargo tools installation
# ============================================================

# Tagged rust-cache too: the setup script below runs under this environment,
# and an untagged set_fact leaves it undefined when only the cap tag is selected.
- name: Set cargo environment (Linux)
  ansible.builtin.set_fact:
    cargo_env:
      PATH: "{{ developer_rust_cargo_home }}/bin:{{ ansible_facts['env'].PATH }}"
      CARGO_HOME: "{{ developer_rust_cargo_home }}"
      RUSTUP_HOME: "{{ developer_rust_rustup_home }}"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  tags: ['rust-cache']

# /opt/homebrew/opt/rustup/bin leads: brew's rustup never links its shims
# into /opt/homebrew/bin, so without it no cargo resolves on a rustup Mac.
- name: Set cargo environment (macOS)
  ansible.builtin.set_fact:
    cargo_env:
      PATH: >-
        {{ '/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:'
           ~ developer_rust_cargo_home ~ '/bin:' ~ ansible_facts['env'].PATH }}
      CARGO_HOME: "{{ developer_rust_cargo_home }}"
      # Resolves to ~/.rustup when the host says nothing, which is what rustup
      # would have defaulted to anyway. Carried explicitly so a Mac that
      # relocates it is not the one platform still hard-coded.
      RUSTUP_HOME: "{{ developer_rust_rustup_home }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  tags: ['rust-cache']

# cargo-binstall is installed for the developer to reach for by hand. The tasks
# below deliberately do NOT go through it: binstall fetches a publisher's
# prebuilt binary, where a lockfile has no meaning, and its handling of
# `--locked` on the compile fallback is not something to rely on. These use
# `cargo install --locked`, whose semantics are defined.
- name: Install cargo-binstall (prebuilt cargo tool fetcher)
  ansible.builtin.command:
    cmd: cargo install cargo-binstall --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-binstall"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# --locked on every one of these, and it is not optional. `cargo install`
# IGNORES the crate's published Cargo.lock by default and re-resolves, so
# without it a tool is built against dependency versions its author never
# tested and a semver-compatible upstream release can break one box and not
# the next. These compile from source, so a cold box pays for it once.
#
# cargo-deny carries a pin today, so every other entry falls through to latest.
- name: Install the cargo tool set
  ansible.builtin.command:
    cmd: cargo install {{ item.crate }} --locked
    creates: "{{ developer_rust_cargo_home }}/bin/{{ item.bin }}"
  loop:
    - {crate: bacon, bin: bacon}
    - {crate: cargo-nextest, bin: cargo-nextest}
    - {crate: cargo-deny, bin: cargo-deny}
    # Unused dependencies, the one lens the Rust review practice has no tool for.
    - {crate: cargo-machete, bin: cargo-machete}
    # Breaking API changes, before a library release fans out to its consumers.
    - {crate: cargo-semver-checks, bin: cargo-semver-checks}
  loop_control:
    label: "{{ item.crate }}"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# Coverage is cargo-llvm-cov, not cargo-tarpaulin. tarpaulin is ptrace-based and
# therefore Linux-x86_64 only, which left a macOS developer with no coverage tool
# at all -- hyperi-ci reports "No coverage tool found" and runs the tests bare.
# llvm-cov uses rustc's own source-based instrumentation and works on all three.
- name: Install cargo-llvm-cov (code coverage)
  ansible.builtin.command:
    cmd: cargo install cargo-llvm-cov --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-llvm-cov"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install the llvm-tools component (cargo-llvm-cov dependency)
  ansible.builtin.command:
    cmd: "{{ developer_rust_cargo_home }}/bin/rustup component add llvm-tools-preview"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  environment: "{{ cargo_env }}"
  register: developer_rust_llvm_tools
  changed_when: "'is up to date' not in developer_rust_llvm_tools.stderr"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# hyperi-ci prefers tarpaulin over llvm-cov when both are present, so leaving a
# stale copy behind would keep Linux on the tool macOS cannot run.
- name: Remove the superseded cargo-tarpaulin
  ansible.builtin.command:
    cmd: cargo uninstall cargo-tarpaulin
    removes: "{{ developer_rust_cargo_home }}/bin/cargo-tarpaulin"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install cargo-pgo (profile-guided optimisation)
  ansible.builtin.command:
    cmd: cargo install cargo-pgo --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-pgo"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install cargo-chef (Docker layer caching)
  ansible.builtin.command:
    cmd: cargo install cargo-chef --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-chef"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# cargo-audit + cargo-hack are CI gates (hyperi-ci drives them for Rust):
# cargo-audit scans deps against the RustSec advisory DB, cargo-hack runs the
# feature-matrix build. Same cargo channel + `cargo install-update -a` refresh
# path as the tools above.
- name: Install cargo-audit (RustSec advisory audit)
  ansible.builtin.command:
    cmd: cargo install cargo-audit --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-audit"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

- name: Install cargo-hack (feature-matrix testing)
  ansible.builtin.command:
    cmd: cargo install cargo-hack --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-hack"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# ============================================================
# cargo-update: allows manual `cargo install-update -a` to
# update all cargo-installed tools to latest versions
# ============================================================

- name: Install cargo-update (for updating cargo tools)
  ansible.builtin.command:
    cmd: cargo install cargo-update --locked
    creates: "{{ developer_rust_cargo_home }}/bin/cargo-install-update"
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"

# The installs above are guarded by `creates:`, so on a box that already has a
# tool they never look at its version. This is what carries them forward, and
# it is why re-running the role upgrades rather than only installing.
#
# Listed first so a run with nothing outdated costs one registry poll instead of
# a from-source rebuild sweep. The list prints a `Needs update` column per tool.
- name: Check which cargo tools are outdated
  ansible.builtin.command:
    cmd: cargo install-update --list
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  register: developer_cargo_outdated
  changed_when: false
  failed_when: false
  check_mode: false

# --locked matches how the installs above were done and how hyperi-update
# refreshes them. Without it, install-update rebuilds against freshly resolved
# dependencies rather than the lockfile the author published.
- name: Update the cargo-installed tools to latest
  ansible.builtin.command:
    cmd: cargo install-update --all --locked
  environment: "{{ cargo_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  changed_when: true
  # Same reasoning as the rustup update above: a list that failed to run tells us
  # nothing, and skipping on it would quietly stop upgrading.
  when: >-
    developer_cargo_outdated.rc | default(1) != 0
    or developer_cargo_outdated.stdout_lines
    | select('search', '\s+Yes\s*$')
    | list | length > 0

# ============================================================
# Build acceleration: sccache + mold
# ============================================================
# Delegated to `hyperi-rust-setup`, a standalone script a developer can also
# run by hand -- the same shape as disk-attach. Ansible just calls it.
#
# Everything it does could be inlined here, but then it would only exist for
# people who run the whole playbook. A dev who wants a fast Rust box on a
# machine we do not manage should be able to run one command.

# Tagged rust-cache as well: this script writes the cache caps, so the cap tag
# has to be able to install and run it without a full toolchain converge.
- name: Install the hyperi-rust-setup tool
  ansible.builtin.copy:
    src: hyperi-rust-setup
    dest: /usr/local/bin/hyperi-rust-setup
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu', 'Debian']
  tags: ['rust-cache']

- name: Install the hyperi-rust-setup tool (macOS)
  ansible.builtin.copy:
    src: hyperi-rust-setup
    dest: /usr/local/bin/hyperi-rust-setup
    mode: '0755'
  become: true
  when: ansible_facts['distribution'] == 'MacOSX'
  tags: ['rust-cache']

# --yes because Ansible is the unattended caller; a human running it by hand
# gets the confirmation prompt instead.
- name: Configure the Rust build environment
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/hyperi-rust-setup --yes
      --sccache-size {{ rust_cache_sccache_max }}
      --ccache-size {{ rust_cache_ccache_max }}
      --sccache-basedirs {{ rust_cache_sccache_basedirs | quote }}
      {{ ('--cache-root ' ~ (rust_cache_root | quote)) if rust_cache_root else '' }}
      {{ '' if rust_cache_central_build_dir else '--no-build-dir' }}
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
  # The script looks up the latest sccache release itself, so it needs the token
  # too -- it is the one GitHub caller the uri module's headers cannot cover.
  environment: "{{ cargo_env | combine(hyperi_github_env) }}"
  register: developer_rust_setup
  changed_when: "'CHANGED' in developer_rust_setup.stdout"
  # An optional build accelerator must never abort the run.
  failed_when: false
  tags: ['rust-cache']

- name: Report Rust build environment setup
  ansible.builtin.debug:
    msg: "{{ developer_rust_setup.stdout_lines | default(['(no output)']) }}"
  when: developer_rust_setup.rc | default(0) != 0
  tags: ['rust-cache']

# ============================================================
# Post-condition: the toolchain the converge just left behind works
# ============================================================
# A rustc-wrapper that does not exist breaks EVERY cargo command on the box
# with `No such file or directory`, and nothing upstream of here notices: the
# accelerator is optional and swallows its own failures, the tools all report
# success, and the config that is actually in effect may not even be the one
# this run wrote. That combination produced a workstation where every build had
# been failing since the wrapper's binary moved, through repeated green
# converges.
#
# So this is a post-condition on the file cargo will really read, not a check on
# what we intended to write, and it is fatal. A broken wrapper is not a degraded
# accelerator, it is a toolchain that cannot compile anything.

# BOTH candidate locations are checked, not just the resolved one. Checking
# only where the role wrote would make this self-certifying: a resolution that
# picked the wrong directory would write a good config there, read the same
# good config back, and pass, while cargo went on reading a stale file
# somewhere else. A leftover config in the location that is NOT in effect is
# exactly the trap this whole change exists to close.
- name: Verify no cargo config names an unusable rustc-wrapper
  when: rust_verify_wrapper | default(true) | bool
  tags: ['rust-cache']
  block:
    - name: Read every candidate cargo config
      ansible.builtin.slurp:
        src: "{{ item }}"
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      register: developer_rust_cargo_configs
      # A config that is absent is a legitimate state -- cargo has defaults for
      # everything in it. Only one that NAMES a broken wrapper is a fault.
      failed_when: false
      check_mode: false
      loop: "{{ [developer_rust_cargo_home ~ '/config.toml',
                 user_home ~ '/.cargo/config.toml'] | unique }}"

    # Both TOML quote styles and the dotted-key form, because the file is not
    # always ours -- the whole point is to catch a foreign or stale one.
    # `[^"'\n]` and not `[^"']`: the latter spans newlines, so a config whose
    # value is unterminated swallows the rest of the file and the check then
    # passes on nonsense.
    - name: Extract the rustc-wrapper each config names
      ansible.builtin.set_fact:
        developer_rust_wrappers: >-
          {{ developer_rust_cargo_configs.results
             | selectattr('content', 'defined') | map(attribute='content')
             | map('b64decode') | join('\n')
             | regex_findall('(?m)^[ \t]*(?:build\.)?rustc-wrapper[ \t]*=[ \t]*["\x27]([^"\x27\n]+)["\x27]')
             | unique }}

    # argv, not cmd: the command module shlex-splits a cmd string, so a value
    # like `sccache --flag` would be split and `command -v sccache` would pass
    # while every build failed. Cargo treats the whole value as one program.
    # `-x` on the result, because `command -v` also answers for a builtin or a
    # profile-defined function, neither of which cargo can execute.
    - name: Check that each configured rustc-wrapper resolves
      ansible.builtin.command:
        argv: [bash, -lc, '[ -x "$(command -v -- "$1")" ]', bash, "{{ item }}"]
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      register: developer_rust_wrapper_checks
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ developer_rust_wrappers }}"

    # Renamed, not deleted. It is only reachable if the relocation is ever
    # dropped, at which point cargo silently starts obeying whatever it says --
    # so it is worth neutralising, but not worth destroying a file on a host we
    # do not own. `removes:` makes this a no-op once the file is gone.
    - name: Retire a cargo config superseded by a relocated CARGO_HOME
      ansible.builtin.command:
        argv:
          - mv
          - "{{ user_home }}/.cargo/config.toml"
          - "{{ user_home }}/.cargo/config.toml.superseded"
        removes: "{{ user_home }}/.cargo/config.toml"
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user if ansible_facts['distribution'] != 'MacOSX' else omit }}"
      register: developer_rust_retired
      when:
        - rust_retire_superseded_config | default(true) | bool
        - developer_rust_cargo_home != user_home ~ '/.cargo'

    # Fatal even on the run that just retired the offending file. The toolchain
    # WAS broken, and a converge that repairs it and then says so is the loud
    # failure this check exists to produce; the next run is clean.
    - name: Fail when a cargo config names a rustc-wrapper that does not exist
      ansible.builtin.fail:
        msg: >-
          A cargo config on this host sets rustc-wrapper =
          "{{ developer_rust_wrapper_checks.results
              | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
              | map(attribute='item') | join('", "') }}",
          which does not resolve for {{ actual_user }}. Every cargo command that
          reads it fails with "No such file or directory". The effective
          CARGO_HOME here is {{ developer_rust_cargo_home }}.
          {{ 'The stale ' ~ user_home ~ '/.cargo/config.toml has just been retired to config.toml.superseded -- re-run the converge.'
             if developer_rust_retired is changed
             else 'Check that is where you expect, then re-run /usr/local/bin/hyperi-rust-setup with that CARGO_HOME set.' }}
      when: developer_rust_wrapper_checks.results | default([])
            | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
            | list | length > 0

# ============================================================
# Build cache caps
# ============================================================
# Separate file because it is the only part with a scheduled component, and it
# is switchable independently of the accelerators above.

- name: Bound the Rust build caches
  ansible.builtin.include_tasks:
    file: cache.yml
    apply:
      tags: ['developer-rust', 'rust', 'rust-cache']
  when: rust_cache_manage | default(true)
  tags: ['developer-rust', 'rust', 'rust-cache']

# ============================================================
# sccache server lifecycle
# ============================================================
# Linux only: the unit shape is systemd's. The same lifecycle problem exists on
# macOS and wants a launchd agent, which is not written yet.

# rust-governor is here too: the unit's Slice= line is governor policy, so a
# governor apply must re-render this unit or the slice never captures sccache.
- name: Own the sccache server lifecycle
  ansible.builtin.include_tasks:
    file: sccache_service.yml
    apply:
      tags: ['developer-rust', 'rust', 'rust-cache', 'rust-governor']
  when:
    - rust_sccache_service_manage | default(true)
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu', 'Debian']
  tags: ['developer-rust', 'rust', 'rust-cache', 'rust-governor']
