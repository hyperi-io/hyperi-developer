---
# Developer-Rust Role — Rust toolchain (CLI only, no GUI).

# rust-cache tags only the include itself, never `apply`: a tag under `apply`
# lands on every task in the file, which would make the cap tag pull the whole
# toolchain. The cache include inside rust.yml carries the tag on its own.
# rust-cache, rust-governor and rust-llvm are entry tags only: they open rust.yml
# so the matching includes inside can run, and apply: does not carry them, so
# none of them pulls the whole toolchain.
- name: Install Rust and cargo tools
  ansible.builtin.include_tasks:
    file: rust.yml
    apply:
      tags: ['developer-rust', 'rust']
  tags: ['developer-rust', 'rust', 'rust-cache', 'rust-governor', 'rust-llvm']

# Its own tag so the governor can be applied or re-applied without a full
# toolchain converge, the same bargain rust-cache makes.
- name: Govern rust build resources
  ansible.builtin.include_tasks:
    file: governor.yml
    apply:
      tags: ['developer-rust', 'rust-governor']
  tags: ['developer-rust', 'rust-governor']

# The cgroup for agent sessions, sized in the same RAM budget as the governor's
# rustbuild.slice. Its own tag so it applies without a toolchain converge.
- name: Bound agent sessions
  ansible.builtin.include_tasks:
    file: agents_slice.yml
    apply:
      tags: ['developer-rust', 'agents-slice']
  tags: ['developer-rust', 'agents-slice']

# System scope and off by default, so it stays out of the slice's task file.
- name: Delegate controllers to the user manager
  ansible.builtin.include_tasks:
    file: user_delegate.yml
    apply:
      tags: ['developer-rust', 'agents-delegate']
  tags: ['developer-rust', 'agents-delegate']

# A `--tags removals` run reaches the cargo-home sweep here, since rust.yml is
# not selected by that tag. An install run sweeps from rust.yml instead.
- name: Remove cargo-home strays (opt-in)
  ansible.builtin.include_tasks:
    file: removals.yml
    apply:
      tags: ['removals', 'never']
  tags: ['removals', 'never']
  when:
    - "'removals' in ansible_run_tags"
    - "'developer-rust' not in ansible_run_tags and 'rust' not in ansible_run_tags"
