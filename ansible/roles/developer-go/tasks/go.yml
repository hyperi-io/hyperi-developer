---
# Go toolchain -- installs Go + gopls + dlv.
#
# Linux: the official tarball from go.dev, pinned by version with a SHA256 we
# hold (see hyperi_core_versions in group_vars/all.yml). Go publishes no apt or
# dnf repo, so this is the best rung of the trust ladder available for it.
# macOS: Homebrew, which tracks upstream.
#
# NOT the distro package. Ubuntu 24.04 ships golang-go 1.22, which upstream
# stopped supporting long ago -- Go maintains only the last two majors -- so a
# box provisioned from the distro cannot build against a current toolchain and
# gets no security fixes for the one it has. The old comment here already
# admitted the version "lags" and pointed at the official tarball as the
# fallback; nothing implemented it, so the lag was simply shipped.
#
# Installs to /usr/local/go, the layout go.dev documents and every Go tool
# expects. delve stays a distro package: it is a debugger, not the toolchain,
# and it tracks whatever Go the distro built it against.

- name: Install the Go toolchain (Linux)
  block:
    # `go version` prints e.g. "go version go1.26.5 linux/arm64". If the pinned
    # version is already in place there is nothing to remove or unpack, so the
    # run stays idempotent instead of re-downloading a ~70MB tarball each time.
    - name: Check the installed Go version
      ansible.builtin.command:
        cmd: /usr/local/go/bin/go version
      register: developer_go_installed
      changed_when: false
      failed_when: false

    - name: Note whether the pinned Go is already installed
      ansible.builtin.set_fact:
        go_installed_current: >-
          {{ ('go' ~ go_version ~ ' ') in (developer_go_installed.stdout | default('')) }}

    - name: Download the Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        dest: "/tmp/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        mode: '0644'
        checksum: "sha256:{{ go_sha256 }}"
      when: not go_installed_current

    # Upgrading in place leaves files from the previous toolchain behind --
    # go.dev's own instructions say to remove the old tree first.
    - name: Remove any previous Go toolchain
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
      when: not go_installed_current

    - name: Unpack Go into /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        dest: /usr/local
        remote_src: true
        owner: root
        group: root
      when: not go_installed_current

    - name: Remove the Go tarball download
      ansible.builtin.file:
        path: "/tmp/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        state: absent

    # /etc/profile is re-read by every login shell, so the prepend must test
    # PATH first or it stacks a copy per nested shell, per tmux pane, per `su -`.
    - name: Add the Go toolchain to PATH (system-wide)
      ansible.builtin.copy:
        content: |
          # Managed by hyperi-developer. Go is installed from the upstream
          # tarball into /usr/local/go -- see developer-go/tasks/go.yml.
          case ":$PATH:" in
              *":/usr/local/go/bin:"*) ;;
              *) export PATH="/usr/local/go/bin:$PATH" ;;
          esac
        dest: /etc/profile.d/hyperi-go.sh
        owner: root
        group: root
        mode: '0644'

    - name: Install delve (Fedora)
      ansible.builtin.dnf:
        name: delve
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install delve (Ubuntu)
      ansible.builtin.apt:
        name: delve
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

  become: true
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Install Go (macOS)
  community.general.homebrew:
    name:
      - go
      - delve
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# gopls (Go language server) is installed via go install — needs Go on PATH first.
- name: Install gopls (Go language server)
  ansible.builtin.command:
    cmd: go install golang.org/x/tools/gopls@latest
  environment: "{{ go_bin_env }}"
  become: false
  changed_when: true
  failed_when: false

# ============================================================
# CI-parity linters/scanners (the Go gates hyperi-ci drives).
# ============================================================

# golangci-lint: dnf on Fedora, official snap on Ubuntu, brew on macOS.
#
# Fedora takes dnf because nothing here installs snapd and Fedora does not ship
# it, so the snap was a warning line rather than a tool. dnf trails upstream a
# little (2.11.3 against 2.13.1) -- an installed linter beats a current one that
# is absent.
#
# Ubuntu keeps the snap: it is classic-confined, snapd refreshes it, and it
# tracks upstream exactly. Ubuntu packages golangci-lint nowhere.
- name: Install golangci-lint (macOS)
  community.general.homebrew:
    name: golangci-lint
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install golangci-lint (Fedora)
  block:
    - name: Install golangci-lint via dnf (Fedora)
      ansible.builtin.dnf:
        name: golangci-lint
        state: present

  rescue:
    - name: Record that golangci-lint did not install (Fedora)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator reported by playbooks/main.yml post_tasks.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['golangci-lint: ' ~ (ansible_failed_result.msg | default('dnf install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

- name: Install golangci-lint (Ubuntu — snap)
  block:
    - name: Install golangci-lint via snap (Ubuntu)
      community.general.snap:
        name: golangci-lint
        classic: true
        state: present

  rescue:
    - name: Record that golangci-lint did not install (Ubuntu)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator reported by playbooks/main.yml post_tasks.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['golangci-lint: ' ~ (ansible_failed_result.msg | default('snap install failed'))] }}

  when: ansible_facts['distribution'] == 'Ubuntu'

# A Fedora box provisioned by an older revision carries the snap alongside the
# dnf package, and the snap's /snap/bin can win on PATH.
- name: Remove the golangci-lint snap (Fedora — superseded by dnf)
  community.general.snap:
    name: golangci-lint
    state: absent
  failed_when: false
  when: ansible_facts['distribution'] == 'Fedora'

# gosec: Fedora dnf (OS-swept), Ubuntu go install (no distro package), brew macOS.
- name: Install gosec (macOS)
  community.general.homebrew:
    name: gosec
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install gosec (Fedora)
  block:
    - name: Install gosec via dnf (Fedora)
      ansible.builtin.dnf:
        name: gosec
        state: present

  rescue:
    - name: Record that gosec did not install (Fedora)
      # noqa: var-naming[no-role-prefix] -- shared accumulator, see note above.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['gosec: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

- name: Install gosec (Ubuntu — go install)
  ansible.builtin.command:
    cmd: go install github.com/securego/gosec/v2/cmd/gosec@latest
  environment: "{{ go_bin_env }}"
  become: false
  changed_when: true
  failed_when: false
  when: ansible_facts['distribution'] == 'Ubuntu'

# govulncheck: go install on Linux, brew on macOS.
- name: Install govulncheck (macOS)
  community.general.homebrew:
    name: govulncheck
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install govulncheck (Linux — go install)
  ansible.builtin.command:
    cmd: go install golang.org/x/vuln/cmd/govulncheck@latest
  environment: "{{ go_bin_env }}"
  become: false
  changed_when: true
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
