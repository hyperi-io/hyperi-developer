---
# Go toolchain -- installs Go + gopls + dlv.
#
# Linux: the official tarball from go.dev, resolved to the current stable
# release at install time and verified against the SHA256 go.dev publishes with
# it. Go offers no apt or dnf repo, so this is the best rung of the trust
# ladder available for it. macOS: Homebrew, which tracks upstream.
#
# NOT the distro package. Ubuntu 24.04 ships golang-go 1.22, which upstream
# stopped supporting long ago -- Go maintains only the last two majors -- so a
# box provisioned from the distro cannot build against a current toolchain and
# gets no security fixes for the one it has.
#
# Installs to /usr/local/go, the layout go.dev documents and every Go tool
# expects. delve stays a distro package: it is a debugger, not the toolchain,
# and it tracks whatever Go the distro built it against.

- name: Install the Go toolchain (Linux)
  block:
    # go.dev serves the current stable releases newest-first, each with a
    # SHA256 per file. Taking both from the same response is what keeps the
    # download verified while the version is resolved at install time.
    - name: Look up the current Go release
      ansible.builtin.uri:
        url: https://go.dev/dl/?mode=json
        return_content: true
      register: developer_go_releases
      check_mode: false

    - name: Select the Go version and its checksum
      ansible.builtin.set_fact:
        go_version: "{{ developer_go_release.version | regex_replace('^go', '') }}"
        go_sha256: >-
          {{ (developer_go_release.files
              | selectattr('os', 'equalto', 'linux')
              | selectattr('arch', 'equalto', hyperi_arch_deb)
              | selectattr('kind', 'equalto', 'archive')
              | first).sha256 }}
      vars:
        developer_go_release: "{{ developer_go_releases.json | first }}"

    # `go version` prints e.g. "go version go1.26.5 linux/arm64". If the
    # current version is already in place there is nothing to remove or unpack,
    # so the run stays idempotent instead of re-downloading a ~70MB tarball.
    - name: Check the installed Go version
      ansible.builtin.command:
        cmd: /usr/local/go/bin/go version
      register: developer_go_installed
      changed_when: false
      failed_when: false

    - name: Note whether the current Go is already installed
      ansible.builtin.set_fact:
        go_installed_current: >-
          {{ ('go' ~ go_version ~ ' ') in (developer_go_installed.stdout | default('')) }}

    - name: Download the Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        dest: "/tmp/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        mode: '0644'
        checksum: "sha256:{{ go_sha256 }}"
      when: not go_installed_current

    # Upgrading in place leaves files from the previous toolchain behind --
    # go.dev's own instructions say to remove the old tree first.
    - name: Remove any previous Go toolchain
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
      when: not go_installed_current

    # Check mode does not perform the download above, so the source would be
    # missing and this would fail the run rather than preview it.
    - name: Unpack Go into /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        dest: /usr/local
        remote_src: true
        owner: root
        group: root
      when:
        - not go_installed_current
        - not ansible_check_mode

    - name: Remove the Go tarball download
      ansible.builtin.file:
        path: "/tmp/go{{ go_version }}.linux-{{ hyperi_arch_deb }}.tar.gz"
        state: absent

    # /etc/profile is re-read by every login shell, so each entry must test
    # PATH first or it stacks a copy per nested shell, per tmux pane, per `su -`.
    # ~/go/bin is appended, not prepended, so a go-installed copy never shadows
    # a packaged tool of the same name.
    - name: Add the Go toolchain to PATH (system-wide)
      ansible.builtin.copy:
        content: |
          # Managed by hyperi-developer. Go is installed from the upstream
          # tarball into /usr/local/go -- see developer-go/tasks/go.yml.
          case ":$PATH:" in
              *":/usr/local/go/bin:"*) ;;
              *) export PATH="/usr/local/go/bin:$PATH" ;;
          esac
          # gopls, govulncheck, gosec and flarectl are go-installed here.
          case ":$PATH:" in
              *":$HOME/go/bin:"*) ;;
              *) export PATH="$PATH:$HOME/go/bin" ;;
          esac
        dest: /etc/profile.d/hyperi-go.sh
        owner: root
        group: root
        mode: '0644'

    # The profile drop-in reaches login shells only. systemd units and any
    # shell started on the default PATH find go through these links.
    - name: Check for go and gofmt in /usr/local/bin
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
        follow: false
      loop: [go, gofmt]
      register: developer_go_bin_links

    - name: Check whether those links resolve
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
        follow: true
      loop: [go, gofmt]
      register: developer_go_bin_targets

    # Only a missing entry, a dangling link, or a link already into
    # /usr/local/go is this role's to point at the toolchain.
    - name: Link go and gofmt into /usr/local/bin
      ansible.builtin.file:
        src: "/usr/local/go/bin/{{ item.0.item }}"
        dest: "/usr/local/bin/{{ item.0.item }}"
        state: link
        force: true
      loop: "{{ developer_go_bin_links.results | zip(developer_go_bin_targets.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when: >-
        not item.0.stat.exists
        or (item.0.stat.islnk
            and (not item.1.stat.exists or item.0.stat.lnk_target is match('^/usr/local/go/')))

    # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
    # accumulator the playbook reports at the end of the run.
    - name: Report go and gofmt paths held by something else
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ (deploy_warnings | default([])
              + ['Go toolchain: /usr/local/bin/' ~ item.0.item ~ ' is not a link this role'
                 ~ ' manages, so it was left alone and does not point at /usr/local/go.']) | unique }}
      loop: "{{ developer_go_bin_links.results | zip(developer_go_bin_targets.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when:
        - item.0.stat.exists
        - not item.0.stat.islnk
          or (item.1.stat.exists and item.0.stat.lnk_target is not match('^/usr/local/go/'))

    - name: Install delve (Fedora)
      ansible.builtin.dnf:
        name: delve
        state: present
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Install delve (Ubuntu)
      ansible.builtin.apt:
        name: delve
        state: present
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

  become: true
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Install Go (macOS)
  community.general.homebrew:
    name:
      - go
      - delve
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# gopls (Go language server) is installed via go install — needs Go on PATH first.
- name: Install gopls (Go language server)
  ansible.builtin.command:
    cmd: go install golang.org/x/tools/gopls@latest
  environment: "{{ go_bin_env }}"
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  changed_when: true
  failed_when: false

# ============================================================
# CI-parity linters/scanners (the Go gates hyperi-ci drives).
# ============================================================

# golangci-lint: GitHub release binary on Linux (Tier 3), brew on macOS.
#
# The release binary is the current one: Fedora's dnf package trails two minors
# behind upstream, and the snap cannot install on Fedora at all because nothing
# here installs snapd. A linter behind the Go toolchain cannot read the newer
# stdlib, so trailing is a real failure rather than a cosmetic one.
#
# The asset drops the leading v (v2.13.1 -> golangci-lint-2.13.1-linux-amd64)
# and nests the binary one directory deep.
- name: Install golangci-lint (macOS)
  community.general.homebrew:
    name: golangci-lint
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install golangci-lint (Linux)
  block:
    - name: Get latest golangci-lint version
      ansible.builtin.uri:
        url: https://api.github.com/repos/golangci/golangci-lint/releases/latest
        return_content: true
        headers: "{{ hyperi_github_headers }}"
      register: golangci_latest
      check_mode: false

    - name: Resolve the golangci-lint tag
      ansible.builtin.set_fact:
        golangci_ref: "{{ golangci_latest.json.tag_name }}"

    - name: Download and extract golangci-lint
      ansible.builtin.unarchive:
        src: >-
          https://github.com/golangci/golangci-lint/releases/download/{{ golangci_ref | trim }}/golangci-lint-{{
          golangci_ref | trim | regex_replace('^v', '') }}-linux-{{ hyperi_arch_deb }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --strip-components=1
          - --wildcards
          - "*/golangci-lint"
        mode: '0755'
      when: not ansible_check_mode

  rescue:
    - name: Record that golangci-lint did not install (Linux)
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # accumulator reported by playbooks/main.yml post_tasks.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['golangci-lint: ' ~ (ansible_failed_result.msg | default('download failed'))] }}

  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# The snap shipped on both distros before this. /snap/bin can win on PATH over
# /usr/local/bin, so leaving it turns the upgrade into a silent no-op.
- name: Remove the golangci-lint snap (Linux — superseded by the release binary)
  community.general.snap:
    name: golangci-lint
    state: absent
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# gosec: Fedora dnf (OS-swept), Ubuntu go install (no distro package), brew macOS.
- name: Install gosec (macOS)
  community.general.homebrew:
    name: gosec
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Install gosec (Fedora)
  block:
    - name: Install gosec via dnf (Fedora)
      ansible.builtin.dnf:
        name: gosec
        state: present

  rescue:
    - name: Record that gosec did not install (Fedora)
      # noqa: var-naming[no-role-prefix] -- shared accumulator, see note above.
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['gosec: ' ~ (ansible_failed_result.msg | default('install failed'))] }}

  when: ansible_facts['distribution'] == 'Fedora'

- name: Install gosec (Ubuntu — go install)
  ansible.builtin.command:
    cmd: go install github.com/securego/gosec/v2/cmd/gosec@latest
  environment: "{{ go_bin_env }}"
  become: true
  become_user: "{{ actual_user }}"
  changed_when: true
  failed_when: false
  when: ansible_facts['distribution'] == 'Ubuntu'

# govulncheck: go install on Linux, brew on macOS.
- name: Install govulncheck (macOS)
  community.general.homebrew:
    name: govulncheck
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# Earlier revisions of hyperi-update ran `go install` for govulncheck on macOS
# as well, leaving a ~/go/bin copy that nothing refreshes and that can win on
# PATH over brew's. It goes only once brew's copy resolves.
- name: Read the Homebrew prefix (macOS)
  ansible.builtin.command:
    argv: [brew, --prefix]
  become: false
  environment: "{{ homebrew_env }}"
  register: developer_go_brew_prefix
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Look for the Homebrew govulncheck (macOS)
  ansible.builtin.stat:
    path: "{{ developer_go_brew_prefix.stdout | trim }}/bin/govulncheck"
    follow: true
  become: false
  register: developer_go_brew_govulncheck
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - developer_go_brew_prefix.rc | default(1) == 0

- name: Remove the go-installed govulncheck superseded by brew (macOS)
  ansible.builtin.file:
    path: "{{ user_home }}/go/bin/govulncheck"
    state: absent
  become: false
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - developer_go_brew_govulncheck.stat.exists | default(false)

- name: Install govulncheck (Linux — go install)
  ansible.builtin.command:
    cmd: go install golang.org/x/vuln/cmd/govulncheck@latest
  environment: "{{ go_bin_env }}"
  become: true
  become_user: "{{ actual_user }}"
  changed_when: true
  failed_when: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
