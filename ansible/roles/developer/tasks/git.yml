---
# Git and version control tools installation

# ============================================================================
# FEDORA - Git from base repos (Fedora 42+ has recent git)
# ============================================================================

- name: Install latest Git (Fedora)
  ansible.builtin.dnf:
    name:
      - git
      - git-lfs
      - git-filter-repo
    state: latest
  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - Latest Git from PPA
# ============================================================================
# The PPA's InRelease carries two signatures: Launchpad's RSA-4096 PPA key
# (git_ppa_signing_fingerprint) and a legacy RSA-1024 key that Ubuntu 25.04+
# rejects. Only the RSA-4096 key is trusted, and only once its fingerprint
# matches the one pinned in defaults, so a failed or substituted key download
# stops the run instead of writing an empty or foreign keyring.

- name: Install latest Git via PPA (Ubuntu)
  block:
    # A minimal Ubuntu ships neither: gpg reads the key fingerprint below, and
    # hyperi-update shells out to curl.
    - name: Ensure gpg and curl are present
      ansible.builtin.apt:
        name:
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Downloaded under a name no apt source trusts and copied to the trusted path
    # only once its fingerprint matches.
    - name: Download the git-core PPA signing key
      ansible.builtin.get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x{{ git_ppa_signing_fingerprint }}"
        dest: /etc/apt/keyrings/git-core-ppa.asc.unverified
        mode: '0644'
        force: true

    - name: Read the git-core PPA signing key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, /etc/apt/keyrings/git-core-ppa.asc.unverified]
      register: developer_git_ppa_key
      changed_when: false
      check_mode: false

    - name: Verify the git-core PPA signing key fingerprint
      ansible.builtin.assert:
        that: developer_git_ppa_key_fpr == git_ppa_signing_fingerprint
        fail_msg: >-
          git-core PPA key fingerprint {{ developer_git_ppa_key_fpr or 'missing' }}
          does not match {{ git_ppa_signing_fingerprint }}
        quiet: true
      vars:
        developer_git_ppa_key_fpr: >-
          {{ (developer_git_ppa_key.stdout_lines | select('match', '^fpr:')
              | first | default('')).split(':')[9] | default('') }}

    - name: Install the verified git-core PPA signing key
      ansible.builtin.copy:
        src: /etc/apt/keyrings/git-core-ppa.asc.unverified
        dest: /etc/apt/keyrings/git-core-ppa.asc
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    # Use the running release when the PPA publishes it, else the newest series
    # it does publish -- see git_ppa_supported_suites.
    - name: Determine git-core PPA codename
      ansible.builtin.set_fact:
        git_ppa_codename: >-
          {{ ansible_facts['distribution_release']
             if ansible_facts['distribution_release'] in git_ppa_supported_suites
             else git_ppa_supported_suites | last }}

    # http, not https, on purpose. Launchpad publishes AAAA records, and on a
    # network with half-working IPv6 the TLS connection hangs rather than
    # falling back; plain http has been reliable where https was not. apt does
    # not need the transport for integrity -- signed_by above verifies the
    # signature on what arrives, whatever carried it. The cost is that an
    # on-path observer can see which packages we pull.
    # Worth revisiting: Acquire::ForceIPv4 would keep https and fix the same
    # root cause, but it is untested here.
    # A host provisioned by an older revision carries the .list beside the
    # .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy git-core PPA .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/git-core-ppa.list
        state: absent

    - name: Add git-core PPA repository
      ansible.builtin.deb822_repository:
        name: git-core-ppa
        types: deb
        uris: "http://ppa.launchpadcontent.net/git-core/ppa/ubuntu"
        suites: "{{ git_ppa_codename }}"
        components: main
        signed_by: /etc/apt/keyrings/git-core-ppa.asc
        state: present

    # The binary keyring an older revision wrote with both keys in it. Removed
    # only once the repository names the .asc, so apt never points at a missing
    # key.
    - name: Remove the superseded git-core PPA keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings/git-core-ppa.gpg
        state: absent

    - name: Install Git and Git LFS (from PPA)
      ansible.builtin.apt:
        name:
          - git
          - git-lfs
          - git-filter-repo
        state: latest
        update_cache: true

  # No rescue: this block holds the ONLY Ubuntu install of git, git-lfs and
  # git-filter-repo, so warning past it would report a successful run on a host
  # that has no git at all.
  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# macOS - Latest Git from Homebrew
# ============================================================================

- name: Install latest Git (macOS)
  community.general.homebrew:
    name:
      - git
      - git-lfs
      - git-filter-repo
    state: latest
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# GITHUB CLI (all platforms)
# ============================================================================

# gh comes from GitHub's own signed repo on both distros, not the distro
# package. Ubuntu 24.04 ships 2.45.0 against upstream's 2.96.0 -- 51 minors of
# `gh` behind, on the tool our whole workflow drives. Fedora's 2.87.3 is close
# today, but it freezes on its own schedule, so both distros use the repo
# rather than only the one that hurts right now.

- name: Configure the GitHub CLI repository (Fedora)
  block:
    - name: Add the GitHub CLI repository (Fedora)
      ansible.builtin.yum_repository:
        name: gh-cli
        description: GitHub CLI
        baseurl: "{{ gh_rpm_repo_url }}"
        gpgcheck: true
        gpgkey: "{{ gh_rpm_gpg_url }}"
        enabled: true

    - name: Install the GitHub CLI (Fedora)
      ansible.builtin.dnf:
        name: gh
        state: present

  rescue:
    - name: Record that the GitHub CLI did not install (Fedora)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['GitHub CLI: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))] }}

  become: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: Configure the GitHub CLI repository (Ubuntu)
  block:
    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add the GitHub CLI GPG key
      ansible.builtin.get_url:
        url: "{{ gh_deb_gpg_url }}"
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: '0644'

    - name: Remove the legacy GitHub CLI .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/github-cli.list
        state: absent

    - name: Add the GitHub CLI repository
      ansible.builtin.deb822_repository:
        name: github-cli
        types: deb
        uris: "{{ gh_deb_repo_url }}"
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        architectures: "{{ hyperi_arch_deb | default('amd64') }}"
        state: present

    - name: Install the GitHub CLI (Ubuntu)
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: true

  rescue:
    - name: Record that the GitHub CLI did not install (Ubuntu)
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['GitHub CLI: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('no message'))] }}

  become: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install GitHub CLI (macOS)
  community.general.homebrew:
    name: gh
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# CONFIGURE GIT LFS (all platforms, user-level)
# ============================================================================

# Writes the filter clauses into the running user's own ~/.gitconfig, so it has
# to run as the desktop user rather than whoever the play connected as.
- name: Install Git LFS hooks
  ansible.builtin.command: git lfs install
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  changed_when: false
  failed_when: false
