---
# Tombstones — things this project used to install and no longer does.
#
# WHY THIS FILE EXISTS
# Ansible is convergent, not declarative-with-pruning. It enforces what you
# DECLARE and has no concept of "this used to be declared, so remove it".
# Puppet has `purge`; OpenTofu can do it because it keeps state; Ansible has
# neither. So deleting an install task leaves the tool on every existing host
# forever. The only way to express "should not exist" is to say so.
#
# WHY NOT A PURGE
# `package_facts` could enumerate everything installed and remove whatever we
# do not declare. We deliberately do not: on a developer workstation
# UNDECLARED STATE IS THE POINT — people install their own tools, and a purge
# would delete their work. This is a denylist of what WE removed, never an
# allowlist of what is permitted.
#
# RULES FOR ADDING HERE
#   - When you drop an install, ADD the removal. Same commit.
#   - Say WHY it was dropped, so a future reader can retire the tombstone.
#   - Never fail the run: a host that never had the thing is the common case.
#   - Removals are the destructive part of this playbook. Preview with
#     --check --diff.
#
# RETIRING TOMBSTONES
# Once no host in the field is old enough to carry an artefact, delete its
# tombstone. Track that by the version stamp, not by memory.

# Own load: a tags-scoped run can reach this file before init's include_vars,
# and homebrew_cask_env undefined aborts every macOS tombstone below.
- name: Load macOS variables
  ansible.builtin.include_vars: macos.yml
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# SHADOWING — a stale user-level copy that wins on PATH over the system one.
# The worst class: the host LOOKS fine (the command runs, plausible version)
# but no system update will ever touch that copy again.
# ============================================================================

# uv is now repo-installed (dnf on Fedora, brew on macOS) or user-owned in
# ~/.local/bin (Ubuntu). Older versions of this project dropped a root-owned
# binary in /usr/local/bin and/or a per-user copy in ~/.cargo/bin. Either will
# win on PATH over the new install and NOTHING will ever update it.
#
# This is not hypothetical: verified on a real long-lived host 2026-07-17 --
# /usr/local/bin/uv was 0.10.2, root-owned, dated Feb 11, while current is
# 0.11.29. Five months stale, and `which uv` resolved to it, so the host
# looked fine.
# uv AND its uvx sibling both land in /usr/local/bin (verified on the reference workstation:
# both root-owned, dated Feb 11, five months stale) -- remove the pair.
- name: Remove the retired root-owned uv/uvx binaries (no update path; shadow the repo install)
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - uv
    - uvx
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# Every platform, Ubuntu included. Ubuntu's documented exception is that uv is
# user-owned in ~/.local/bin there -- ~/.cargo/bin is a retired location on all
# three, and it sits AHEAD of ~/.local/bin on PATH, so a copy left there
# shadows the real install.
#
# Runs as the owner of that home, not as whoever connected. Under `become:
# false` on a machine where they differ, the file module cannot read the path
# and reports "Insufficient permissions ... Treating as absent" -- a green
# tombstone over a binary that is still there and still shadowing.
- name: Remove the retired user-level uv/uvx (superseded by the current install)
  ansible.builtin.file:
    path: "{{ user_home }}/.cargo/bin/{{ item }}"
    state: absent
  loop:
    - uv
    - uvx
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"

# Hand-installed copies of tools the roles install system-wide. ~/.local/bin and
# ~/go/bin precede /usr/local/bin and /usr/bin on PATH, so a copy left there
# shadows the managed install and no update ever reaches it.
#
# A copy goes only when the system copy exists and is a different file (device
# and inode after following links): a user-level link to the managed binary is
# not a duplicate, and with no system copy the user's is the only one. Only the
# user-level path is removed, never what a link points at. Cargo homes are left
# to developer-rust, which knows the effective CARGO_HOME and deregisters a
# cargo-installed copy so `cargo install-update` does not bring it back.
#
# Linux only: a Mac's ~/.local/bin is the developer's own, and brew owns the
# system copies there.
#
# `local` names the distros where the managed copy is the /usr/local/bin
# binary; a distro package of the same tool there is a duplicate (below).
- name: Remove hand-installed duplicates of role-managed tools (Linux)
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  vars:
    developer_managed_tools:
      - {bin: kind, local: [Fedora, Ubuntu]}
      - {bin: argocd, local: [Fedora, Ubuntu]}
      - {bin: dive, local: [Fedora, Ubuntu]}
      - {bin: kubeconform, local: [Fedora, Ubuntu]}
      - {bin: kube-linter, local: [Fedora, Ubuntu]}
      - {bin: k9s, local: [Ubuntu]}
      - {bin: kustomize, local: [Ubuntu]}
      - {bin: kubectx, local: [Fedora]}
      - {bin: kubens, local: [Fedora]}
      - {bin: yq, local: [Ubuntu]}
      - {bin: gron, local: [Fedora]}
      - {bin: sd, local: [Fedora]}
      - {bin: lazygit, local: [Fedora, Ubuntu]}
      - {bin: fnm, local: [Fedora, Ubuntu]}
      - {bin: terraform-docs, local: [Fedora, Ubuntu]}
      - {bin: aws-vault, local: [Fedora, Ubuntu]}
      - {bin: golangci-lint, local: [Fedora, Ubuntu]}
      - {bin: actionlint, local: [Fedora, Ubuntu]}
      - {bin: hadolint, local: [Ubuntu]}
      - {bin: gitleaks, local: [Ubuntu]}
      - {bin: act, local: [Ubuntu]}
      - {bin: osv-scanner, local: [Fedora, Ubuntu]}
      - {bin: git-scrub, local: [Fedora, Ubuntu]}
      - {bin: macbash, local: [Fedora, Ubuntu]}
      - {bin: tea, local: [Fedora, Ubuntu]}
      - {bin: sccache, local: [Fedora, Ubuntu]}
      # Vendor-repository packages: the managed copy is /usr/bin.
      - {bin: kubectl, local: []}
      - {bin: helm, local: []}
      - {bin: rpk, local: []}
      - {bin: tofu, local: []}
      - {bin: bao, local: []}
    developer_user_bin_dirs:
      - "{{ user_home }}/.local/bin"
      - "{{ user_home }}/go/bin"
    developer_tool_names: "{{ developer_managed_tools | map(attribute='bin') | list }}"
    developer_tool_paths: >-
      {{ (['/usr/local/bin', '/usr/bin'] + developer_user_bin_dirs)
         | product(developer_tool_names) | map('join', '/') | list }}
    # path -> "device:inode" for every candidate that resolves to a file.
    developer_tool_ids: >-
      {{ dict(developer_tool_stat.stdout_lines | default([]) | map('regex_replace', '^\S+ ', '')
              | zip(developer_tool_stat.stdout_lines | default([]) | map('regex_replace', ' .*$', ''))) }}
  block:
    # One stat for every candidate. Missing paths make stat exit non-zero and
    # simply drop out of the output.
    - name: Identify the files behind role-managed tools and their user-level copies
      ansible.builtin.command:
        argv: "{{ ['stat', '-L', '--printf', '%d:%i %n\\n', '--'] + developer_tool_paths }}"
      become: true
      become_user: "{{ actual_user }}"
      register: developer_tool_stat
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remove user-level copies that shadow a role-managed tool
      ansible.builtin.file:
        path: "{{ item.0 }}/{{ item.1 }}"
        state: absent
      become: true
      become_user: "{{ actual_user }}"
      loop: "{{ developer_user_bin_dirs | product(developer_tool_names) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}"
      when:
        - (item.0 ~ '/' ~ item.1) in developer_tool_ids
        - developer_tool_system_id | length > 0
        - developer_tool_ids[item.0 ~ '/' ~ item.1] != developer_tool_system_id
      vars:
        developer_tool_system_id: >-
          {{ ((['/usr/local/bin/' ~ item.1, '/usr/bin/' ~ item.1] | select('in', developer_tool_ids)
              | map('extract', developer_tool_ids) | list) + [''])[0] }}

    # Where the managed copy is the /usr/local/bin binary, a package that also
    # ships /usr/bin/<bin> is a .deb or .rpm installed by hand beside it. The
    # /usr/local/bin copy has to resolve under /usr/local, so purging the
    # package cannot take the file it points at.
    - name: Resolve the /usr/local/bin copies that have a /usr/bin twin
      ansible.builtin.command:
        argv: [readlink, -e, "/usr/local/bin/{{ item }}"]
      loop: >-
        {{ developer_managed_tools | selectattr('local', 'contains', ansible_facts['distribution'])
           | map(attribute='bin') | list }}
      register: developer_tool_local_real
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - ('/usr/local/bin/' ~ item) in developer_tool_ids
        - ('/usr/bin/' ~ item) in developer_tool_ids
        - developer_tool_ids['/usr/local/bin/' ~ item] != developer_tool_ids['/usr/bin/' ~ item]

    - name: Find the package that ships each /usr/bin twin
      ansible.builtin.command:
        argv: >-
          {{ (['dpkg-query', '-S'] if ansible_facts['distribution'] == 'Ubuntu'
              else ['rpm', '-qf', '--qf', '%{NAME}\n']) + ['/usr/bin/' ~ item.item] }}
      loop: "{{ developer_tool_local_real.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: developer_tool_owner
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - item.rc | default(1) == 0
        - item.stdout.startswith('/usr/local/')

    # dpkg-query prints `pkg: path` or `pkg:arch: path`; rpm the bare name. A
    # diverted path adds a `diversion by` line naming no package.
    - name: Collect the packages that duplicate a /usr/local/bin tool
      ansible.builtin.set_fact:
        developer_tool_dup_pkgs: >-
          {{ developer_tool_owner.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0)
             | map(attribute='stdout_lines') | flatten | reject('match', '^diversion ')
             | map('regex_replace', ':.*$', '') | unique | list }}

    # A package some repository still offers is the distro's or a vendor's,
    # and updates arrive for it -- not a hand install. Ubuntu reads the cached
    # lists; Fedora asks the enabled repos, and a query that fails keeps it.
    - name: Check whether any repository offers each duplicate package
      ansible.builtin.command:
        argv: >-
          {{ (['apt-cache', 'madison'] if ansible_facts['distribution'] == 'Ubuntu'
              else ['dnf', '-q', 'repoquery', '--available', '--qf', '%{name}\n']) + [item] }}
      loop: "{{ developer_tool_dup_pkgs }}"
      register: developer_tool_dup_origin
      changed_when: false
      failed_when: false
      check_mode: false

    # Simulated first, so a package something else depends on stays: apt would
    # remove the dependants with it, dnf likewise.
    - name: Simulate removing each hand-installed duplicate package
      ansible.builtin.command:
        argv: >-
          {{ (['apt-get', '-s', 'purge'] if ansible_facts['distribution'] == 'Ubuntu'
              else ['rpm', '-e', '--test']) + [item.item] }}
      loop: "{{ developer_tool_dup_origin.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: developer_tool_dup_sim
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - item.rc == 0
        - item.stdout | trim | length == 0

    - name: Purge hand-installed packages that duplicate a /usr/local/bin tool (Ubuntu)
      ansible.builtin.apt:
        name: "{{ item.item.item }}"
        state: absent
        purge: true
        autoremove: false
      loop: "{{ developer_tool_dup_sim.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - item.rc | default(1) == 0
        - developer_tool_dup_also | length == 0
      vars:
        developer_tool_dup_also: >-
          {{ item.stdout_lines | default([]) | select('match', '^(Purg|Remv) ')
             | map('regex_replace', '^\S+ (\S+).*$', '\1') | reject('equalto', item.item.item | default('')) | list }}

    - name: Remove hand-installed packages that duplicate a /usr/local/bin tool (Fedora)
      ansible.builtin.dnf:
        name: "{{ item.item.item }}"
        state: absent
        autoremove: false
      loop: "{{ developer_tool_dup_sim.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when:
        - ansible_facts['distribution'] == 'Fedora'
        - item.rc | default(1) == 0

    - name: Report duplicate packages kept because something depends on them
      ansible.builtin.debug:
        msg: >-
          Kept the hand-installed {{ item.item.item }} package beside its
          /usr/local/bin copy: removing it would also remove
          {{ developer_tool_dup_also | join(', ') if developer_tool_dup_also else item.stderr | trim }}.
      loop: "{{ developer_tool_dup_sim.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when:
        - item.rc is defined
        - item.rc != 0 or developer_tool_dup_also | length > 0
      vars:
        developer_tool_dup_also: >-
          {{ item.stdout_lines | default([]) | select('match', '^(Purg|Remv) ')
             | map('regex_replace', '^\S+ (\S+).*$', '\1') | reject('equalto', item.item.item | default('')) | list }}

# ============================================================================
# CANNOT CO-EXIST — the old thing actively conflicts with its replacement.
# ============================================================================

# OrbStack: free tier is personal, non-commercial use only; business use needs
# a paid seat. Replaced by colima (MIT, free commercial). Both register a
# docker context + socket, so leaving it makes `docker`'s target ambiguous.
# NOTE: uninstalling OrbStack also removes the docker CLI it provided — the
# docker role reinstalls the CLI from brew, so ordering matters.
- name: Remove OrbStack (paid for commercial use; replaced by colima)
  community.general.homebrew_cask:
    name: orbstack
    state: absent
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

- name: Remove the stale OrbStack docker context
  ansible.builtin.command:
    cmd: docker context rm orbstack
  become: false
  register: developer_rm_orbstack_ctx
  changed_when: "'orbstack' in (developer_rm_orbstack_ctx.stdout | default(''))"
  failed_when: false
  when: ansible_facts['distribution'] == 'MacOSX'

# ============================================================================
# RETIRED BY DECISION — dropped from the default install.
# ============================================================================

# Docker Desktop — dropped by decision; on Linux we install Docker Engine (CE)
# from Docker's own repo, and on macOS the CLI only. Declared EXPLICITLY rather
# than left to fall out of a dependency cascade.
#
# Verified on a real long-lived host 2026-07-17: docker-desktop 4.69.0 was
# still installed at /opt/docker-desktop (inactive) months after we stopped
# installing it -- Ansible cannot prune what it stops declaring.
#
# NOT autoremove. Docker Desktop on Linux ships a VM, so its dependency tree
# pulls in the whole QEMU/OVMF stack plus uidmap -- 44 packages on a real host.
# uidmap is the dangerous one: rootless containers call newuidmap at run time
# with no package dependency declaring it, so apt reclaims it and rootless
# breaks silently afterwards.
#
# The orphans stay. They are clutter, and `apt autoremove` remains available to
# whoever wants to reclaim them deliberately, having read the list.
- name: Remove Docker Desktop (Ubuntu - dropped by decision; Engine/CLI replace it)
  ansible.builtin.apt:
    name: docker-desktop
    state: absent
  when: ansible_facts['distribution'] == 'Ubuntu'
  failed_when: false

- name: Remove Docker Desktop (Fedora - dropped by decision; Engine/CLI replace it)
  ansible.builtin.dnf:
    name: docker-desktop
    state: absent
  when: ansible_facts['distribution'] == 'Fedora'
  failed_when: false

# macOS: the Docker Desktop cask is `docker`; the CLI-only install is the brew
# FORMULA `docker` (see docker.yml), a different artefact, so removing the cask
# leaves the CLI intact.
- name: Remove Docker Desktop (macOS - dropped by decision; CLI-only replaces it)
  community.general.homebrew_cask:
    name: docker
    state: absent
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

# The package uninstall above does NOT take the docker context with it: context
# state is a per-user file under ~/.docker/contexts, owned by the user rather
# than the package. What is left points at a socket that no longer exists, and
# where `desktop-linux` is also the SELECTED context every docker command fails
# with "Cannot connect to the Docker daemon" until it is switched back.
#
# Context subcommands do not talk to the daemon, so these still work on a host
# whose selected context is already dead.
- name: Read the current docker context
  ansible.builtin.command:
    cmd: docker context show
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  register: developer_docker_ctx_current
  changed_when: false
  failed_when: false

- name: List the docker contexts
  ansible.builtin.command:
    cmd: docker context ls --quiet
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  register: developer_docker_ctx_list
  changed_when: false
  failed_when: false

# `docker context rm` refuses to remove the context in use, so this has to come
# first.
- name: Switch off the retired Docker Desktop context
  ansible.builtin.command:
    cmd: docker context use default
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  changed_when: true
  failed_when: false
  when: developer_docker_ctx_current.stdout | default('') | trim == 'desktop-linux'

- name: Remove the retired Docker Desktop context
  ansible.builtin.command:
    cmd: docker context rm desktop-linux
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  become_user: "{{ actual_user }}"
  changed_when: true
  failed_when: false
  when: "'desktop-linux' in (developer_docker_ctx_list.stdout_lines | default([]))"

# The uninstall also leaves `credsStore: desktop` in the user's config.json, and
# every pull then dies with "docker-credential-desktop: executable file not
# found" before it reaches the registry. Docker Desktop is retired here by
# decision, so that helper is stale on any host carrying it.
#
# Wrapped: removals.yml is not itself inside a rescue, so a config.json someone
# hand-edited into invalid JSON would otherwise abort the whole run.
- name: Retire the Docker Desktop credential helper
  block:
    - name: Read the docker CLI config
      ansible.builtin.slurp:
        src: "{{ user_home }}/.docker/config.json"
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user }}"
      register: developer_docker_cli_cfg
      failed_when: false

    # Rewritten key by key rather than replaced: `auths` holds the registry
    # credentials the developer logged in with.
    - name: Drop the retired Docker Desktop credential helper
      ansible.builtin.copy:
        content: >-
          {{ (developer_docker_cli_cfg.content | b64decode | from_json)
             | dict2items | rejectattr('key', 'equalto', 'credsStore') | items2dict
             | to_nice_json }}
        dest: "{{ user_home }}/.docker/config.json"
        mode: '0600'
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      become_user: "{{ actual_user }}"
      when:
        - developer_docker_cli_cfg.content is defined
        - (developer_docker_cli_cfg.content | b64decode | from_json).credsStore | default('') == 'desktop'

  rescue:
    - name: Record that the docker credential helper was not retired
      # noqa: var-naming[no-role-prefix] -- deploy_warnings is the shared
      # cross-role accumulator the play summarises at the end
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['docker credsStore: ' ~ (ansible_failed_task.name | default('retire'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('failed'))] }}

# OnlyOffice - retired; LibreOffice is the org office suite now. Remove the
# native package and the Flatpak fallback from hosts that carried it.
- name: Remove OnlyOffice desktop editors (Fedora)
  ansible.builtin.dnf:
    name: onlyoffice-desktopeditors
    state: absent
    autoremove: true
  when: ansible_facts['distribution'] == 'Fedora'
  failed_when: false

- name: Remove OnlyOffice desktop editors (Ubuntu)
  ansible.builtin.apt:
    name: onlyoffice-desktopeditors
    state: absent
    purge: false
    autoremove: false
  when: ansible_facts['distribution'] == 'Ubuntu'
  failed_when: false

- name: Remove OnlyOffice Flatpak
  community.general.flatpak:
    name: org.onlyoffice.desktopeditors
    state: absent
    method: system
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  failed_when: false

# Lens / Freelens (Kubernetes desktop GUIs) - retired; no k8s desktop GUI ships
# now (k9s covers it). Verified on the reference workstation: Freelens present as the
# app.freelens.Freelens flatpak. Remove every form a host might carry.
- name: Remove Freelens (Ubuntu apt)
  ansible.builtin.apt:
    name: freelens
    state: absent
    purge: false
  when: ansible_facts['distribution'] == 'Ubuntu'
  failed_when: false

- name: Remove Freelens (Fedora dnf)
  ansible.builtin.dnf:
    name: freelens
    state: absent
  when: ansible_facts['distribution'] == 'Fedora'
  failed_when: false

- name: Remove retired k8s desktop GUI flatpaks (Freelens, OpenLens)
  community.general.flatpak:
    name: "{{ item }}"
    state: absent
    method: system
  loop:
    - app.freelens.Freelens
    - dev.k8slens.OpenLens
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  failed_when: false

- name: Remove OpenLens (macOS cask - retired)
  community.general.homebrew_cask:
    name: openlens
    state: absent
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

# Slack and Remmina came from Flathub until 741e4b2 moved them to native
# packages, and that commit added no tombstone -- so a host provisioned before
# it runs both copies, with two entries in the app grid and two update paths.
# The native package is the one the repo now manages.
- name: Remove the retired Slack and Remmina flatpaks (superseded by native packages)
  community.general.flatpak:
    name: "{{ item }}"
    state: absent
    method: system
  loop:
    - com.slack.Slack
    - org.remmina.Remmina
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  failed_when: false

# Bitwarden was dropped entirely in 741e4b2, which deleted bitwarden.yml without
# tombstoning anything it had installed. The CLI is covered by the
# /usr/local/bin sweep below; the GUI is not.
- name: Remove the retired Bitwarden GUI flatpak
  community.general.flatpak:
    name: com.bitwarden.desktop
    state: absent
    method: system
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  failed_when: false

- name: Remove the retired Bitwarden GUI and CLI (macOS)
  community.general.homebrew_cask:
    name: bitwarden
    state: absent
  become: false
  environment: "{{ homebrew_cask_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

- name: Remove the retired Bitwarden CLI formula (macOS)
  community.general.homebrew:
    name: bitwarden-cli
    state: absent
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

# The JFrog CLI arrived as a PACKAGE from JFrog's own repo, not as a binary
# drop, so the /usr/local/bin/jfrog entry below never matched anything.
- name: Remove the retired JFrog CLI package
  ansible.builtin.package:
    name: jfrog-cli-v2-jf
    state: absent
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  failed_when: false

- name: Remove the retired JFrog CLI formula (macOS)
  community.general.homebrew:
    name: jfrog-cli
    state: absent
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

# Binaries older versions dropped in /usr/local/bin and no longer install.
# All root-owned with no update path, so they linger indefinitely.
# Verified still present on a real long-lived host 2026-07-17: bw, linear.
#   minikube  — superseded by kind (vanilla kubeadm k8s in docker, closer to
#               the real clusters our helm/argocd work targets)
#   bw        — Bitwarden CLI, removed by decision (741e4b2)
#   linear    — Linear CLI, removed by decision 2026-05-01
#   jfrog     — removed by decision 2026-05-01
#   netbird   — removed by decision 2026-05-01
- name: Remove retired /usr/local/bin binaries
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - minikube
    - bw
    - linear
    - jfrog
    - netbird
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

# Copies a package now supplies (helm, kubectx, k9s, kustomize, gitleaks) are
# not here: each role removes its own once that package is installed -- see
# infrastructure/tasks/superseded.yml and contributor/tasks/superseded.yml.

# ============================================================================
# RETIRED CLI UTILITIES
# ============================================================================
# Dropped from utilities.yml by decision. Removing them from the install list
# does nothing on its own -- Ansible cannot prune what we stop declaring, so
# every host we have ever built keeps them until told.
#
#   telnet, nmap        no business on a default developer box
#   net-tools           superseded by iproute2 (ss, ip) for ~15 years
#   traceroute, whois   niche; install them when you need them
#   tree                superseded by eza/fd. NOT standalone: `pass` depends on
#                       it and docker-desktop depends on `pass`, so removing
#                       tree cascades to both (fine here -- both are going
#                       anyway; it is why removals are dry-run against a real
#                       host first).
#   httpie              superseded by curl for our uses
#
# NOT purged, only removed: `purge` would also delete config a developer may
# have written themselves.
- name: Remove retired CLI utilities (Fedora)
  ansible.builtin.dnf:
    name:
      - telnet
      - net-tools
      - traceroute
      - nmap
      - whois
      - tree
      - httpie
    state: absent
  when: ansible_facts['distribution'] == 'Fedora'
  failed_when: false

# Debian splits two of these, and naming only the headline package leaves the
# tool working:
#   inetutils-telnet, telnet-ssl   the actual providers -- `telnet` is a
#                                  transitional package, so removing it alone
#                                  leaves a working telnet binary on PATH
#   nmap-common                    nmap's data files; apt keeps it when only
#                                  `nmap` is named and autoremove is off
- name: Remove retired CLI utilities (Ubuntu)
  ansible.builtin.apt:
    name:
      - telnet
      - inetutils-telnet
      - telnet-ssl
      - net-tools
      - traceroute
      - nmap
      - nmap-common
      - whois
      - tree
      - httpie
    state: absent
    purge: false
    autoremove: false
  when: ansible_facts['distribution'] == 'Ubuntu'
  failed_when: false

# macOS is deliberately absent. These came from brew, and `brew uninstall` on a
# Mac hits tools the developer may well have installed themselves for their own
# reasons -- on a personal machine, undeclared state is theirs, not ours. The
# Linux boxes are provisioned fleet machines; a Mac is somebody's laptop.

# ============================================================================
# STALE CONFIG — blocks and repo files older versions wrote.
# ============================================================================

# A retired tool's repository outlives the tool. Left configured it keeps
# serving updates for something nobody manages, and every apt update pays for
# fetching it. Both filename forms go: deb822_repository writes .sources, and
# the apt_repository calls these tools used wrote .list.
#
# netbird is deliberately NOT here. It is a VPN agent that may still be the
# live path onto a host, and pulling its repo out from under a running service
# is not a tidy-up.
- name: Remove the retired vendor APT repositories (Ubuntu)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/jfrog-cli.list
    - /etc/apt/sources.list.d/jfrog-cli.sources
    - /etc/apt/sources.list.d/onlyoffice.list
    - /etc/apt/sources.list.d/onlyoffice.sources
    - /etc/apt/sources.list.d/freelens.list
    - /etc/apt/sources.list.d/freelens.sources
    - /usr/share/keyrings/jfrog-cli.asc
  register: developer_retired_repos_removed
  when: ansible_facts['distribution'] == 'Ubuntu'

# apt keeps serving the removed repo from its cached lists until it is told.
- name: Refresh the APT cache after removing the retired repositories
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - developer_retired_repos_removed is changed

- name: Remove the retired vendor YUM repositories (Fedora)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/jfrog-cli.repo
    - /etc/yum.repos.d/onlyoffice.repo
  when: ansible_facts['distribution'] == 'Fedora'

# gnu-tools is retired, so its PATH shim now prepends directories for packages
# we no longer install. blockinfile removes it cleanly via the same marker it
# was written with.
- name: Remove the retired GNU tools PATH shim from ~/.zprofile
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.zprofile"
    marker: "# {mark} HYPERI: GNU tools PATH shim"
    state: absent
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false

# ============================================================================
# RETIRED GNOME EXTENSIONS -- user-scoped, under the desktop user's home.
# ============================================================================

# Window State Manager crashes the whole GNOME session on any host serving RDP.
# Disconnecting removes the virtual monitor, the screen drops to the 640x480
# headless stub, the extension repositions windows onto the monitor that just
# went away, and mutter aborts on window.c:6399 `assertion failed:
# (logical_monitor)`. Losing gnome-shell loses gnome-session, so every
# application in the session dies and the reconnect lands in a fresh session.
# Observed twice in three days on Ubuntu 26.04, GNOME Shell 50.1, mutter
# 50.1-0ubuntu2.2.
#
# The crash is a race, not deterministic -- most disconnects survive the same
# monitor transition -- so leaving it installed but disabled is not a resting
# state anyone can rely on.
#
# Removing the directory rather than calling gext: a tombstone has to work on a
# host with nobody logged in, and gnome-shell ignores a UUID in
# enabled-extensions with no extension behind it.
- name: Remove the retired Window State Manager GNOME extension (crashes gnome-shell on RDP disconnect)
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/gnome-shell/extensions/window-state-manager@kishorv06.github.io"
    state: absent
  become: true
  become_user: "{{ actual_user }}"
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
  failed_when: false
