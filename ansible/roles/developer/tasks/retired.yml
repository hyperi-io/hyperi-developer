---
# Tools this role installed and no longer does. Each goes on any run of the
# role rather than behind the removals opt-in, because only the copies the role
# put there are touched: a /usr/local/bin binary when it resolves under
# /usr/local, the apt package on Ubuntu, and the brew formula on macOS.
#
#   gron  no release since 2022 (tomnomnom/gron): apt on Ubuntu, a release
#         binary on Fedora, brew on macOS
#   dive  no release since 2025-05 (wagoodman/dive): brew on macOS here; the
#         Linux binary is the infrastructure role's

- name: Resolve the retired /usr/local/bin binaries (Linux)
  ansible.builtin.command:
    argv: [readlink, -e, "/usr/local/bin/{{ item }}"]
  loop:
    - gron
  register: developer_retired_resolved
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']

- name: Remove the retired /usr/local/bin binaries (Linux)
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item.item }}"
    state: absent
  loop: "{{ developer_retired_resolved.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - item.rc | default(1) == 0
    - item.stdout.startswith('/usr/local/')

- name: Check for the retired gron package (Ubuntu)
  ansible.builtin.command:
    argv: [dpkg-query, -W, -f, '${db:Status-Abbrev}', gron]
  register: developer_retired_gron_deb
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Remove the retired gron package (Ubuntu)
  ansible.builtin.include_role:
    name: system_cleanup
    tasks_from: purge_packages.yml
    # The include is already gated by this file's tags, and its tasks carry none.
    apply:
      tags: ['always']
  vars:
    system_cleanup_purge_packages: [gron]
    system_cleanup_purge_reason: the retired gron package
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - developer_retired_gron_deb.rc == 0
    - developer_retired_gron_deb.stdout is match('^ii')

- name: Remove the retired Homebrew formulae (macOS)
  community.general.homebrew:
    name:
      - gron
      - dive
    state: absent
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
  failed_when: false
