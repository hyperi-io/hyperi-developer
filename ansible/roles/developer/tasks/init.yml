---
# Bootstrap tasks - run once at the start
# Sets up common variables and validates platform
# NOTE: Package manager lock wait is handled in playbooks/main.yml pre_tasks

- name: Validate supported distribution
  ansible.builtin.fail:
    msg: "Unsupported distribution: {{ ansible_facts['distribution'] }}. Supported: {{ supported_distros | join(', ') }}"
  when: ansible_facts['distribution'] not in supported_distros

- name: Validate Fedora version
  ansible.builtin.fail:
    msg: "Unsupported Fedora version: {{ ansible_facts['distribution_major_version'] }}. Minimum required: {{ min_fedora_version }}"
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - ansible_facts['distribution_major_version'] | int < min_fedora_version

- name: Validate Ubuntu version
  ansible.builtin.fail:
    msg: "Unsupported Ubuntu version: {{ ansible_facts['distribution_version'] }}. Minimum required: {{ min_ubuntu_version }}"
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_version'] is version(min_ubuntu_version, '<')

# Identical to the pre_task in playbooks/main.yml, which an untagged run has
# already executed: a derivation that drops hyperi_target_user re-points every
# user-scoped task in the play at the connecting account.
- name: Detect actual user (for sudo operations)
  ansible.builtin.set_fact:
    actual_user: >-
      {{ hyperi_target_user
         | default(ansible_facts['env'].SUDO_USER
                   | default(ansible_facts['user_id'], true), true) }}

- name: Set actual user home directory (Linux)
  ansible.builtin.set_fact:
    user_home: "{{ '/home/' + actual_user if actual_user != 'root' else '/root' }}"
  when: ansible_facts['distribution'] != 'MacOSX'

- name: Set actual user home directory (macOS)
  ansible.builtin.set_fact:
    user_home: "{{ '/Users/' + actual_user if actual_user != 'root' else '/var/root' }}"
  when: ansible_facts['distribution'] == 'MacOSX'

# A systemd --user instance lives at /run/user/<uid> of the DESKTOP user, and
# ansible_facts['user_uid'] is the CONNECTING user's -- a different account on a
# fleet box. Linux only: macOS has no getent and no systemd --user.
- name: Look up the target user's uid (Linux)
  ansible.builtin.getent:
    database: passwd
    key: "{{ actual_user }}"
  failed_when: false
  changed_when: false
  when: ansible_facts['distribution'] != 'MacOSX'

- name: Set the target user's uid (Linux)
  # noqa: var-naming[no-role-prefix] -- consumed by developer-rust, so it is
  # deliberately play-scoped, not role-scoped.
  ansible.builtin.set_fact:
    actual_user_uid: >-
      {{ ansible_facts.getent_passwd[actual_user][1]
         if (ansible_facts.getent_passwd is defined
             and actual_user in ansible_facts.getent_passwd)
         else ansible_facts['user_uid'] }}
  when: ansible_facts['distribution'] != 'MacOSX'

- name: Display user information
  ansible.builtin.debug:
    msg: "Installing for user: {{ actual_user }} (home: {{ user_home }})"

# Here rather than beside the pnpm install because tag selection can reach a
# consumer without its producer -- `--tags typescript` picks the TypeScript task
# and not the Node one. This file carries `tags: ['always']`.
- name: Set the pnpm environment
  # noqa: var-naming[no-role-prefix] -- consumed by developer-node and
  # developer-typescript, so it is deliberately play-scoped, not role-scoped.
  ansible.builtin.set_fact:
    pnpm_env:
      PNPM_HOME: "{{ user_home }}/.local/share/pnpm"
      # BOTH PNPM_HOME and PNPM_HOME/bin: pnpm reports its global bin directory
      # as the `bin` subdirectory and checks THAT is on PATH, while its own
      # binary lives in PNPM_HOME itself.
      PATH: >-
        {{ user_home }}/.local/share/pnpm:{{ user_home }}/.local/share/pnpm/bin:{{
        user_home }}/.npm-global/bin:{{
        '/opt/homebrew/bin:/usr/local/bin:' if ansible_facts['distribution'] == 'MacOSX' else ''
        }}{{ ansible_facts['env'].PATH }}

- name: Load macOS-specific variables
  ansible.builtin.include_vars:
    file: macos.yml
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Create temporary sudo askpass script (macOS)
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      echo "{{ ansible_become_password }}"
    dest: /tmp/askpass.sh
    mode: '0700'
  become: false
  no_log: true        # the file holds the sudo password -- keep it out of -v/--diff output
  when:
    - ansible_facts['distribution'] == 'MacOSX'
    - ansible_become_password is defined

- name: Install Homebrew (macOS)
  ansible.builtin.shell: |
    export SUDO_ASKPASS=/tmp/askpass.sh
    NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    creates: /opt/homebrew/bin/brew
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# Note: askpass.sh is kept for Docker and other Homebrew cask installs
# It will be cleaned up in system_cleanup role

- name: Add Homebrew to shell profile (macOS)
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.zprofile"
    line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
    create: true
    mode: '0644'
  become: false
  when: ansible_facts['distribution'] == 'MacOSX'

# Check if GNOME is installed (not running - works for Packer headless builds)
- name: Check if GNOME Shell is installed (Linux only)
  ansible.builtin.stat:
    path: /usr/bin/gnome-shell
  register: gnome_shell_installed
  when: ansible_facts['distribution'] != 'MacOSX'

- name: Set GNOME availability fact (Linux - installed check)
  ansible.builtin.set_fact:
    has_gnome: "{{ gnome_shell_installed.stat.exists | default(false) }}"
  when: ansible_facts['distribution'] != 'MacOSX'

- name: Set GNOME availability fact (macOS - N/A)
  ansible.builtin.set_fact:
    has_gnome: false
  when: ansible_facts['distribution'] == 'MacOSX'

- name: Display GNOME status
  ansible.builtin.debug:
    msg: "GNOME desktop: {{ 'Installed' if has_gnome else 'Not installed' }}"

# Install psutil for dconf module (required for GNOME settings tasks)
- name: Install psutil for dconf module (Fedora)
  ansible.builtin.dnf:
    name: python3-psutil
    state: present
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - has_gnome | default(false)

- name: Install psutil for dconf module (Ubuntu)
  ansible.builtin.apt:
    name: python3-psutil
    state: present
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - has_gnome | default(false)

# NOTE: Avatar deployment moved to avatar.yml and called from main.yml
# after desktop.yml installs GNOME (so has_gnome is true)
