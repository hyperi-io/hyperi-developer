---
# Configure OS package repositories (mirrors, performance settings)
# Does NOT add vendor repos (Docker, VS Code, etc.) - those are in individual task files
#
# Tags:
# - fastestmirror: Mirror optimization tasks (skip with --skip-tags fastestmirror)

# ============================================================================
# FEDORA REPOSITORY CONFIGURATION
# ============================================================================

- name: Create DNF conf.d directory (Fedora)
  ansible.builtin.file:
    path: /etc/dnf/dnf.conf.d
    state: directory
    mode: '0755'
  when: ansible_facts['distribution'] == 'Fedora'

- name: Configure DNF performance optimizations (Fedora)
  ansible.builtin.copy:
    dest: /etc/dnf/dnf.conf.d/99-performance.conf
    content: |
      # Performance optimizations
      max_parallel_downloads=20
      fastestmirror=False
      deltarpm=True
      timeout=30
      retries=10
      skip_if_unavailable=True
      metadata_expire=7200
    mode: '0644'
  tags: ['fastestmirror']
  when:
    - ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU REPOSITORY CONFIGURATION
# ============================================================================

# Every vendor repo we add (docker, git-core, node, gh, k8s, gcloud, azure,
# trivy, slack) goes in through deb822_repository, and that module fails hard
# with "python3-debian is not installed" without this package. It is present on
# an Ubuntu DESKTOP because software-properties-common pulls it in, which is why
# this never surfaced -- but on a minimal image (container, cloud image, server
# install) every one of those tasks failed. Installed here because repository
# configuration runs before any of them.
- name: Install the deb822 repository prerequisite (Ubuntu)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
  become: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Configure Ubuntu APT performance
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-performance
    content: |
      # Performance optimizations
      Acquire::http::Dl-Limit "0";
      Acquire::https::Dl-Limit "0";
      Acquire::Queue-Mode "host";
      APT::Get::Assume-Yes "false";
    mode: '0644'
  tags: ['fastestmirror']
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
