---
# Developer Environment - Defaults
# All options are now controlled via tags, not variables.
# Use --skip-tags to disable features, --tags to enable optional ones.

# Supported platforms (used for validation in init.yml)
#
# We support n and n-1, so the declared minimum IS n-1. Both slots roll within
# a year -- when they do, bump these AND ansible/molecule/vars.yml together.
#
#   Fedora 44 (n), 43 (n-1). Fedora only ever supports two releases, so its
#   n-2 is always EOL: 42 went EOL in May 2026, and this was still pinned to
#   it. An EOL minimum means we claim to support a release whose mirrors are
#   archived and whose security updates have stopped.
#
#   Ubuntu 26.04 LTS (n), 24.04 LTS (n-1).
supported_distros:
  - Fedora
  - Ubuntu
  - MacOSX
min_fedora_version: 43
min_ubuntu_version: "24.04"

# Docker configuration
docker_users:
  - "{{ ansible_facts['user_id'] }}"
docker_install_desktop: true
docker_repo_base_url: "https://download.docker.com/linux"
docker_distro_name: "{{ ansible_facts['distribution'] | lower }}"
docker_gpg_url: "{{ docker_repo_base_url }}/{{ docker_distro_name }}/gpg"
docker_repo_url: "{{ docker_repo_base_url }}/{{ docker_distro_name }}"
# Docker's apt repo is per-arch, and it publishes arm64. Hardcoding amd64 here
# pinned the repo to the wrong architecture on every arm64 box. Falls back to
# amd64 only if the playbook-level fact is somehow absent (it is set in
# pre_tasks under `always`, so it should not be).
docker_arch: "{{ hyperi_arch_deb | default('amd64') }}"
# Docker publishes one suite per Ubuntu codename and lags new releases.
# Deriving the suite from the version number installs another release's build
# against the wrong libc, so list what upstream actually publishes.
# Tracks the supported window (min_ubuntu_version), oldest first; the last entry
# is the fallback for a release upstream has not published yet.
docker_supported_suites:
  - noble
  - resolute
# Upstream's docker-ce.repo resolves $releasever against the running Fedora, so
# a release Docker has not built for turns into a 404 at install time.
# Tracks the supported window (min_fedora_version), oldest first; the last entry
# is the fallback for a release upstream has not published yet.
docker_fedora_supported_releases:
  - '43'
  - '44'

# Node.js configuration
#
# NodeSource publishes a repo PER MAJOR (node_24.x, node_22.x) and both provide
# the package `nodejs`, so a box can hold exactly one system-wide major. That is
# the n slot; fnm covers n-1 per user. Majors come from the SSoT -- see
# hyperi_core_versions in inventories/localhost/group_vars/all.yml.
#
# The deb and rpm repos are signed by DIFFERENT keys, so both URLs are carried.
node_major: "{{ hyperi_core_versions.node_major }}"
node_major_previous: "{{ hyperi_core_versions.node_major_previous }}"
nodesource_deb_base_url: "https://deb.nodesource.com"
nodesource_rpm_base_url: "https://rpm.nodesource.com"
nodesource_deb_gpg_url: "{{ nodesource_deb_base_url }}/gpgkey/nodesource-repo.gpg.key"
nodesource_rpm_gpg_url: "{{ nodesource_rpm_base_url }}/gpgkey/ns-operations-public.key"
# fnm ships one asset per arch, and its arm64 asset is not named with the
# Debian token, so it gets its own mapping rather than reusing hyperi_arch_deb.
fnm_version: "{{ hyperi_core_versions.fnm }}"
fnm_asset: "{{ 'fnm-arm64.zip' if hyperi_arch_deb | default('amd64') == 'arm64' else 'fnm-linux.zip' }}"

# GitHub CLI -- GitHub's own signed repo on both distros. No version is pinned:
# the repo always carries latest, which is the point of using it over the
# distro package.
gh_deb_repo_url: "https://cli.github.com/packages"
gh_deb_gpg_url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
# The rpm repo signs with the ASCII-armoured key, not the binary keyring the
# apt repo uses -- these two URLs are taken from GitHub's own gh-cli.repo.
gh_rpm_repo_url: "https://cli.github.com/packages/rpm"
gh_rpm_gpg_url: "https://cli.github.com/packages/githubcli-archive-keyring.asc"

# Launchpad builds the git-core PPA per Ubuntu series, and a new series appears
# only once Launchpad opens it.
# Tracks the supported window (min_ubuntu_version), oldest first; the last entry
# is the fallback for a series Launchpad has not opened yet.
git_ppa_supported_suites:
  - noble
  - resolute

# ============================================================================
# BRANDING / CUSTOMIZATION
# ============================================================================
# Master toggle to disable all branding (avatar, wallpaper)
# Set to false for unbranded/generic installs
branding_enabled: true

# User avatar for GDM login screen (256x256 PNG recommended)
# Set to empty string to skip avatar deployment
# Only deployed if branding_enabled is true
avatar_file: "user-avatar.png"

# Desktop background wallpaper (SVG or PNG)
# Set to empty string to skip background deployment
# Only deployed if branding_enabled is true
background_file: "default-background.svg"

# ============================================================================
# REGIONAL SETTINGS (opt-in)
# ============================================================================
# SSoT for desktop locale/region. Set to a valid locale (e.g. "en_AU.UTF-8")
# to apply GNOME region formats, 24h clock, and matching hunspell dictionary.
# Empty string = skip all regional customisation (default).
# Use --tags region to apply, or set the variable and run with desktop tag.
desktop_region: ""
