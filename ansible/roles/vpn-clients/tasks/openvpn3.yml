---
# OpenVPN 3 client installation

# ============================================================================
# FEDORA - Enable COPR and install
# ============================================================================

- name: Install OpenVPN 3 (Fedora)
  block:
    # dnf5's own copr command, because community.general.copr needs dnf4's python3-dnf, which Fedora Server, cloud and minimal images lack.
    - name: Ensure the dnf5 copr plugin is present
      ansible.builtin.dnf:
        name: dnf5-plugins
        state: present

    - name: Enable OpenVPN 3 COPR repository
      ansible.builtin.command:
        argv: [dnf, -y, copr, enable, dsommers/openvpn3]
        creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:dsommers:openvpn3.repo

    - name: Install OpenVPN 3 client
      ansible.builtin.dnf:
        name: openvpn3-client
        state: present

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - Add OpenVPN repository and install
# ============================================================================

# A failed openvpn-dco-dkms build leaves the kernel packages half-configured and
# every later apt run exits 1, so it goes before the install unless hand-installed.
- name: Remove the OpenVPN DCO kernel module (Ubuntu)
  when: ansible_facts['distribution'] == 'Ubuntu'
  block:
    - name: Check whether the OpenVPN DCO module was installed as a dependency
      ansible.builtin.command:
        cmd: apt-mark showauto openvpn-dco-dkms
      register: vpn_clients_dco_auto
      changed_when: false

    - name: Remove the OpenVPN DCO module installed as a dependency
      ansible.builtin.apt:
        name: openvpn-dco-dkms
        state: absent
        purge: true  # a half-configured package is only removed by a purge
      when: "'openvpn-dco-dkms' in vpn_clients_dco_auto.stdout_lines"

  rescue:
    - name: Record that the OpenVPN DCO module was not removed
      ansible.builtin.set_fact:
        deploy_warnings: >-
          {{ deploy_warnings | default([])
             + ['OpenVPN DCO module: ' ~ (ansible_failed_task.name | default('unknown task'))
                ~ ' -- ' ~ (ansible_failed_result.msg | default('removal failed'))] }}

- name: Install OpenVPN 3 (Ubuntu - optional, warn on failure)
  block:
    - name: Add OpenVPN GPG key
      ansible.builtin.get_url:
        url: https://packages.openvpn.net/packages-repo.gpg
        dest: /etc/apt/keyrings/openvpn.asc
        mode: '0644'

    # Use the running release when OpenVPN publishes it, else the newest suite
    # it does publish -- see openvpn_supported_suites.
    - name: Determine OpenVPN repo codename
      ansible.builtin.set_fact:
        openvpn_codename: >-
          {{ ansible_facts['distribution_release']
             if ansible_facts['distribution_release'] in openvpn_supported_suites
             else openvpn_supported_suites | last }}

    # A host provisioned by an older revision carries openvpn3.list beside the
    # .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy OpenVPN 3 .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/openvpn3.list
        state: absent

    - name: Add OpenVPN 3 repository
      ansible.builtin.deb822_repository:
        name: openvpn3
        types: deb
        uris: "https://packages.openvpn.net/openvpn3/debian"
        suites: "{{ openvpn_codename }}"
        components: main
        signed_by: /etc/apt/keyrings/openvpn.asc
        state: present

    # Without this openvpn3-client's Recommends pulls in openvpn-dco-dkms.
    - name: Install OpenVPN 3
      ansible.builtin.apt:
        name: openvpn3
        state: present
        install_recommends: false
        update_cache: true

  rescue:
    - name: Warn about OpenVPN 3 installation failure
      ansible.builtin.debug:
        msg: "WARNING: OpenVPN 3 installation failed (repository may not support {{ ansible_facts['distribution_release'] }} yet). Install manually if needed for SSO web auth."

    - name: Set OpenVPN 3 install failed fact
      ansible.builtin.set_fact:
        openvpn3_install_failed: true

  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# macOS - Install via Homebrew
# ============================================================================

- name: Install OpenVPN via Homebrew (macOS)
  community.general.homebrew:
    name: openvpn
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
