---
# OpenVPN 3 client installation

# ============================================================================
# FEDORA - Enable COPR and install
# ============================================================================

- name: Install OpenVPN 3 (Fedora)
  block:
    - name: Enable OpenVPN 3 COPR repository
      community.general.copr:
        name: dsommers/openvpn3
        state: enabled

    - name: Install OpenVPN 3 client
      ansible.builtin.dnf:
        name: openvpn3-client
        state: present

  when: ansible_facts['distribution'] == 'Fedora'

# ============================================================================
# UBUNTU - Add OpenVPN repository and install
# ============================================================================

- name: Install OpenVPN 3 (Ubuntu - optional, warn on failure)
  block:
    - name: Add OpenVPN GPG key
      ansible.builtin.get_url:
        url: https://packages.openvpn.net/packages-repo.gpg
        dest: /etc/apt/keyrings/openvpn.asc
        mode: '0644'

    # Use the running release when OpenVPN publishes it, else the newest suite
    # it does publish -- see openvpn_supported_suites.
    - name: Determine OpenVPN repo codename
      ansible.builtin.set_fact:
        openvpn_codename: >-
          {{ ansible_facts['distribution_release']
             if ansible_facts['distribution_release'] in openvpn_supported_suites
             else openvpn_supported_suites | last }}

    # A host provisioned by an older revision carries openvpn3.list beside the
    # .sources this writes, and apt then reads the repo twice.
    - name: Remove the legacy OpenVPN 3 .list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/openvpn3.list
        state: absent

    - name: Add OpenVPN 3 repository
      ansible.builtin.deb822_repository:
        name: openvpn3
        types: deb
        uris: "https://packages.openvpn.net/openvpn3/debian"
        suites: "{{ openvpn_codename }}"
        components: main
        signed_by: /etc/apt/keyrings/openvpn.asc
        state: present

    - name: Install OpenVPN 3
      ansible.builtin.apt:
        name: openvpn3
        state: present
        update_cache: true

  rescue:
    - name: Warn about OpenVPN 3 installation failure
      ansible.builtin.debug:
        msg: "WARNING: OpenVPN 3 installation failed (repository may not support {{ ansible_facts['distribution_release'] }} yet). Install manually if needed for SSO web auth."

    - name: Set OpenVPN 3 install failed fact
      ansible.builtin.set_fact:
        openvpn3_install_failed: true

  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# macOS - Install via Homebrew
# ============================================================================

- name: Install OpenVPN via Homebrew (macOS)
  community.general.homebrew:
    name: openvpn
    state: present
  become: false
  environment: "{{ homebrew_env }}"
  when: ansible_facts['distribution'] == 'MacOSX'
