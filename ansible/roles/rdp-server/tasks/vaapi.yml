---
# Installs drivers and only reports, as GRD picks hardware encode itself, and probes the APIs GRD uses (NVENC, VA-API) not the GPU vendor.

# ============================================================================
# DRIVERS
# ============================================================================
# Mesa covers AMD, virtio and nouveau (in mesa-libgallium from Ubuntu 26.04), and NVIDIA's encoder needs its proprietary driver, not installed here.

- name: Set the hardware encode driver packages
  ansible.builtin.set_fact:
    rdp_hwenc_packages: >-
      {{ (['mesa-libgallium'] if ansible_facts['distribution_version'] is version('26.04', '>=')
          else ['mesa-va-drivers'])
         + ['mesa-vulkan-drivers', 'vainfo', 'vulkan-tools']
         if ansible_facts['distribution'] == 'Ubuntu' else
         ['mesa-va-drivers', 'mesa-vulkan-drivers', 'libva-utils', 'vulkan-tools'] }}
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - dri_device.stat.exists | default(false)

- name: Install hardware encode drivers (Ubuntu)
  ansible.builtin.apt:
    name: "{{ rdp_hwenc_packages }}"
    state: present
    update_cache: true
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - has_gnome
    - dri_device.stat.exists | default(false)

- name: Install hardware encode drivers (Fedora)
  ansible.builtin.dnf:
    name: "{{ rdp_hwenc_packages }}"
    state: present
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - has_gnome
    - dri_device.stat.exists | default(false)

# Ubuntu multiverse or Fedora RPM Fusion carries it, and neither is guaranteed.
- name: Install the Intel VA-API driver
  ansible.builtin.package:
    name: "{{ 'intel-media-va-driver-non-free' if ansible_facts['distribution'] == 'Ubuntu' else 'intel-media-driver' }}"
    state: present
  register: rdp_intel_va
  ignore_errors: true  # noqa: ignore-errors
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - dri_device.stat.exists | default(false)
    - rdp_gpu_vendor | default('none') == 'intel'

- name: Warn when the Intel VA-API driver is not installable
  ansible.builtin.debug:
    msg: >-
      Intel VA-API driver not installed ({{ rdp_intel_va.msg | default('unknown error') }}).
      Enable multiverse (Ubuntu) or RPM Fusion (Fedora) for hardware encode.
  when:
    - rdp_intel_va is failed

# ============================================================================
# PROBES -- report only, nothing below changes the host
# ============================================================================

- name: Probe VA-API for H.264 encode
  ansible.builtin.command:
    cmd: vainfo --display drm
  register: rdp_vainfo
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - dri_device.stat.exists | default(false)

- name: Probe Vulkan for a hardware device
  ansible.builtin.command:
    cmd: vulkaninfo --summary
  register: rdp_vulkaninfo
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - dri_device.stat.exists | default(false)

- name: Probe for the NVIDIA encode libraries
  ansible.builtin.command:
    cmd: ldconfig -p
  register: rdp_ldconfig
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

# llvmpipe reports PHYSICAL_DEVICE_TYPE_CPU, which GRD rejects for having no
# render node, so only the three GPU device types count.
- name: Work out which GRD hardware encode path is usable
  ansible.builtin.set_fact:
    rdp_vaapi_h264_encode: "{{ rdp_vainfo.stdout | default('') is search('VAProfileH264High\\s*:\\s*VAEntrypointEncSlice') }}"
    rdp_vulkan_gpu: "{{ rdp_vulkaninfo.stdout | default('') is search('PHYSICAL_DEVICE_TYPE_(INTEGRATED|DISCRETE|VIRTUAL)_GPU') }}"
    rdp_nvenc: >-
      {{ (rdp_ldconfig.stdout | default('') is search('libnvidia-encode\.so\.1'))
         and (rdp_ldconfig.stdout | default('') is search('libcuda\.so\.1')) }}
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

- name: Display hardware encode status
  ansible.builtin.debug:
    msg: |
      GRD hardware encode: {{ 'NVENC' if rdp_nvenc | bool
                              else 'VA-API' if (rdp_vaapi_h264_encode | bool and rdp_vulkan_gpu | bool)
                              else 'none -- software RFX on the CPU' }}
      - VA-API H.264 encode: {{ 'yes' if rdp_vaapi_h264_encode | bool else 'no' }}
      - Hardware Vulkan device: {{ 'yes' if rdp_vulkan_gpu | bool else 'no' }}
      - NVIDIA encode libraries: {{ 'yes' if rdp_nvenc | bool else 'no' }}
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
