---
# Enable and configure GNOME Remote Desktop system service

# ============================================================================
# INITIALIZE SYSTEM SERVICE (required for headless/CLI setup)
# ============================================================================

- name: Initialize gnome-remote-desktop system users
  ansible.builtin.command:
    cmd: systemd-sysusers
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
  failed_when: false
  changed_when: false

- name: Initialize gnome-remote-desktop tmpfiles
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
  failed_when: false
  changed_when: false

# ============================================================================
# GRD PROCESS PRIORITY
# ============================================================================
# Nice=-10 on every host, because a key-up delayed past the repeat delay by a loaded CPU types repeated characters even with a hardware encoder.

- name: Create GRD system service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/gnome-remote-desktop.service.d
    state: directory
    mode: '0755'
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

- name: Create GRD user handover service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/user/gnome-remote-desktop-handover.service.d
    state: directory
    mode: '0755'
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

- name: Deploy GRD priority override (system service)
  ansible.builtin.copy:
    src: grd-priority.conf
    dest: /etc/systemd/system/gnome-remote-desktop.service.d/priority.conf
    mode: '0644'
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

- name: Deploy GRD priority override (user handover service)
  ansible.builtin.copy:
    src: grd-priority.conf
    dest: /etc/systemd/user/gnome-remote-desktop-handover.service.d/priority.conf
    mode: '0644'
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

# ============================================================================
# KEEP NEEDRESTART AWAY FROM GRD
# ============================================================================
# A needrestart restart of the system daemon orphans every live Remote Login session until a reboot.

- name: Create needrestart drop-in directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: '0755'
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - has_gnome

- name: Exclude GRD from needrestart service restarts
  ansible.builtin.copy:
    src: needrestart-grd.conf
    dest: /etc/needrestart/conf.d/50-gnome-remote-desktop.conf
    mode: '0644'
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - has_gnome

# ============================================================================
# ENABLE GNOME REMOTE DESKTOP SERVICE
# ============================================================================

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

- name: Enable gnome-remote-desktop system service
  ansible.builtin.systemd:
    name: gnome-remote-desktop.service
    enabled: true
    state: started
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

# ============================================================================
# CONFIGURE RDP VIA GRDCTL
# ============================================================================

- name: Enable RDP via grdctl
  ansible.builtin.command:
    cmd: grdctl --system rdp enable
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
  failed_when: false
  changed_when: false

- name: Disable view-only mode (allow input)
  ansible.builtin.command:
    cmd: grdctl --system rdp disable-view-only
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
  failed_when: false
  changed_when: false

# ============================================================================
# SET DEFAULT RDP CREDENTIALS
# ============================================================================

# rdp_effective_password carries the precedence credentials.yml settles (supplied > previously generated > new).
- name: Set RDP credentials
  ansible.builtin.command:
    cmd: "grdctl --system rdp set-credentials {{ rdp_username }} {{ rdp_effective_password }}"
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - rdp_effective_password is defined
  failed_when: false
  changed_when: false
  no_log: true  # Hide password from logs

# ============================================================================
# RESTART SERVICE TO APPLY CONFIGURATION
# ============================================================================
# Skipped while a session is live, because a restart orphans it until a reboot.

- name: Check for a live GNOME Remote Desktop session
  ansible.builtin.command:
    cmd: pgrep -f '^[^ ]*gnome-remote-desktop-daemon --handover'
  register: rdp_live_session
  check_mode: false
  changed_when: false
  failed_when: rdp_live_session.rc > 1
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome

- name: Restart RDP service to apply configuration
  ansible.builtin.systemd:
    name: gnome-remote-desktop.service
    state: restarted
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - rdp_live_session.rc == 1

- name: Report configuration waiting for a reboot
  ansible.builtin.debug:
    msg: >-
      A GNOME Remote Desktop handover daemon is running, so
      gnome-remote-desktop.service was not restarted. The new configuration
      applies at the next reboot.
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
    - rdp_live_session.rc == 0

# ============================================================================
# STATUS & USER INSTRUCTIONS
# ============================================================================

- name: Display RDP configuration status
  ansible.builtin.debug:
    msg: |
      GNOME Remote Login configured (NOT Desktop Sharing):
      - Remote Login (RDP): ENABLED on port 3389
      - Credentials: {{ 'set from rdp_password for ' ~ rdp_username if rdp_password is defined
                        else 'generated for ' ~ rdp_username ~ ' -- see ' ~ rdp_credentials_file if rdp_generated_password is defined
                        else 'reused from ' ~ rdp_credentials_file if rdp_effective_password is defined
                        else 'already set in Remote Login, left unchanged' }}

      RDP Access:
      - Connect to: {{ ansible_facts['hostname'] }}:3389 (or {{ ansible_facts['default_ipv4'].address | default('IP') }}:3389)
      - Change password: sudo grdctl --system rdp set-credentials <user> <pass>
      {% if rdp_effective_password is defined and rdp_password is not defined %}
        (and update {{ rdp_credentials_file }}, or the next run will set it back)
      {% endif %}
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - has_gnome
