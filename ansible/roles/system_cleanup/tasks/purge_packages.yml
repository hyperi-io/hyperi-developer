---
# Remove system_cleanup_purge_packages without taking anything else with it, now or
# later.
#
# Now: a removal that would also take a package outside the list -- something
# depends on one of them -- is refused and reported instead.
#
# Later: dependencies only these packages needed become orphans, and
# hyperi-update runs `apt-get autoremove` / `dnf autoremove` unattended, which
# would then remove them -- gcc, binutils and libc6-dev among them for the
# distro Go. Anything the removal would newly orphan is marked manually
# installed first, so it stays until someone removes it on purpose.
#
# Inputs: system_cleanup_purge_packages (installed package names) and
# system_cleanup_purge_reason (why they go, for the report).

- name: Simulate removing {{ system_cleanup_purge_reason }}
  ansible.builtin.command:
    argv: >-
      {{ (['apt-get', '-s', 'purge'] if ansible_facts['distribution'] == 'Ubuntu'
          else ['rpm', '-e', '--test']) + system_cleanup_purge_packages }}
  become: true
  register: system_cleanup_purge_sim
  changed_when: false
  failed_when: false
  check_mode: false

# apt names a dependant in the plan; rpm refuses outright.
- name: Note what else the removal would take, for {{ system_cleanup_purge_reason }}
  ansible.builtin.set_fact:
    system_cleanup_purge_blocked: >-
      {{ system_cleanup_purge_sim.rc != 0
         or (system_cleanup_purge_sim.stdout_lines | default([]) | select('match', '^(Purg|Remv) ')
             | map('regex_replace', '^\S+ (\S+).*$', '\1') | reject('in', system_cleanup_purge_packages)
             | list | length > 0) }}
    system_cleanup_purge_dependants: >-
      {{ system_cleanup_purge_sim.stdout_lines | default([]) | select('match', '^(Purg|Remv) ')
         | map('regex_replace', '^\S+ (\S+).*$', '\1') | reject('in', system_cleanup_purge_packages) | list }}

- name: Report a package kept because something depends on it, {{ system_cleanup_purge_reason }}
  ansible.builtin.debug:
    msg: >-
      Kept {{ system_cleanup_purge_packages | join(', ') }} ({{ system_cleanup_purge_reason }}):
      {{ ('removing it would also remove ' ~ system_cleanup_purge_dependants | join(', '))
         if system_cleanup_purge_dependants
         else ('the package manager refused the removal: '
               ~ system_cleanup_purge_sim.stderr | default('') | trim) }}
  when: system_cleanup_purge_blocked | bool

- name: Remove the packages, {{ system_cleanup_purge_reason }}
  when: not system_cleanup_purge_blocked | bool
  block:
    - name: List the packages already orphaned
      ansible.builtin.command:
        argv: >-
          {{ ['apt-get', '-s', 'autoremove'] if ansible_facts['distribution'] == 'Ubuntu'
             else ['dnf', '-q', 'repoquery', '--unneeded', '--qf', '%{name}\n'] }}
      become: true
      register: system_cleanup_purge_orphans_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: List the packages the removal would orphan
      ansible.builtin.command:
        argv: >-
          {{ (['apt-get', '-s', 'purge', '--autoremove'] if ansible_facts['distribution'] == 'Ubuntu'
              else ['dnf', 'remove', '--assumeno']) + system_cleanup_purge_packages }}
      become: true
      register: system_cleanup_purge_orphans_after
      changed_when: false
      failed_when: false
      check_mode: false

    # apt: the Remv/Purg lines of each plan. dnf: the "Removing unused
    # dependencies" table of the plan, and the bare names of the query.
    - name: Name the packages the removal newly orphans
      ansible.builtin.set_fact:
        system_cleanup_purge_new_orphans: >-
          {{ (_after | reject('in', _before) | reject('in', system_cleanup_purge_packages) | list) }}
      vars:
        _before: >-
          {{ (system_cleanup_purge_orphans_before.stdout_lines | default([]) | select('match', '^(Purg|Remv) ')
              | map('regex_replace', '^\S+ (\S+).*$', '\1') | list)
             if ansible_facts['distribution'] == 'Ubuntu'
             else (system_cleanup_purge_orphans_before.stdout_lines | default([]) | map('trim') | select | list) }}
        _after: >-
          {{ (system_cleanup_purge_orphans_after.stdout_lines | default([]) | select('match', '^(Purg|Remv) ')
              | map('regex_replace', '^\S+ (\S+).*$', '\1') | list)
             if ansible_facts['distribution'] == 'Ubuntu'
             else ((system_cleanup_purge_orphans_after.stdout | default('')
                    | regex_findall('(?s)Removing unused dependencies:\n(.*?)(?:\n\S|\n\n|$)') | first | default(''))
                   .splitlines() | map('trim') | select | map('regex_replace', ' .*$', '') | list) }}

    - name: Keep the packages the removal would orphan
      ansible.builtin.command:
        argv: >-
          {{ (['apt-mark', 'manual'] if ansible_facts['distribution'] == 'Ubuntu'
              else ['dnf', '-y', 'mark', 'user']) + system_cleanup_purge_new_orphans }}
      become: true
      changed_when: true
      when: system_cleanup_purge_new_orphans | length > 0

    - name: Purge on Ubuntu, {{ system_cleanup_purge_reason }}
      ansible.builtin.apt:
        name: "{{ system_cleanup_purge_packages }}"
        state: absent
        purge: true
        autoremove: false
      become: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove on Fedora, {{ system_cleanup_purge_reason }}
      ansible.builtin.dnf:
        name: "{{ system_cleanup_purge_packages }}"
        state: absent
        autoremove: false
      become: true
      when: ansible_facts['distribution'] == 'Fedora'
