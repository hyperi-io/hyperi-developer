---
# Homebrew lives outside the default PATH of a non-login Ansible shell.
packer_homebrew_env:
  PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:{{ ansible_facts['env'].PATH }}"

# Ubuntu shares this key path with other tooling, so a host it configured converges onto one trusted file.
packer_hashicorp_key_dest: >-
  {{ '/usr/share/keyrings/hashicorp-archive-keyring.asc' if ansible_facts['distribution'] == 'Ubuntu'
     else '/etc/pki/rpm-gpg/RPM-GPG-KEY-hashicorp' }}
