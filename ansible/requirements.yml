---
# Collections the roles and the molecule scenarios need.
#
# Both scenarios pointed at a `requirements.yml` that did not exist, with
# `ignore-errors: true`, so the dependency step warned and moved on and the
# collections were whatever happened to be on the box.
#
# Install with: ansible-galaxy collection install -r requirements.yml

# Floors, not pins: latest is this project's default everywhere, so these record
# the oldest release known to carry the modules the roles call and leave the
# upper end open. Raise a floor only after testing against it.
collections:
  # snap, flatpak, homebrew, homebrew_cask, npm and dconf -- the install modules
  # this project is built on.
  - name: community.general
    version: ">=13.0.0"

  # Required by the molecule docker driver, not by any role.
  - name: community.docker
    version: ">=5.0.0"

  # tests/proxmox/create.yml and reset.yml. The proxmox_* modules left
  # community.general for this collection and are removed from it at 15.0.0,
  # which the floor above will reach.
  - name: community.proxmox
    version: ">=1.0.0"
  - name: ansible.posix
    version: ">=2.0.0"
