name: Semantic Release

on:
  # Release only after the CodeQL scan passes on main -- gates on the one
  # workflow this repo actually runs. This used to name "CI", a workflow that
  # does not exist here, so the trigger never fired and nothing released for the
  # ~56 commits between v2.23.14 (Feb) and this fix. CodeQL is GitHub's default
  # setup rather than a committed file; if workflow_run proves unreliable
  # against it, fall back to `push: branches: [main]` (how every release up to
  # v2.23.14 was cut). workflow_dispatch stays as the manual escape hatch.
  workflow_run:
    workflows: ["CodeQL"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Version and Tag
    # Skip if CI failed (workflow_dispatch always runs)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@latest \
            @semantic-release/changelog@latest \
            @semantic-release/commit-analyzer@latest \
            @semantic-release/release-notes-generator@latest \
            @semantic-release/exec@latest \
            @semantic-release/git@latest \
            @semantic-release/github@latest \
            conventional-changelog-conventionalcommits@latest

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          semantic-release

          # Check if a version was created
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
            echo "Released version: ${VERSION}"
          else
            echo "No version created (no releasable commits)"
          fi
