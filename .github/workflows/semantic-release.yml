name: Semantic Release

on:
  # Release only after the CodeQL scan passes on main -- gates on the one
  # workflow this repo actually runs. This used to name "CI", a workflow that
  # does not exist here, so the trigger never fired and nothing released for the
  # ~56 commits between v2.23.14 (Feb) and this fix. CodeQL is GitHub's default
  # setup rather than a committed file; if workflow_run proves unreliable
  # against it, fall back to `push: branches: [main]` (how every release up to
  # v2.23.14 was cut). workflow_dispatch stays as the manual escape hatch.
  workflow_run:
    workflows: ["CodeQL"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Version and Tag
    # Skip if CI failed (workflow_dispatch always runs)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}

    steps:
      # The built-in GITHUB_TOKEN, not a GitHub App: main is unprotected, so it
      # can push the VERSION/CHANGELOG bump and the tags. The App approach this
      # replaced needed GH_APP_ID / GH_APP_PRIVATE_KEY secrets that were never
      # configured here, so the release could not authenticate at all. Trade-off
      # accepted: release commits are attributed to github-actions[bot] and do
      # not trigger downstream workflows -- the @semantic-release/git commit
      # carries [skip ci] anyway, so nothing is lost.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@latest \
            @semantic-release/changelog@latest \
            @semantic-release/commit-analyzer@latest \
            @semantic-release/release-notes-generator@latest \
            @semantic-release/exec@latest \
            @semantic-release/git@latest \
            @semantic-release/github@latest \
            conventional-changelog-conventionalcommits@latest

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release

          # Check if a version was created
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
            echo "Released version: ${VERSION}"
          else
            echo "No version created (no releasable commits)"
          fi
