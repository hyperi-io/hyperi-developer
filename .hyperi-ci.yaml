# hyperi-ci configuration.
#
# This repo is Ansible and shell. The only JavaScript is package.json, which
# carries the semantic-release scripts, and that marker alone is enough for
# hyperi-ci to run the whole TypeScript stage against a repo with no JS source.
# There is no Ansible handler, so the test stage is pointed at the real checks
# through the `test` script (see the test section below).

quality:
  # The Windows 11 SOE is PowerShell and is not currently maintained. Excluded
  # from the scanners until it is picked back up, rather than carrying findings
  # nobody is acting on.
  exclude_paths:
    - windows

  typescript:
    # Warn rather than block. Both open advisories are in `tar` and
    # `brace-expansion`, bundled inside the `npm` that @semantic-release/npm
    # vendors -- npm cannot patch a bundled dependency, and the only offered
    # remedy downgrades semantic-release.
    #
    # The release workflow installs semantic-release globally at @latest and
    # never installs from this tree, so nothing CI runs is built from the
    # audited dependency graph.
    #
    # Kept visible rather than disabled, and `hyperi-ci check --strict`
    # promotes it back to blocking.
    audit: warn

publish:
  # This repo has NO publish target. A release here is a tag, a CHANGELOG
  # commit and a GitHub Release -- v2.24.4 shipped zero assets, and install.sh
  # is run from a clone rather than fetched from a registry. `publish` stays
  # enabled because that is what tags and cuts the release.
  destinations_oss:
    # Nothing here is an npm package. package.json exists only to carry the
    # semantic-release scripts, and the same detection that picks the
    # TypeScript quality handler also aims publish at npmjs, which fails
    # preflight on a missing NPM_TOKEN and blocks the release outright.
    #
    # A false positive, not a real destination that lost its token: supplying
    # one would put an Ansible installer on a public registry.
    npm: false

test:
  # The TypeScript handler runs `npm test`, which here is tools/ci/run-tests.sh
  # -- the playbook syntax check, an advisory ansible-lint pass and shellcheck.
  # Each step skips when its tool is absent, so a bare Node runner stays green.
  #
  # molecule and tests/proxmox are deliberately outside it: the first is
  # delegated against a real workstation it mutates, the second needs a Proxmox
  # endpoint.
  #
  # Stops `-- --coverage` being appended to a script that takes no flags.
  coverage: false
